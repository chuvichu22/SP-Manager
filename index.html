{"returncode":0,"stdout":"<!DOCTYPE html>\n<html lang=\"ko\" data-theme=\"light\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>행사자 성장관리 시스템</title>\n<!-- SheetJS(xlsx) 라이브러리: 엑셀(.xlsx/.xls) 파일을 ArrayBuffer로 읽어 파싱하기 위해 사용합니다. -->\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"></script>\n<style>\n/* =========================================================================\n   행사자 성장관리 시스템 - 전역 스타일\n   디자인 톤: Apple 스타일 (밝은 그레이 배경 + 화이트 카드 + 블루 포인트)\n   ========================================================================= */\n:root{\n  --bg:#f5f5f7;\n  --bg-elevated:#ffffff;\n  --bg-soft:#eceef1;\n  --text:#1d1d1f;\n  --text-secondary:#6e6e73;\n  --border:rgba(0,0,0,0.08);\n  --shadow:0 2px 10px rgba(0,0,0,0.06);\n  --shadow-lg:0 8px 30px rgba(0,0,0,0.10);\n  --accent:#0071e3;\n  --accent-soft:#e8f2fe;\n  --good:#34c759;      /* 우수그룹 */\n  --good-soft:#e7f8ec;\n  --growth:#ff9f0a;     /* 성장그룹 */\n  --growth-soft:#fff3e0;\n  --improve:#ff3b30;    /* 개선그룹 */\n  --improve-soft:#ffeceb;\n  --radius:16px;\n  --radius-sm:10px;\n  --nav-w:230px;\n}\n[data-theme=\"dark\"]{\n  --bg:#000000;\n  --bg-elevated:#1c1c1e;\n  --bg-soft:#2c2c2e;\n  --text:#f5f5f7;\n  --text-secondary:#98989d;\n  --border:rgba(255,255,255,0.1);\n  --shadow:0 2px 10px rgba(0,0,0,0.4);\n  --shadow-lg:0 8px 30px rgba(0,0,0,0.5);\n  --accent:#0a84ff;\n  --accent-soft:#0a3a63;\n  --good-soft:#0e2f18;\n  --growth-soft:#3a2a06;\n  --improve-soft:#3a1210;\n}\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;height:100%;}\nbody{\n  font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"SF Pro Display\",\"Segoe UI\",Roboto,\"Malgun Gothic\",sans-serif;\n  background:var(--bg);\n  color:var(--text);\n  transition:background .3s ease,color .3s ease;\n  -webkit-font-smoothing:antialiased;\n  overscroll-behavior:none;\n}\nbutton,input,select,textarea{font-family:inherit;}\n::-webkit-scrollbar{width:8px;height:8px;}\n::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:8px;}\n\n/* ---------- 레이아웃 ---------- */\n#app{display:flex;min-height:100vh;}\n.sidebar{\n  width:var(--nav-w);\n  flex-shrink:0;\n  background:var(--bg-elevated);\n  border-right:1px solid var(--border);\n  padding:20px 14px;\n  position:fixed;top:0;bottom:0;left:0;\n  overflow-y:auto;\n  z-index:100;\n  transition:transform .25s ease;\n}\n.sidebar .brand{\n  font-size:19px;font-weight:800;padding:8px 10px 18px;letter-spacing:-.3px;\n  display:flex;align-items:center;gap:8px;\n}\n.sidebar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}\n.nav-item{\n  display:flex;align-items:center;gap:10px;\n  padding:11px 12px;border-radius:var(--radius-sm);\n  color:var(--text-secondary);font-size:14.5px;font-weight:600;\n  cursor:pointer;margin-bottom:2px;user-select:none;\n  transition:background .15s ease,color .15s ease;\n}\n.nav-item .ico{font-size:16px;width:20px;text-align:center;}\n.nav-item:hover{background:var(--bg-soft);color:var(--text);}\n.nav-item.active{background:var(--accent);color:#fff;}\n.nav-sep{height:1px;background:var(--border);margin:12px 4px;}\n.nav-footer{margin-top:auto;padding:12px 10px;}\n.theme-toggle{\n  display:flex;align-items:center;justify-content:space-between;\n  padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-soft);\n  font-size:13px;font-weight:600;color:var(--text-secondary);\n}\n.switch{position:relative;width:42px;height:24px;background:#c7c7cc;border-radius:20px;cursor:pointer;transition:.2s;flex-shrink:0;}\n.switch.on{background:var(--accent);}\n.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}\n.switch.on::after{left:20px;}\n\n.main{margin-left:var(--nav-w);flex:1;padding:26px 32px 80px;max-width:1400px;width:100%;}\n.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}\n.topbar h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.4px;}\n.topbar .sub{color:var(--text-secondary);font-size:13.5px;margin-top:4px;}\n.hamburger{display:none;}\n\n/* ---------- 공통 카드/버튼 ---------- */\n.card{\n  background:var(--bg-elevated);border-radius:var(--radius);\n  border:1px solid var(--border);box-shadow:var(--shadow);\n  padding:20px;animation:fadeUp .35s ease both;\n}\n@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}\n.grid{display:grid;gap:16px;}\n.grid.cols-4{grid-template-columns:repeat(4,1fr);}\n.grid.cols-3{grid-template-columns:repeat(3,1fr);}\n.grid.cols-2{grid-template-columns:repeat(2,1fr);}\n@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}\n@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}\n\n.btn{\n  display:inline-flex;align-items:center;gap:6px;justify-content:center;\n  border:none;border-radius:980px;padding:9px 18px;font-size:13.5px;font-weight:700;\n  cursor:pointer;transition:transform .1s ease,opacity .15s ease,background .15s ease;\n  background:var(--bg-soft);color:var(--text);white-space:nowrap;\n}\n.btn:active{transform:scale(.96);}\n.btn.primary{background:var(--accent);color:#fff;}\n.btn.primary:hover{opacity:.9;}\n.btn.danger{background:var(--improve);color:#fff;}\n.btn.ghost{background:transparent;color:var(--accent);}\n.btn.sm{padding:6px 12px;font-size:12.5px;}\n.btn:disabled{opacity:.4;cursor:not-allowed;}\n\n.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:980px;font-size:11.5px;font-weight:700;}\n.badge.good{background:var(--good-soft);color:var(--good);}\n.badge.growth{background:var(--growth-soft);color:var(--growth);}\n.badge.improve{background:var(--improve-soft);color:var(--improve);}\n.badge.neutral{background:var(--bg-soft);color:var(--text-secondary);}\n\ninput[type=text],input[type=date],input[type=number],select,textarea{\n  width:100%;padding:10px 12px;border-radius:var(--radius-sm);\n  border:1px solid var(--border);background:var(--bg);color:var(--text);\n  font-size:13.5px;outline:none;transition:border .15s ease;\n}\ninput:focus,select:focus,textarea:focus{border-color:var(--accent);}\nlabel.field-label{font-size:12.5px;font-weight:700;color:var(--text-secondary);display:block;margin:0 0 6px;}\n.field{margin-bottom:14px;}\ntextarea{resize:vertical;min-height:70px;}\n\n/* ---------- 대시보드 ---------- */\n.stat-card{position:relative;overflow:hidden;}\n.stat-card .label{font-size:12.5px;color:var(--text-secondary);font-weight:700;margin-bottom:8px;}\n.stat-card .value{font-size:30px;font-weight:800;letter-spacing:-.5px;}\n.stat-card .value small{font-size:15px;font-weight:700;color:var(--text-secondary);}\n.stat-card .icon{position:absolute;right:14px;top:14px;font-size:22px;opacity:.5;}\n.progress-bar{height:8px;border-radius:8px;background:var(--bg-soft);overflow:hidden;margin-top:10px;}\n.progress-bar > div{height:100%;border-radius:8px;background:var(--accent);transition:width .5s ease;}\n\n.section-title{font-size:16px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}\n.section-title .cnt{font-size:12px;font-weight:700;color:var(--text-secondary);background:var(--bg-soft);padding:2px 9px;border-radius:980px;}\n\n/* 커스텀 차트 (canvas 없이 div로 구현) */\n.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;}\n.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}\n.bar-chart .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);transition:height .5s ease;position:relative;}\n.bar-chart .bar .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;}\n.bar-chart .lbl{font-size:11px;color:var(--text-secondary);font-weight:600;}\n\n.donut-wrap{display:flex;align-items:center;gap:18px;}\n.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;\n  background:conic-gradient(var(--good) 0 var(--p1),var(--growth) var(--p1) var(--p2),var(--improve) var(--p2) 100%);\n  position:relative;\n}\n.donut::after{content:attr(data-total);position:absolute;inset:16px;background:var(--bg-elevated);border-radius:50%;\n  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;}\n.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px;}\n.legend-dot{width:10px;height:10px;border-radius:3px;}\n\n/* ---------- 리스트 / 테이블 ---------- */\n.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}\n.toolbar input, .toolbar select{width:auto;min-width:150px;}\n.toolbar .grow{flex:1;min-width:200px;}\n\n.staff-table{width:100%;border-collapse:collapse;}\n.staff-table th{text-align:left;font-size:12px;color:var(--text-secondary);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);}\n.staff-table td{padding:12px;border-bottom:1px solid var(--border);font-size:13.5px;}\n.staff-table tr.row{cursor:pointer;transition:background .12s ease;}\n.staff-table tr.row:hover{background:var(--bg-soft);}\n.staff-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);\n  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:8px;}\n.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary);}\n.empty-state .emoji{font-size:40px;margin-bottom:10px;}\n\n/* ---------- 탭 ---------- */\n.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;padding-bottom:0;}\n.tab-btn{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--text-secondary);cursor:pointer;\n  border-bottom:2px solid transparent;white-space:nowrap;}\n.tab-btn.active{color:var(--accent);border-color:var(--accent);}\n\n/* ---------- 리스트 아이템 (목표/활동/고객/메모) ---------- */\n.item-row{\n  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--radius-sm);\n  background:var(--bg-soft);margin-bottom:8px;\n}\n.item-row .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;\n  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;}\n.item-row .check.done{background:var(--good);border-color:var(--good);color:#fff;font-size:13px;}\n.item-row .content{flex:1;min-width:0;}\n.item-row .title{font-weight:700;font-size:13.8px;}\n.item-row .title.strike{text-decoration:line-through;color:var(--text-secondary);}\n.item-row .meta{font-size:12px;color:var(--text-secondary);margin-top:3px;}\n.item-row .actions{display:flex;gap:6px;flex-shrink:0;}\n.icon-btn{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);\n  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}\n.icon-btn:hover{background:var(--border);}\n\n/* ---------- 타임라인 ---------- */\n.timeline{position:relative;padding-left:26px;}\n.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border);}\n.tl-item{position:relative;padding-bottom:22px;}\n.tl-item::before{content:'';position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg-elevated);box-shadow:0 0 0 2px var(--accent);}\n.tl-item .date{font-size:11.5px;color:var(--text-secondary);font-weight:700;}\n.tl-item .txt{font-size:14px;font-weight:700;margin-top:3px;}\n.tl-item .sub{font-size:12.5px;color:var(--text-secondary);margin-top:2px;}\n\n/* ---------- 모달 ---------- */\n.modal-overlay{\n  position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);\n  display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;\n  animation:fadeIn .18s ease both;\n}\n@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}\n.modal{\n  background:var(--bg-elevated);border-radius:20px;padding:24px;max-width:520px;width:100%;\n  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);\n  animation:modalIn .22s cubic-bezier(.2,.9,.3,1) both;\n}\n@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}\n.modal h2{margin:0 0 18px;font-size:18px;font-weight:800;}\n.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}\n\n/* ---------- 체크리스트 ---------- */\n.checklist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}\n@media(max-width:640px){.checklist-grid{grid-template-columns:1fr;}}\n.chk-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-soft);border-radius:var(--radius-sm);cursor:pointer;user-select:none;}\n.chk-item input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}\n.chk-item span{font-size:13.5px;font-weight:600;}\n.report-box{\n  white-space:pre-wrap;background:var(--bg-soft);border-radius:var(--radius-sm);padding:16px;\n  font-size:14px;line-height:1.75;margin-top:14px;min-height:100px;\n}\n\n/* ---------- AI 코칭 카드 ---------- */\n.coach-block{margin-bottom:14px;}\n.coach-block h4{margin:0 0 6px;font-size:13px;color:var(--accent);font-weight:800;}\n.coach-block p{margin:0;font-size:13.5px;line-height:1.6;}\n\n/* ---------- 토스트 ---------- */\n#toast{\n  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);\n  background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:980px;font-size:13.5px;font-weight:600;\n  opacity:0;pointer-events:none;transition:.25s;z-index:2000;box-shadow:var(--shadow-lg);\n}\n#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}\n\n/* ---------- 반응형: 모바일 ---------- */\n@media(max-width:900px){\n  .sidebar{transform:translateX(-100%);width:250px;}\n  .sidebar.open{transform:translateX(0);}\n  .main{margin-left:0;padding:20px 16px 90px;}\n  .hamburger{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;\n    background:var(--bg-elevated);border:1px solid var(--border);cursor:pointer;font-size:18px;}\n  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none;}\n  .sidebar-backdrop.show{display:block;}\n}\n.hide{display:none !important;}\n</style>\n</head>\n<body>\n<div id=\"app\">\n  <div class=\"sidebar-backdrop\" id=\"sidebarBackdrop\" onclick=\"UI.closeSidebar()\"></div>\n  <nav class=\"sidebar\" id=\"sidebar\">\n    <div class=\"brand\"><span class=\"dot\"></span>샘표 전남 유인행사</div>\n    <div class=\"nav-item\" data-route=\"dashboard\"><span class=\"ico\">📊</span>대시보드</div>\n    <div class=\"nav-item\" data-route=\"staff\"><span class=\"ico\">👥</span>행사자 관리</div>\n    <div class=\"nav-item\" data-route=\"reports\"><span class=\"ico\">📋</span>활동일보 업로드</div>\n    <div class=\"nav-item\" data-route=\"data\"><span class=\"ico\">🗂️</span>자료 관리</div>\n    <div class=\"nav-sep\"></div>\n    <div class=\"nav-footer\">\n      <div class=\"theme-toggle\" onclick=\"UI.toggleTheme()\">\n        <span id=\"themeLabel\">다크 모드</span>\n        <div class=\"switch\" id=\"themeSwitch\"></div>\n      </div>\n    </div>\n  </nav>\n\n  <main class=\"main\">\n    <div class=\"topbar\">\n      <div style=\"display:flex;align-items:center;gap:12px;\">\n        <div class=\"hamburger\" onclick=\"UI.openSidebar()\">☰</div>\n        <div>\n          <h1 id=\"pageTitle\">대시보드</h1>\n          <div class=\"sub\" id=\"pageSub\">전남지점 행사자 현황을 한눈에 확인하세요</div>\n        </div>\n      </div>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n        <div id=\"ymSelector\"></div>\n        <div id=\"topbarActions\"></div>\n      </div>\n    </div>\n    <div id=\"view\"></div>\n  </main>\n</div>\n\n<div id=\"modalRoot\"></div>\n<div id=\"toast\"></div>\n\n<script>\n/* =========================================================================\n   행사자 성장관리 시스템 - 애플리케이션 스크립트\n   구조: DB(localStorage) -> Router -> View 렌더러 -> CRUD 핸들러\n   추후 기능 추가가 쉽도록 App 네임스페이스 하나로 모듈화했습니다.\n   ========================================================================= */\nconst App = {};\n\n/* ------------------------- 1. 데이터베이스 계층 ------------------------- */\nApp.DB_KEY = 'promoterGrowthDB_v1';\nApp.THEME_KEY = 'promoterGrowthTheme_v1';\n\n// 츄비님 구글시트 CSV 링크. publish(pub?output=csv) 방식은 googleusercontent.com으로 리다이렉트되며\n// CORS 헤더가 없어 fetch가 차단되므로, CORS를 지원하는 gviz 방식으로 대신 사용합니다.\nApp.DEFAULT_SHEET_URLS = {\n  records: 'https://docs.google.com/spreadsheets/d/1X3lir7_1jRdrXMli7cZyYqfqGzrraqrZoU-9uJFG57Y/gviz/tq?tqx=out:csv&gid=0',\n  reports: 'https://docs.google.com/spreadsheets/d/1ZKWQwC3STgr0klhOTXHpdvfPV20nwQUj2-14Q84IGJ8/gviz/tq?tqx=out:csv&gid=1204690902',\n  goals: 'https://docs.google.com/spreadsheets/d/1NxBgLxxG1PKGeLg_1kGT9QMZqVyJ2xA6bPjh4adM2v8/gviz/tq?tqx=out:csv&gid=7685198'\n};\n\nApp.defaultDB = function(){\n  return {\n    staff: [],\n    records: [], // 샘표 전남지역 유인행사 실적 레코드 (엑셀 Import 결과, 행 단위 원본 데이터)\n    activityReports: [], // 매니저 작성 활동일보 (엑셀 Import 결과, 행사자와 matchedStaffId로 연결)\n    nameAliasMap: {}, // 활동일보 \"사원명\" 원본 텍스트 -> 행사자 staffId 매핑 (한번 수동연결하면 이후 자동 적용)\n    meta:{ lastBackup:null, schemaVersion:3, lastActivityUpload:null,\n      sheetUrls: Object.assign({}, App.DEFAULT_SHEET_URLS), lastSheetSync:null } // 구글시트 publish-to-web CSV 동기화 설정\n  };\n};\n\n// ★ 스키마 버전을 3으로 올렸습니다. 예전 버전(체크리스트/일보자동작성/품목통계 등 이전 구조)에서\n//   저장된 localStorage 데이터는 새 구조와 맞지 않아 로딩 중 조용히 깨질 수 있으므로,\n//   버전이 다르면 무조건 깨끗한 기본 구조로 다시 시작합니다 (행사자를 다시 등록해야 할 수 있습니다).\nApp.load = function(){\n  let loaded = null;\n  try{\n    const raw = localStorage.getItem(App.DB_KEY);\n    if(raw) loaded = JSON.parse(raw);\n  }catch(e){\n    console.error('저장된 데이터를 읽는 중 오류가 발생하여 초기화합니다.', e);\n    loaded = null;\n  }\n\n  const isValid = loaded && typeof loaded==='object' && !Array.isArray(loaded)\n    && Array.isArray(loaded.staff) && loaded.meta && loaded.meta.schemaVersion===3;\n\n  App.db = isValid ? loaded : App.defaultDB();\n\n  // 방어적 보정: 혹시 일부 필드만 비정상이어도 앱이 멈추지 않도록 보강\n  if(!Array.isArray(App.db.staff)) App.db.staff = [];\n  if(!Array.isArray(App.db.records)) App.db.records = [];\n  if(!Array.isArray(App.db.activityReports)) App.db.activityReports = [];\n  if(!App.db.nameAliasMap || typeof App.db.nameAliasMap!=='object' || Array.isArray(App.db.nameAliasMap)) App.db.nameAliasMap = {};\n  if(!App.db.meta || typeof App.db.meta!=='object') App.db.meta = { lastBackup:null, schemaVersion:3, lastActivityUpload:null };\n  if(App.db.meta.lastActivityUpload===undefined) App.db.meta.lastActivityUpload = null;\n  if(!App.db.meta.sheetUrls || typeof App.db.meta.sheetUrls!=='object') App.db.meta.sheetUrls = Object.assign({}, App.DEFAULT_SHEET_URLS);\n  if(!App.db.meta.sheetUrls.records && !App.db.meta.sheetUrls.reports) App.db.meta.sheetUrls = Object.assign({}, App.DEFAULT_SHEET_URLS);\n  // 마이그레이션: 예전에 저장된 publish(pub?output=csv) 링크는 CORS 차단으로 항상 실패하므로 gviz 링크로 자동 교체\n  if((App.db.meta.sheetUrls.records||'').includes('pub?output=csv')) App.db.meta.sheetUrls.records = App.DEFAULT_SHEET_URLS.records;\n  if((App.db.meta.sheetUrls.reports||'').includes('pub?output=csv')) App.db.meta.sheetUrls.reports = App.DEFAULT_SHEET_URLS.reports;\n  if(!App.db.meta.sheetUrls.goals) App.db.meta.sheetUrls.goals = App.DEFAULT_SHEET_URLS.goals;\n  if(App.db.meta.lastSheetSync===undefined) App.db.meta.lastSheetSync = null;\n  App.db.meta.schemaVersion = 3;\n\n  try{\n    App._rebuildRecordIndex();\n  }catch(e){\n    console.error('실적 데이터 인덱스 생성 중 오류가 발생하여 실적 데이터를 초기화합니다.', e);\n    App.db.records = [];\n    App._byYM = {};\n    App._allYMs = [];\n  }\n\n  // 정상화된 구조를 즉시 다시 저장해서, 다음 로딩부터는 항상 유효한 데이터만 남도록 함\n  try{ App.save(); }catch(e){ console.error('초기 저장 실패', e); }\n};\n\n// 선택된 YEAR-MONTH 등 전역 UI 상태 (localStorage에 별도 저장하여 새로고침해도 유지)\nApp.STATE_KEY = 'promoterGrowthState_v1';\nApp.loadState = function(){\n  try{\n    App.state = JSON.parse(localStorage.getItem(App.STATE_KEY)) || {};\n  }catch(e){ App.state = {}; }\n  if(!App.state.selectedYM) App.state.selectedYM = null; // null이면 최신월 자동 선택\n};\nApp.saveState = function(){\n  localStorage.setItem(App.STATE_KEY, JSON.stringify(App.state));\n};\n\n// records를 YEAR-MONTH별로 미리 그룹핑해두는 캐시 (5만건 이상에서도 빠르게 필터링하기 위함)\nApp._rebuildRecordIndex = function(){\n  App._byYM = {};\n  App._allYMs = [];\n  const ymSet = new Set();\n  App.db.records.forEach(r=>{\n    if(!App._byYM[r.ym]) App._byYM[r.ym] = [];\n    App._byYM[r.ym].push(r);\n    ymSet.add(r.ym);\n  });\n  App._allYMs = [...ymSet].sort(); // 오름차순 (예: 2026-01, 2026-02, ...)\n};\n\nApp.save = function(){\n  localStorage.setItem(App.DB_KEY, JSON.stringify(App.db));\n  // 간단한 자동 백업본도 별도 키에 보관 (직전 저장본 1개 보관)\n  localStorage.setItem(App.DB_KEY + '_backup', JSON.stringify(App.db));\n};\n\nApp.uid = function(prefix){\n  return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);\n};\n\n/* ------------------------- 2. 유틸리티 ------------------------- */\nApp.util = {\n  todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); },\n  monthKey(d){ d = d? new Date(d): new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); },\n  monthLabel(mk){ const [y,m]=mk.split('-'); return `${y}년 ${parseInt(m)}월`; },\n  fmtDate(s){ if(!s) return '-'; return s; },\n  esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); },\n  clamp(n,a,b){ return Math.max(a,Math.min(b,n)); },\n  seededRandom(seedStr){\n    // 문자열 시드를 이용한 결정적 랜덤 (같은 날짜/입력이면 같은 결과)\n    let h = 0;\n    for(let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) >>> 0; }\n    return function(){ h = (h*1103515245 + 12345) >>> 0; return (h % 1000)/1000; };\n  },\n  pick(arr, rnd){ return arr[Math.floor(rnd()*arr.length) % arr.length]; },\n  toast(msg){\n    const t = document.getElementById('toast');\n    t.textContent = msg; t.classList.add('show');\n    clearTimeout(App._toastTimer);\n    App._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);\n  },\n  monthsOfYear(){ return ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']; },\n  currentMonthNum(){ return new Date().getMonth()+1; },\n  avg(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; },\n\n  /* ---- 엑셀 Import 전용: 날짜/숫자 파싱 유틸 ----\n     실제 매장 엑셀은 셀 형식이 제각각(엑셀 날짜 시리얼 번호, \"2026.7.15\", \"7/15\", 일자만 있는 \"15\" 등)이라\n     최대한 관대하게(lenient) 파싱하고, 그래도 실패하면 null을 반환해 호출 측에서 해당 행을 건너뛰게 합니다. */\n  excelSerialToDate(serial){\n    // 엑셀(1900 날짜 시스템) 시리얼 번호 -> JS Date 변환\n    const utcDays = Math.floor(serial - 25569);\n    const utcMs = utcDays * 86400 * 1000;\n    return new Date(utcMs);\n  },\n  formatDateObj(d){\n    if(!(d instanceof Date) || isNaN(d.getTime())) return null;\n    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');\n    return `${y}-${m}-${day}`;\n  },\n  normalizeExcelDate(value, monthHint){\n    // monthHint: 값이 \"일(day)\"만 담고 있을 때 사용할 시트 기준 월(1~12)\n    if(value===undefined || value===null || value==='') return null;\n    if(value instanceof Date) return App.util.formatDateObj(value);\n    if(typeof value === 'number'){\n      if(value>=1 && value<=31 && monthHint){\n        const y = new Date().getFullYear();\n        return App.util.formatDateObj(new Date(y, monthHint-1, Math.round(value)));\n      }\n      return App.util.formatDateObj(App.util.excelSerialToDate(value));\n    }\n    const str = String(value).trim();\n    if(!str) return null;\n    // \"15\", \"15일\" 처럼 일자만 있는 경우\n    const dayOnly = str.match(/^(\\d{1,2})\\s*일?$/);\n    if(dayOnly && monthHint){\n      const y = new Date().getFullYear();\n      return App.util.formatDateObj(new Date(y, monthHint-1, parseInt(dayOnly[1],10)));\n    }\n    // \"2026년 7월 15일\", \"2026.7.15\", \"2026/7/15\", \"2026-7-15\" 등 구분자 정규화\n    let normalized = str.replace(/년|월/g,'-').replace(/일$/,'').replace(/[.\\/]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');\n    let d = new Date(normalized);\n    if(!isNaN(d.getTime())) return App.util.formatDateObj(d);\n    d = new Date(str);\n    if(!isNaN(d.getTime())) return App.util.formatDateObj(d);\n    return null;\n  },\n  parseNumberLoose(v){\n    // \"1,250,000\", \"1250000원\", \" 1250000 \" 등을 모두 숫자로 인식\n    if(v===undefined || v===null || v==='') return 0;\n    if(typeof v === 'number') return v;\n    const cleaned = String(v).replace(/[,원%\\s]/g,'');\n    const n = parseFloat(cleaned);\n    return isNaN(n) ? 0 : n;\n  },\n  parsePercentLoose(v){\n    // \"92\", \"92%\", \"0.92\" 모두 92(%)로 인식. 값이 없으면 null\n    if(v===undefined || v===null || v==='') return null;\n    if(typeof v === 'number') return v<=1 ? Math.round(v*100) : Math.round(v);\n    const hadPercentSign = String(v).indexOf('%')>=0;\n    const cleaned = String(v).replace(/[%\\s]/g,'');\n    const n = parseFloat(cleaned);\n    if(isNaN(n)) return null;\n    return (n<=1 && !hadPercentSign) ? Math.round(n*100) : Math.round(n);\n  },\n  // ★ 검증된 계산 로직 전용: 엑셀 \"달성률\" 컬럼은 항상 소수(비율)로 저장되어 있습니다.\n  //   (예: 0.616688 → 61.6688%, 1.260495 → 126.0495%, 7.226703 → 722.6703%)\n  //   parsePercentLoose와 달리 값의 크기와 상관없이 \"항상 ×100\" 합니다 (100% 초과 달성률도 정확히 인식).\n  //   또한 나중에 평균을 낸 후 한 번만 반올림하도록, 여기서는 반올림하지 않고 원값을 그대로 반환합니다.\n  parseAchievementRate(v){\n    if(v===undefined || v===null || v==='') return null;\n    if(typeof v === 'number') return v*100;\n    const hadPercentSign = String(v).indexOf('%')>=0;\n    const cleaned = String(v).replace(/[%\\s,]/g,'');\n    const n = parseFloat(cleaned);\n    if(isNaN(n)) return null;\n    return hadPercentSign ? n : n*100;\n  }\n};\n\n/* ------------------------- 2-1. 엑셀 컬럼 자동인식(퍼지 매칭) 설정 -------------------------\n   엑셀 헤더명이 매번 바뀔 수 있으므로, 열 번호가 아니라 \"헤더 텍스트\"를 기준으로\n   아래 표준 필드(canonical field)에 매칭시킵니다. 자동 인식에 실패하면 사용자가\n   직접 매핑할 수 있는 모달을 띄우고, 그 결과를 App.db.columnMapping에 기억해둡니다. */\nApp.canonFields = [\n  {key:'staffName', label:'행사자명', aliases:['행사자명','사원명','이름','행사자','성명','담당자']},\n  {key:'date',      label:'날짜',    aliases:['날짜','일자','방문일','등록일','행사일']},\n  {key:'store',     label:'매장명',  aliases:['매장명','매장','점포명','점포','지점']},\n  {key:'sales',     label:'매출',    aliases:['매출','총매출','판매금액','매출액','실적']},\n  {key:'target',    label:'목표',    aliases:['목표','목표금액','목표매출']},\n  {key:'achievementRate', label:'달성률', aliases:['달성률','달성율','달성퍼센트','달성%']}\n];\nApp.util.normalizeHeaderStr = function(s){\n  return String(s||'').replace(/[\\s()\\[\\]%_·\\-]/g,'').toLowerCase();\n};\nApp.util.guessCanonForHeader = function(header){\n  const nh = App.util.normalizeHeaderStr(header);\n  if(!nh) return null;\n  for(const f of App.canonFields){\n    for(const alias of f.aliases){\n      const na = App.util.normalizeHeaderStr(alias);\n      if(nh===na || nh.includes(na) || na.includes(nh)) return f.key;\n    }\n  }\n  return null;\n};\n\n/* ------------------------- 3. 실적 집계 & 그룹(우수/성장/개선) 자동 분류 -------------------------\n   ★★★ 검증 완료된 계산 로직입니다. 실제 엑셀 데이터로 5명을 직접 대조 검증했습니다. ★★★\n   이후 기능을 추가하거나 UI를 바꾸더라도 아래 계산 방식은 절대 변경하지 마세요.\n\n   - 평균달성률: 엑셀 \"달성률\" 컬럼(이미 계산된 최종값)의 평균입니다.\n     총판매금액 ÷ 목표로 재계산하지 않습니다 (import 단계에서도 재계산 금지).\n   - 16만원 미만: 총판매금액 < 160000\n   - 목표미달: 총판매금액 < 목표 (달성률이 아니라 금액을 직접 비교)\n   - 그룹 분류 (누적 행사일수 10일 미만은 \"제외\"):\n       우수: 평균달성률 125% 이상 AND 16만원 미만 비율 35% 이하\n       성장: 평균달성률  95% 이상 AND 16만원 미만 비율 60% 이하\n       개선: 평균달성률  95% 미만 OR  16만원 미만 비율 60% 초과\n\n   ★ 목적: \"행사자 매출 관리\" - 시간이 지나며 등급이 어떻게 변해왔는지 추적하는 것입니다.\n   그래서 대시보드/행사자목록/배지 등 핵심 지표는 \"선택한 YEAR-MONTH까지의 누적(YTD)\" 기준으로 계산합니다.\n   반면 \"월별 성과\" 표처럼 그 달 하나만의 실적을 봐야 하는 곳은 \"단일 월 집계\"(App.getMonthlyAgg)를 사용합니다.\n   두 집계 모두 App._aggCache / App._cumAggCache에 캐시하여 대량 레코드에서도 빠르게 동작합니다. */\nApp._aggCache = {};\nApp._cumAggCache = {};\n\nApp.invalidateAggCache = function(){\n  App._aggCache = {};\n  App._cumAggCache = {};\n};\n\nApp._classifyGroup = function(a){\n  if(a.days < 10) return '제외';\n  if(a.avgRate>=125 && a.under16Pct<=35) return '우수';\n  if(a.avgRate>=95 && a.under16Pct<=60) return '성장';\n  return '개선';\n};\n\n// 레코드 배열로부터 행사자별 집계(byStaff)와 전체 집계(overall)를 계산하는 공용 내부 함수\nApp._aggregateRecords = function(records){\n  const byStaff = {};\n  records.forEach(r=>{\n    if(!byStaff[r.staffName]){\n      byStaff[r.staffName] = { days:0, totalTarget:0, totalSales:0, rateSum:0, under16Count:0, missCount:0 };\n    }\n    const a = byStaff[r.staffName];\n    a.days++;\n    a.totalTarget += Number(r.target)||0;\n    a.totalSales += Number(r.totalSales)||0;\n    a.rateSum += Number(r.achievementRate)||0; // 엑셀 달성률 컬럼값 그대로 사용 (재계산 금지)\n    if(Number(r.totalSales) < 160000) a.under16Count++;\n    if(Number(r.totalSales) < Number(r.target)) a.missCount++; // 목표미달 = 금액 직접 비교\n  });\n\n  const names = Object.keys(byStaff);\n  names.forEach(name=>{\n    const a = byStaff[name];\n    a.avgRate = a.days ? Math.round(a.rateSum/a.days) : 0;\n    a.under16Pct = a.days ? Math.round(a.under16Count/a.days*100) : 0;\n    a.missPct = a.days ? Math.round(a.missCount/a.days*100) : 0;\n    a.group = App._classifyGroup(a);\n  });\n\n  const graded = names.filter(n=>byStaff[n].group!=='제외');\n  const overall = {\n    totalStaff: names.length,\n    good: names.filter(n=>byStaff[n].group==='우수').length,\n    growth: names.filter(n=>byStaff[n].group==='성장').length,\n    improve: names.filter(n=>byStaff[n].group==='개선').length,\n    excluded: names.filter(n=>byStaff[n].group==='제외').length,\n    avgRate: graded.length ? Math.round(App.util.avg(graded.map(n=>byStaff[n].avgRate))) : 0,\n    totalTarget: names.reduce((s,n)=>s+byStaff[n].totalTarget,0),\n    totalSales: names.reduce((s,n)=>s+byStaff[n].totalSales,0)\n  };\n  return { byStaff, overall };\n};\n\n// 선택한 월 \"하나만\"의 집계 (월별 성과 표에서 사용)\nApp.getMonthlyAgg = function(ym){\n  if(!ym) return { byStaff:{}, overall:{ totalStaff:0, good:0, growth:0, improve:0, excluded:0, avgRate:0, totalTarget:0, totalSales:0 } };\n  if(App._aggCache[ym]) return App._aggCache[ym];\n  const result = App._aggregateRecords(App._byYM[ym] || []);\n  App._aggCache[ym] = result;\n  return result;\n};\n\n// 선택한 월까지의 \"누적(YTD)\" 집계 (대시보드/행사자목록/누적현황 등 핵심 지표에서 사용)\nApp.getCumulativeAgg = function(ym){\n  if(!ym) return { byStaff:{}, overall:{ totalStaff:0, good:0, growth:0, improve:0, excluded:0, avgRate:0, totalTarget:0, totalSales:0 } };\n  if(App._cumAggCache[ym]) return App._cumAggCache[ym];\n  const records = App.db.records.filter(r=>r.ym<=ym); // 시작 시점부터 선택한 월까지 전부 합산\n  const result = App._aggregateRecords(records);\n  App._cumAggCache[ym] = result;\n  return result;\n};\n\n// 이전 이름 호환용: 기존 코드에서 참조하던 이름을 \"단일 월\" 집계로 유지\nApp.getAggForYM = App.getMonthlyAgg;\n\n// 특정 행사자 이름의 특정 월 \"단일 월\" 집계 (없으면 기본값)\nApp.getStaffAgg = function(staffName, ym){\n  const agg = App.getMonthlyAgg(ym);\n  return agg.byStaff[staffName] || { days:0, totalTarget:0, totalSales:0, avgRate:0, under16Count:0, under16Pct:0, missCount:0, missPct:0, group:'제외' };\n};\n\n// 특정 행사자 이름의 특정 월까지 \"누적\" 집계 (없으면 기본값)\nApp.getStaffCumulativeAgg = function(staffName, ym){\n  const agg = App.getCumulativeAgg(ym);\n  return agg.byStaff[staffName] || { days:0, totalTarget:0, totalSales:0, avgRate:0, under16Count:0, under16Pct:0, missCount:0, missPct:0, group:'제외' };\n};\n\nApp.groupMeta = function(g){\n  if(g==='우수') return {cls:'good', label:'우수그룹'};\n  if(g==='성장') return {cls:'growth', label:'성장그룹'};\n  if(g==='개선') return {cls:'improve', label:'개선그룹'};\n  return {cls:'neutral', label:'집계제외(10일 미만)'};\n};\n\n/* ------------------------- 3-1. 이번 달 변동사항 (전월 대비 자동 비교) -------------------------\n   업로드된 월 목록(App._allYMs)에서 선택된 월의 \"바로 이전 업로드월\"과 비교합니다\n   (달력상 전월이 아니라, 실제 데이터가 있는 직전 월 — 중간에 빠진 달이 있어도 안전하게 동작).\n   그룹/등급은 \"누적(YTD)\" 기준으로, 급상승/급하락 분석은 \"그 달 단독\" 실적 기준으로 비교합니다. */\nApp.getPrevYM = function(ym){\n  const idx = App._allYMs.indexOf(ym);\n  if(idx<=0) return null;\n  return App._allYMs[idx-1];\n};\n\nApp._tierOf = function(group){\n  return group==='우수' ? 2 : group==='성장' ? 1 : group==='개선' ? 0 : null; // 제외=null(비교대상 아님)\n};\nApp._tierLabel = function(t){ return t===2?'상':t===1?'중':'하'; };\n\nApp.buildMonthlyChanges = function(ym){\n  const prevYm = App.getPrevYM(ym);\n  if(!prevYm) return null; // 비교할 이전 업로드월이 없음 (최소 2개월 데이터 필요)\n\n  const curCum = App.getCumulativeAgg(ym).byStaff;\n  const prevCum = App.getCumulativeAgg(prevYm).byStaff;\n  const curMonthly = App.getMonthlyAgg(ym).byStaff;\n  const prevMonthly = App.getMonthlyAgg(prevYm).byStaff;\n\n  const allNames = new Set([...Object.keys(curCum), ...Object.keys(prevCum)]);\n  const improveIn = [], improveOut = [], gradeUp = [], gradeDown = [];\n\n  allNames.forEach(name=>{\n    const curA = curCum[name], prevA = prevCum[name];\n    const curTier = curA ? App._tierOf(curA.group) : null;\n    const prevTier = prevA ? App._tierOf(prevA.group) : null;\n    if(curTier===null || prevTier===null || curTier===prevTier) return;\n\n    if(curA.group==='개선' || prevA.group==='개선'){\n      if(curA.group==='개선') improveIn.push(name); else improveOut.push(name);\n    }else if(curTier>prevTier){\n      gradeUp.push({ name, from:App._tierLabel(prevTier), to:App._tierLabel(curTier) });\n    }else{\n      gradeDown.push({ name, from:App._tierLabel(prevTier), to:App._tierLabel(curTier) });\n    }\n  });\n\n  // 신규 등록: 이전 업로드월까지 레코드가 전혀 없다가 이번 달 처음 등장\n  // 활동 중단(퇴사 추정): 이전 업로드월까지는 레코드가 있었는데 이번 달(단독) 레코드가 없음\n  const newlyRegistered = [], departed = [];\n  App.db.staff.forEach(s=>{\n    const hadBefore = App.db.records.some(r=>r.staffName===s.name && r.ym<=prevYm);\n    const hasThisMonth = (App._byYM[ym]||[]).some(r=>r.staffName===s.name);\n    if(!hadBefore && hasThisMonth) newlyRegistered.push(s.name);\n    if(hadBefore && !hasThisMonth) departed.push(s.name);\n  });\n\n  // 눈에 띄는 실적 변화: 그룹 이동이 없어도, 그 달 단독 평균달성률/총판매금액이 크게 변한 사람을 자동 감지\n  // 기준(고정): 평균달성률 20%p 이상 변화 또는 총판매금액 30% 이상 변화\n  const risers = [], decliners = [];\n  Object.keys(curMonthly).forEach(name=>{\n    const cur = curMonthly[name], prev = prevMonthly[name];\n    if(!prev || !cur || prev.days===0 || cur.days===0) return;\n    const rateDiff = cur.avgRate - prev.avgRate;\n    const salesPct = prev.totalSales>0 ? Math.round((cur.totalSales-prev.totalSales)/prev.totalSales*100) : null;\n    const item = { name, rateDiff, salesPct, curRate:cur.avgRate, prevRate:prev.avgRate };\n    if(rateDiff>=20 || (salesPct!==null && salesPct>=30)) risers.push(item);\n    else if(rateDiff<=-20 || (salesPct!==null && salesPct<=-30)) decliners.push(item);\n  });\n  risers.sort((a,b)=>b.rateDiff-a.rateDiff);\n  decliners.sort((a,b)=>a.rateDiff-b.rateDiff);\n\n  return { ym, prevYm, improveIn, improveOut, gradeUp, gradeDown, newlyRegistered, departed, risers, decliners };\n};\n\n/* ------------------------- 4. 라우터 ------------------------- */\nApp.route = { name:'dashboard', staffId:null, tab:'goal' };\n\nApp.navigate = function(name, staffId, tab){\n  App.route = { name, staffId: staffId||null, tab: tab||'goal' };\n  location.hash = '#/' + name + (staffId ? '/'+staffId + (tab? '/'+tab:'') : '');\n  UI.render();\n};\n\nwindow.addEventListener('hashchange', ()=>{\n  const parts = location.hash.replace('#/','').split('/').filter(Boolean);\n  App.route = { name: parts[0]||'dashboard', staffId: parts[1]||null, tab: parts[2]||'goal' };\n  UI.render();\n});\n\n/* ------------------------- 5. UI 컨트롤러 ------------------------- */\nconst UI = {};\n\nUI.init = function(){\n  try{\n    App.load();\n    App.loadState();\n    // 테마\n    const theme = localStorage.getItem(App.THEME_KEY) || 'light';\n    document.documentElement.setAttribute('data-theme', theme);\n    UI.syncThemeSwitch();\n    // 네비게이션 클릭\n    document.querySelectorAll('.nav-item').forEach(el=>{\n      el.addEventListener('click', ()=>{ App.navigate(el.dataset.route); UI.closeSidebar(); });\n    });\n    UI.renderYmSelector();\n    const parts = location.hash.replace('#/','').split('/').filter(Boolean);\n    App.route = { name: parts[0]||'dashboard', staffId: parts[1]||null, tab: parts[2]||'goal' };\n    UI.render();\n\n    // 구글시트 주소가 등록되어 있으면 백그라운드에서 조용히 자동 동기화 (실패해도 앱 사용에는 지장 없음)\n    const su = App.db.meta.sheetUrls;\n    if(su && (su.records || su.reports)){\n      Actions.syncGoogleSheets(true).catch(e=>console.error('자동 동기화 실패', e));\n    }\n  }catch(e){\n    console.error('앱 초기화 중 오류가 발생했습니다:', e);\n    const view = document.getElementById('view');\n    if(view){\n      view.innerHTML = `<div class=\"card\" style=\"border:1px solid var(--improve);\">\n        <div style=\"font-weight:800;color:var(--improve);margin-bottom:8px;\">초기화 중 오류가 발생했습니다</div>\n        <div style=\"font-size:13px;color:var(--text-secondary);margin-bottom:10px;\">${App.util.esc(e.message||String(e))}</div>\n        <button class=\"btn danger\" onclick=\"localStorage.clear(); location.reload();\">저장된 데이터 초기화 후 새로고침</button>\n      </div>`;\n    }\n  }\n};\n\n// 상단 고정 YEAR-MONTH 선택 드롭다운을 그림 (records에 존재하는 월만 선택지로 노출)\nUI.renderYmSelector = function(){\n  const el = document.getElementById('ymSelector');\n  if(!el) return;\n  if(App._allYMs.length===0){\n    el.innerHTML = `<span style=\"font-size:12.5px;color:var(--text-secondary);\">업로드된 실적 데이터 없음</span>`;\n    return;\n  }\n  if(!App.state.selectedYM || !App._allYMs.includes(App.state.selectedYM)){\n    App.state.selectedYM = App._allYMs[App._allYMs.length-1]; // 최신월 기본 선택\n    App.saveState();\n  }\n  const options = [...App._allYMs].reverse().map(ym=>\n    `<option value=\"${ym}\" ${ym===App.state.selectedYM?'selected':''}>${ym}</option>`\n  ).join('');\n  el.innerHTML = `<select id=\"ymSelectInput\" style=\"font-weight:700;\">${options}</select>`;\n  document.getElementById('ymSelectInput').onchange = function(){\n    App.state.selectedYM = this.value;\n    App.saveState();\n    UI.render();\n  };\n};\n\nUI.toggleTheme = function(){\n  const cur = document.documentElement.getAttribute('data-theme');\n  const next = cur==='dark' ? 'light' : 'dark';\n  document.documentElement.setAttribute('data-theme', next);\n  localStorage.setItem(App.THEME_KEY, next);\n  UI.syncThemeSwitch();\n};\nUI.syncThemeSwitch = function(){\n  const isDark = document.documentElement.getAttribute('data-theme')==='dark';\n  document.getElementById('themeSwitch').classList.toggle('on', isDark);\n  document.getElementById('themeLabel').textContent = isDark? '라이트 모드':'다크 모드';\n};\nUI.openSidebar = function(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('show'); };\nUI.closeSidebar = function(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('show'); };\n\nUI.setActiveNav = function(name){\n  document.querySelectorAll('.nav-item').forEach(el=>{\n    el.classList.toggle('active', el.dataset.route===name);\n  });\n};\n\nUI.setTitle = function(title, sub){\n  document.getElementById('pageTitle').textContent = title;\n  document.getElementById('pageSub').textContent = sub||'';\n};\n\nUI.setTopActions = function(html){\n  document.getElementById('topbarActions').innerHTML = html || '';\n};\n\nUI.render = function(){\n  const r = App.route;\n  UI.setActiveNav(r.name==='staffDetail' ? 'staff' : r.name);\n  UI.setTopActions('');\n  UI.renderYmSelector();\n  if(r.name==='dashboard') Views.dashboard();\n  else if(r.name==='staff' && !r.staffId) Views.staffList();\n  else if((r.name==='staff'||r.name==='staffDetail') && r.staffId) Views.staffDetail(r.staffId, r.tab);\n  else if(r.name==='reports') Views.activityReports();\n  else if(r.name==='data') Views.dataManage();\n  else Views.dashboard();\n};\n\n/* ------------------------- 6. 모달 헬퍼 ------------------------- */\nUI.openModal = function(innerHtml){\n  const root = document.getElementById('modalRoot');\n  root.innerHTML = `<div class=\"modal-overlay\" id=\"modalOverlay\"><div class=\"modal\">${innerHtml}</div></div>`;\n  document.getElementById('modalOverlay').addEventListener('click', (e)=>{\n    if(e.target.id==='modalOverlay') UI.closeModal();\n  });\n};\nUI.closeModal = function(){ document.getElementById('modalRoot').innerHTML=''; };\n\n/* ------------------------- 7. 간단 차트 렌더러 (외부 라이브러리 없이 div로 구현) ------------------------- */\nApp.chart = {};\nApp.chart.bar = function(labels, values, opts){\n  opts = opts||{};\n  const max = Math.max(1, ...values, opts.max||0);\n  let html = '<div class=\"bar-chart\">';\n  labels.forEach((lbl,i)=>{\n    const v = values[i]||0;\n    const h = Math.max(3, Math.round((v/max)*120));\n    html += `<div class=\"bar-col\">\n        <div class=\"bar\" style=\"height:${h}px;background:${opts.color||'var(--accent)'}\"><span class=\"val\">${v}${opts.suffix||''}</span></div>\n        <div class=\"lbl\">${App.util.esc(lbl)}</div>\n      </div>`;\n  });\n  html += '</div>';\n  return html;\n};\n\n/* ------------------------- 8. VIEWS: 화면별 렌더러 ------------------------- */\nconst Views = {};\n\n/* === 8-1. 대시보드 === */\nViews._dashSearch = '';\nViews._dashOpenGroups = { '우수':true, '성장':false, '개선':false };\n\nViews.dashboard = function(){\n  const ym = App.state.selectedYM;\n  UI.setTitle('대시보드', ym? `${ym}까지 누적 실적 현황입니다` : '엑셀을 업로드하면 실적 현황이 표시됩니다');\n\n  let html = `<div class=\"card\">\n    <div class=\"toolbar\">\n      <div class=\"field\" style=\"margin-bottom:0;flex:1;min-width:220px;\">\n        <label class=\"field-label\">엑셀 업로드 (.xlsx)</label>\n        <input type=\"file\" accept=\".xlsx,.xls\" onchange=\"Actions.importRecordsExcel(this.files[0]); this.value='';\">\n      </div>\n      <div class=\"field\" style=\"margin-bottom:0;flex:1;min-width:220px;\">\n        <label class=\"field-label\">행사자 검색</label>\n        <input type=\"text\" placeholder=\"이름으로 검색 (예: 김)\" value=\"${App.util.esc(Views._dashSearch)}\" oninput=\"Views._dashSearch=this.value;UI.render()\">\n      </div>\n    </div>\n  </div>`;\n\n  if(Views._dashSearch.trim()){\n    const q = Views._dashSearch.trim();\n    const matches = App.db.staff.filter(s=>s.name.includes(q));\n    html += `<div class=\"section-title\">검색 결과 <span class=\"cnt\">${matches.length}</span></div>`;\n    if(matches.length===0){\n      html += `<div class=\"card empty-state\"><div class=\"emoji\">🔍</div>'${App.util.esc(q)}'와(과) 일치하는 행사자가 없습니다.</div>`;\n    }else{\n      html += '<div class=\"card\" style=\"padding:8px 12px;\">';\n      matches.forEach(s=>{\n        const a = App.getStaffCumulativeAgg(s.name, ym);\n        const gm = App.groupMeta(a.group);\n        html += `<div class=\"item-row\" style=\"background:transparent;cursor:pointer;\" onclick=\"App.navigate('staffDetail','${s.id}')\">\n          <div class=\"staff-avatar\">${App.util.esc(s.name[0]||'?')}</div>\n          <div class=\"content\"><div class=\"title\">${App.util.esc(s.name)}</div><div class=\"meta\">누적 평균달성률 ${a.avgRate}% · 누적 행사일수 ${a.days}일</div></div>\n          <span class=\"badge ${gm.cls}\">${gm.label}</span>\n        </div>`;\n      });\n      html += '</div>';\n    }\n    document.getElementById('view').innerHTML = html;\n    return;\n  }\n\n  if(!ym){\n    html += `<div class=\"card empty-state\">\n      <div class=\"emoji\">📤</div>업로드된 실적 데이터가 없습니다. 위에서 엑셀(.xlsx)을 업로드해주세요.\n    </div>`;\n    document.getElementById('view').innerHTML = html;\n    return;\n  }\n\n  const { byStaff, overall } = App.getCumulativeAgg(ym); // 선택한 월까지 누적(YTD) 기준\n  const total = overall.totalStaff;\n\n  html += `<div class=\"grid cols-4\" style=\"margin-top:16px;\">\n    <div class=\"card stat-card\"><div class=\"icon\">👥</div><div class=\"label\">전체 행사자 (~${ym})</div><div class=\"value\">${total}<small> 명</small></div></div>\n    <div class=\"card stat-card\"><div class=\"icon\">🏆</div><div class=\"label\">우수 그룹</div><div class=\"value\" style=\"color:var(--good)\">${overall.good}<small> 명</small></div>\n      <div style=\"font-size:11px;color:var(--text-secondary);margin-top:4px;\">달성률 125%↑ · 16만미만 35%↓</div></div>\n    <div class=\"card stat-card\"><div class=\"icon\">🌱</div><div class=\"label\">성장 그룹</div><div class=\"value\" style=\"color:var(--growth)\">${overall.growth}<small> 명</small></div>\n      <div style=\"font-size:11px;color:var(--text-secondary);margin-top:4px;\">달성률 95%↑ · 16만미만 60%↓</div></div>\n    <div class=\"card stat-card\"><div class=\"icon\">⚠️</div><div class=\"label\">개선 그룹</div><div class=\"value\" style=\"color:var(--improve)\">${overall.improve}<small> 명</small></div>\n      <div style=\"font-size:11px;color:var(--text-secondary);margin-top:4px;\">그 외 (95%↓ 또는 16만미만 60%↑)</div></div>\n  </div>`;\n  if(overall.excluded){\n    html += `<div style=\"font-size:12.5px;color:var(--text-secondary);margin-top:8px;\">제외 ${overall.excluded}명 (누적 행사일수 10일 미만)</div>`;\n  }\n\n  html += Views._monthlyChangesHtml(ym);\n\n  ['우수','성장','개선'].forEach(g=>{\n    const names = Object.keys(byStaff).filter(n=>byStaff[n].group===g).sort((a,b)=>byStaff[b].avgRate-byStaff[a].avgRate);\n    const gm = App.groupMeta(g);\n    const open = Views._dashOpenGroups[g];\n    html += `<div class=\"section-title\" style=\"cursor:pointer;user-select:none;\" onclick=\"Views._dashOpenGroups['${g}']=!Views._dashOpenGroups['${g}'];UI.render()\">\n      <span class=\"badge ${gm.cls}\">${gm.label}</span> <span class=\"cnt\">${names.length}명</span>\n      <span style=\"margin-left:auto;color:var(--text-secondary);font-size:12px;\">${open?'▲ 접기':'▼ 펼치기'}</span>\n    </div>`;\n    if(open){\n      if(names.length===0){\n        html += `<div class=\"card empty-state\"><div class=\"emoji\">🙋</div>${gm.label}에 해당하는 행사자가 없습니다.</div>`;\n      }else{\n        html += '<div class=\"card\" style=\"padding:8px 12px;\">';\n        names.forEach(name=>{\n          const s = App.db.staff.find(x=>x.name===name);\n          const a = byStaff[name];\n          html += `<div class=\"item-row\" style=\"background:transparent;cursor:pointer;\" onclick=\"App.navigate('staffDetail','${s?s.id:''}')\">\n            <div class=\"staff-avatar\">${App.util.esc(name[0]||'?')}</div>\n            <div class=\"content\"><div class=\"title\">${App.util.esc(name)}</div><div class=\"meta\">누적 평균달성률 ${a.avgRate}% · 누적 행사일수 ${a.days}일</div></div>\n          </div>`;\n        });\n        html += '</div>';\n      }\n    }\n  });\n\n  document.getElementById('view').innerHTML = html;\n};\n\n// 전월 대비 변동사항을 카드 HTML로 렌더링 (비교할 이전 업로드월이 없으면 빈 문자열 반환)\nViews._monthlyChangesHtml = function(ym){\n  const c = App.buildMonthlyChanges(ym);\n  if(!c) return ''; // 업로드된 월이 1개뿐이면 비교 불가 -> 표시 안 함\n\n  const nameLink = (name)=>{\n    const s = App.db.staff.find(x=>x.name===name);\n    return s ? `<a href=\"javascript:void(0)\" onclick=\"App.navigate('staffDetail','${s.id}')\" style=\"color:inherit;text-decoration:underline;\">${App.util.esc(name)}</a>` : App.util.esc(name);\n  };\n\n  const hasAnyChange = c.improveIn.length || c.improveOut.length || c.gradeUp.length || c.gradeDown.length\n    || c.newlyRegistered.length || c.departed.length;\n\n  let html = `<div class=\"card\" style=\"margin-top:16px;\">\n    <div style=\"font-weight:800;font-size:15px;margin-bottom:10px;\">📢 이번 달 변동사항 <span style=\"font-weight:500;font-size:12.5px;color:var(--text-secondary);\">(${c.prevYm} → ${c.ym})</span></div>`;\n\n  if(!hasAnyChange){\n    html += `<div style=\"font-size:13px;color:var(--text-secondary);\">변동사항이 없습니다.</div>`;\n  }else{\n    const line = (icon, color, text) => `<div style=\"padding:6px 0;font-size:13.5px;color:${color};\">${icon} ${text}</div>`;\n    c.improveOut.forEach(name=> html += line('➖','var(--good)', `개선그룹 제외 : ${nameLink(name)}`));\n    c.improveIn.forEach(name=> html += line('➕','var(--improve)', `개선그룹 편입 : ${nameLink(name)}`));\n    c.gradeUp.forEach(x=> html += line('⬆','var(--good)', `역량등급 상승 : ${nameLink(x.name)} (${x.from} → ${x.to})`));\n    c.gradeDown.forEach(x=> html += line('⬇','var(--improve)', `역량등급 하락 : ${nameLink(x.name)} (${x.from} → ${x.to})`));\n    c.newlyRegistered.forEach(name=> html += line('👤','var(--text-primary)', `신규 등록 : ${nameLink(name)}`));\n    c.departed.forEach(name=> html += line('👋','var(--text-primary)', `활동 중단(퇴사 추정) : ${nameLink(name)}`));\n  }\n  html += '</div>';\n\n  if(c.risers.length){\n    html += `<div class=\"card\" style=\"margin-top:12px;border:1px solid var(--good);\">\n      <div style=\"font-weight:800;font-size:15px;margin-bottom:10px;color:var(--good);\">🔥 이번 달 성장한 행사자</div>`;\n    c.risers.forEach(x=>{\n      const parts = [`평균달성률 ${x.prevRate}% → ${x.curRate}% (${x.rateDiff>=0?'+':''}${x.rateDiff}%p)`];\n      if(x.salesPct!==null) parts.push(`매출 ${x.salesPct>=0?'+':''}${x.salesPct}%`);\n      html += `<div style=\"padding:6px 0;font-size:13.5px;\">${nameLink(x.name)} : ${parts.join(' · ')}</div>`;\n    });\n    html += '</div>';\n  }\n  if(c.decliners.length){\n    html += `<div class=\"card\" style=\"margin-top:12px;border:1px solid var(--improve);\">\n      <div style=\"font-weight:800;font-size:15px;margin-bottom:10px;color:var(--improve);\">⚠️ 이번 달 관리가 필요한 행사자</div>`;\n    c.decliners.forEach(x=>{\n      const parts = [`평균달성률 ${x.prevRate}% → ${x.curRate}% (${x.rateDiff}%p)`];\n      if(x.salesPct!==null) parts.push(`매출 ${x.salesPct}%`);\n      html += `<div style=\"padding:6px 0;font-size:13.5px;\">${nameLink(x.name)} : ${parts.join(' · ')}</div>`;\n    });\n    html += '</div>';\n  }\n\n  return html;\n};\n\n\nViews._staffFilter = { q:'', store:'', group:'' };\n\nViews.staffList = function(){\n  const ym = App.state.selectedYM;\n  UI.setTitle('행사자 관리', ym? `${ym}까지 누적 실적 집계입니다` : '엑셀 업로드 후 실적이 표시됩니다');\n  UI.setTopActions(`<button class=\"btn primary\" onclick=\"Actions.openStaffForm()\">+ 행사자 추가</button>`);\n\n  const f = Views._staffFilter;\n  const { byStaff } = App.getCumulativeAgg(ym); // 선택한 월까지 누적 기준\n\n  let list = App.db.staff.filter(s=>{\n    if(f.q && !s.name.includes(f.q)) return false; // 부분검색(자동선택 없음, 목록에서 클릭해서 이동)\n    if(f.group){\n      const g = (byStaff[s.name]||{}).group || '제외';\n      if(g!==f.group) return false;\n    }\n    return true;\n  });\n\n  let html = `<div class=\"card\">\n    <div class=\"toolbar\">\n      <input class=\"grow\" type=\"text\" placeholder=\"행사자명 부분검색 (예: 김)\" value=\"${App.util.esc(f.q)}\" oninput=\"Views._staffFilter.q=this.value;Views.staffList()\">\n      <select onchange=\"Views._staffFilter.group=this.value;Views.staffList()\">\n        <option value=\"\">전체 그룹</option>\n        <option value=\"우수\" ${f.group==='우수'?'selected':''}>우수그룹</option>\n        <option value=\"성장\" ${f.group==='성장'?'selected':''}>성장그룹</option>\n        <option value=\"개선\" ${f.group==='개선'?'selected':''}>개선그룹</option>\n        <option value=\"제외\" ${f.group==='제외'?'selected':''}>집계제외(누적 10일미만)</option>\n      </select>\n    </div>`;\n\n  if(!ym){\n    html += `<div class=\"empty-state\"><div class=\"emoji\">📤</div>업로드된 실적 데이터가 없습니다. '자료 관리'에서 엑셀을 업로드해주세요.</div>`;\n  }else if(list.length===0){\n    html += `<div class=\"empty-state\"><div class=\"emoji\">🔍</div>조건에 맞는 행사자가 없습니다.</div>`;\n  }else{\n    html += `<div style=\"overflow-x:auto;\"><table class=\"staff-table\"><thead><tr>\n      <th>이름</th><th>누적 행사일수</th><th>누적 평균달성률</th><th>16만원미만</th><th>목표미달</th><th>그룹</th><th></th>\n    </tr></thead><tbody>`;\n    list.forEach(s=>{\n      const a = byStaff[s.name] || {days:0,avgRate:0,under16Count:0,under16Pct:0,missCount:0,missPct:0,group:'제외'};\n      const gm = App.groupMeta(a.group);\n      html += `<tr class=\"row\" onclick=\"App.navigate('staffDetail','${s.id}')\">\n        <td><span class=\"staff-avatar\">${App.util.esc(s.name[0]||'?')}</span>${App.util.esc(s.name)}</td>\n        <td>${a.days}일</td>\n        <td>${a.avgRate}%</td>\n        <td>${a.under16Count}회 (${a.under16Pct}%)</td>\n        <td>${a.missCount}회 (${a.missPct}%)</td>\n        <td><span class=\"badge ${gm.cls}\">${gm.label}</span></td>\n        <td onclick=\"event.stopPropagation()\">\n          <button class=\"icon-btn\" title=\"수정\" onclick=\"Actions.openStaffForm('${s.id}')\">✏️</button>\n          <button class=\"icon-btn\" title=\"삭제\" onclick=\"Actions.deleteStaff('${s.id}')\">🗑️</button>\n        </td>\n      </tr>`;\n    });\n    html += '</tbody></table></div>';\n  }\n  html += '</div>';\n  document.getElementById('view').innerHTML = html;\n};\n\n/* === 8-3. 행사자 상세 페이지 (탭 구조) === */\nViews.staffDetail = function(staffId, tab){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  if(!s){ Views.staffList(); return; }\n  s.goals = s.goals||[]; s.customers = s.customers||[]; s.memos = s.memos||[];\n  s.visitLogs = s.visitLogs||[]; // 관리자 활동이력 (방문일/매장명/체크리스트/메모)\n\n  const ym = App.state.selectedYM;\n  const agg = App.getStaffCumulativeAgg(s.name, ym);\n  const gm = App.groupMeta(agg.group);\n  UI.setTitle(s.name, `${s.store||'-'} · ${s.type||'-'} · 입사일 ${s.hireDate||'-'}`);\n  UI.setTopActions(`<span class=\"badge ${gm.cls}\" style=\"margin-right:8px;\">${ym?`~${ym} 누적 `:''}${gm.label}</span>\n    <button class=\"btn sm\" onclick=\"App.navigate('staff')\">← 목록</button>\n    <button class=\"btn sm\" onclick=\"Actions.openStaffForm('${s.id}')\">✏️ 정보수정</button>`);\n\n  const tabs = [\n    ['cumulative','누적 현황'], ['monthly','월별 성과'], ['activityreport','📋 활동일보'], ['visitlog','활동 이력'], ['activitystats','활동 통계'],\n    ['goal','개인 목표'], ['customer','충성고객'], ['memo','관리자 메모'],\n    ['report','성장 리포트'], ['ai','AI 코칭']\n  ];\n  let html = `<div class=\"tabs\">`;\n  tabs.forEach(([key,label])=>{\n    html += `<div class=\"tab-btn ${tab===key?'active':''}\" onclick=\"App.navigate('staffDetail','${s.id}','${key}')\">${label}</div>`;\n  });\n  html += `</div><div id=\"tabBody\"></div>`;\n  document.getElementById('view').innerHTML = html;\n\n  const body = document.getElementById('tabBody');\n  if(tab==='goal') body.innerHTML = Views._tabGoal(s);\n  else if(tab==='cumulative') body.innerHTML = Views._tabCumulative(s);\n  else if(tab==='monthly') body.innerHTML = Views._tabMonthly(s);\n  else if(tab==='activityreport') body.innerHTML = Views._tabActivityReport(s);\n  else if(tab==='visitlog') body.innerHTML = Views._tabVisitLog(s);\n  else if(tab==='activitystats') body.innerHTML = Views._tabActivityStats(s);\n  else if(tab==='customer') body.innerHTML = Views._tabCustomer(s);\n  else if(tab==='memo') body.innerHTML = Views._tabMemo(s);\n  else if(tab==='report') body.innerHTML = Views._tabReport(s);\n  else if(tab==='ai') body.innerHTML = Views._tabAI(s);\n  else body.innerHTML = Views._tabCumulative(s);\n};\n\n/* -- 누적 현황 탭 (금액은 표시하지 않음) -- */\nViews._tabCumulative = function(s){\n  const ym = App.state.selectedYM;\n  const a = App.getStaffCumulativeAgg(s.name, ym);\n  const gm = App.groupMeta(a.group);\n  if(a.days===0){\n    return `<div class=\"card empty-state\"><div class=\"emoji\">📊</div>이 행사자의 실적 데이터가 없습니다.</div>`;\n  }\n  return `<div class=\"card\">\n    <div style=\"font-weight:800;margin-bottom:14px;\">누적 현황 (~${ym||'-'})</div>\n    <div class=\"grid cols-4\">\n      <div class=\"stat-card\" style=\"background:var(--bg-soft);border-radius:var(--radius-sm);padding:14px;\">\n        <div class=\"label\">현재 등급</div><div style=\"margin-top:6px;\"><span class=\"badge ${gm.cls}\">${gm.label}</span></div>\n      </div>\n      <div class=\"stat-card\" style=\"background:var(--bg-soft);border-radius:var(--radius-sm);padding:14px;\">\n        <div class=\"label\">누적 행사일수</div><div class=\"value\" style=\"font-size:22px;\">${a.days}<small>일</small></div>\n      </div>\n      <div class=\"stat-card\" style=\"background:var(--bg-soft);border-radius:var(--radius-sm);padding:14px;\">\n        <div class=\"label\">누적 평균달성률</div><div class=\"value\" style=\"font-size:22px;\">${a.avgRate}<small>%</small></div>\n      </div>\n      <div class=\"stat-card\" style=\"background:var(--bg-soft);border-radius:var(--radius-sm);padding:14px;\">\n        <div class=\"label\">16만원 미만</div><div class=\"value\" style=\"font-size:22px;\">${a.under16Count}<small>회 (${a.under16Pct}%)</small></div>\n      </div>\n    </div>\n    <div class=\"grid cols-4\" style=\"margin-top:12px;\">\n      <div class=\"stat-card\" style=\"background:var(--bg-soft);border-radius:var(--radius-sm);padding:14px;grid-column:span 2;\">\n        <div class=\"label\">목표미달</div><div class=\"value\" style=\"font-size:22px;\">${a.missCount}<small>회 (${a.missPct}%)</small></div>\n      </div>\n    </div>\n  </div>`;\n};\n\n/* -- 목표 탭 -- */\nViews._tabGoal = function(s){\n  const goals = s.goals||[];\n  const rate = goals.length? Math.round(goals.filter(g=>g.done).length/goals.length*100):0;\n  let html = `<div class=\"card\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\">\n      <div style=\"font-weight:800;\">개인 목표 (달성률 ${rate}%)</div>\n      <button class=\"btn sm primary\" onclick=\"Actions.openGoalForm('${s.id}')\">+ 목표 추가</button>\n    </div>\n    <div class=\"progress-bar\" style=\"margin-bottom:14px;\"><div style=\"width:${rate}%;background:var(--good)\"></div></div>`;\n  if(goals.length===0){\n    html += `<div class=\"empty-state\"><div class=\"emoji\">🎯</div>등록된 목표가 없습니다.</div>`;\n  }else{\n    goals.slice().reverse().forEach(gl=>{\n      html += `<div class=\"item-row\">\n        <div class=\"check ${gl.done?'done':''}\" onclick=\"Actions.toggleGoal('${s.id}','${gl.id}')\">${gl.done?'✓':''}</div>\n        <div class=\"content\"><div class=\"title ${gl.done?'strike':''}\">${App.util.esc(gl.title)}</div>\n          <div class=\"meta\">등록일 ${gl.createdAt}${gl.source? ' · '+App.util.esc(gl.source):''}</div>\n          ${gl.reason? `<div class=\"meta\">💬 ${App.util.esc(gl.reason)}</div>`:''}</div>\n        <div class=\"actions\"><button class=\"icon-btn\" onclick=\"Actions.deleteGoal('${s.id}','${gl.id}')\">🗑️</button></div>\n      </div>`;\n    });\n  }\n  html += '</div>';\n  return html;\n};\n\n/* -- 관리자 활동이력 탭 (방문일/매장명/체크리스트/메모 누적 기록) -- */\nApp.visitChecklist = [\n  {key:'pop', label:'POP 부착 확인'},\n  {key:'price', label:'가격고지 확인'},\n  {key:'directDisplay', label:'직접연관진열 요청'},\n  {key:'loyalCustomer', label:'충성고객 확보 활동'},\n  {key:'serviceEdu', label:'고객응대 교육'},\n  {key:'note', label:'행사노트 작성'},\n  {key:'comment', label:'목표댓글 작성'},\n  {key:'salesEncourage', label:'매출 독려'},\n  {key:'tastingEdu', label:'시식 교육'},\n  {key:'promoCheck', label:'판촉물 점검'},\n  {key:'displayImprove', label:'진열 개선'},\n  {key:'storeConsult', label:'매장담당 상담'},\n  {key:'photoUpload', label:'행사사진 업로드 확인'},\n  {key:'mobileAttendance', label:'모바일 근태 확인'},\n  {key:'beapleReg', label:'비플 등록 확인'},\n  {key:'etcEdu', label:'기타 교육'}\n];\n\nViews._tabVisitLog = function(s){\n  const logs = s.visitLogs||[];\n  let html = `<div class=\"card\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\">\n      <div style=\"font-weight:800;\">관리자 활동이력 (${logs.length}건)</div>\n      <button class=\"btn sm primary\" onclick=\"Actions.openVisitLogForm('${s.id}')\">+ 방문기록 추가</button>\n    </div>`;\n  if(logs.length===0){\n    html += `<div class=\"empty-state\"><div class=\"emoji\">🗒️</div>기록된 방문/활동 이력이 없습니다.</div>`;\n  }else{\n    logs.slice().reverse().forEach(l=>{\n      const checkedLabels = App.visitChecklist.filter(it=>l.checklist && l.checklist[it.key]).map(it=>it.label);\n      html += `<div class=\"item-row\">\n        <div class=\"content\">\n          <div class=\"title\">${l.date||'-'} ${l.store? '· '+App.util.esc(l.store):''}</div>\n          ${checkedLabels.length? `<div class=\"meta\" style=\"margin-top:4px;\">${checkedLabels.map(lb=>`<span class=\"badge neutral\" style=\"margin:2px 4px 2px 0;\">${App.util.esc(lb)}</span>`).join('')}</div>`:''}\n          ${l.memo? `<div class=\"meta\" style=\"margin-top:4px;\">${App.util.esc(l.memo)}</div>`:''}\n        </div>\n        <div class=\"actions\"><button class=\"icon-btn\" onclick=\"Actions.deleteVisitLog('${s.id}','${l.id}')\">🗑️</button></div>\n      </div>`;\n    });\n  }\n  html += '</div>';\n  return html;\n};\n\n/* -- 관리자 활동 통계 탭 (체크리스트 항목별 누적 횟수) -- */\nViews._tabActivityStats = function(s){\n  const logs = s.visitLogs||[];\n  const statKeys = [\n    {key:'pop', label:'POP 확인'},\n    {key:'price', label:'가격고지'},\n    {key:'directDisplay', label:'직접연관진열'},\n    {key:'loyalCustomer', label:'충성고객 확보'},\n    {key:'serviceEdu', label:'고객응대 교육'},\n    {key:'salesEncourage', label:'매출 독려'},\n    {key:'note', label:'행사노트 작성'}\n  ];\n  const counts = statKeys.map(it=>({ label:it.label, count: logs.filter(l=>l.checklist && l.checklist[it.key]).length }));\n  let html = `<div class=\"card\">\n    <div style=\"font-weight:800;margin-bottom:4px;\">활동 통계 (누적 방문 ${logs.length}건 기준)</div>`;\n  if(logs.length===0){\n    html += `<div class=\"empty-state\"><div class=\"emoji\">📊</div>활동이력이 없습니다. '활동 이력' 탭에서 방문기록을 추가해주세요.</div>`;\n  }else{\n    html += App.chart.bar(counts.map(c=>c.label), counts.map(c=>c.count), {suffix:'회'});\n  }\n  html += '</div>';\n  return html;\n};\n\n/* -- 충성고객 탭 -- */\nViews._tabCustomer = function(s){\n  const list = s.customers||[];\n  let html = `<div class=\"card\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\">\n      <div style=\"font-weight:800;\">충성고객 (${list.length}명)</div>\n      <button class=\"btn sm primary\" onclick=\"Actions.openCustomerForm('${s.id}')\">+ 고객 추가</button>\n    </div>`;\n  if(list.length===0){\n    html += `<div class=\"empty-state\"><div class=\"emoji\">💛</div>등록된 충성고객이 없습니다.</div>`;\n  }else{\n    list.slice().reverse().forEach(c=>{\n      html += `<div class=\"item-row\">\n        <div class=\"check ${c.revisited?'done':''}\" title=\"재방문 체크\" onclick=\"Actions.toggleRevisit('${s.id}','${c.id}')\">${c.revisited?'✓':''}</div>\n        <div class=\"content\"><div class=\"title\">${App.util.esc(c.name)} <span style=\"color:var(--text-secondary);font-weight:600;\">· ${App.util.esc(c.interest||'-')}</span></div>\n          <div class=\"meta\">${App.util.esc(c.store||'-')} · 확보일 ${c.acquiredDate||'-'} · 다음방문예정 ${c.nextVisit||'-'}</div>\n          ${c.memo? `<div class=\"meta\">${App.util.esc(c.memo)}</div>`:''}</div>\n        <div class=\"actions\"><button class=\"icon-btn\" onclick=\"Actions.deleteCustomer('${s.id}','${c.id}')\">🗑️</button></div>\n      </div>`;\n    });\n  }\n  html += '</div>';\n  return html;\n};\n\n/* -- 월별 성과 탭 (엑셀 Import 데이터 기반 자동 집계, 금액은 표시하지 않음) -- */\nViews._tabMonthly = function(s){\n  const yms = App._allYMs; // 오름차순 전체 월 목록\n  const monthlyRows = yms.map(ym=>({ ym, a: App.getStaffAgg(s.name, ym) })).filter(x=>x.a.days>0);\n\n  if(monthlyRows.length===0){\n    return `<div class=\"card empty-state\"><div class=\"emoji\">📊</div>이 행사자의 실적 데이터가 없습니다. 엑셀을 업로드해주세요.</div>`;\n  }\n\n  const cumRowsWithData = yms.map(ym=>({ ym, a: App.getStaffCumulativeAgg(s.name, ym) })).filter(x=>x.a.days>0);\n\n  let html = `<div class=\"card\">\n    <div style=\"font-weight:800;margin-bottom:2px;\">누적 평균달성률 추이</div>\n    <div style=\"font-size:12px;color:var(--text-secondary);margin-bottom:6px;\">각 월까지 누적된 평균달성률입니다. 등급이 시간에 따라 어떻게 변해왔는지 확인할 수 있습니다.</div>\n    ${App.chart.bar(cumRowsWithData.map(r=>r.ym.slice(5)+'월'), cumRowsWithData.map(r=>r.a.avgRate), {suffix:'%'})}\n  </div>\n  <div class=\"card\" style=\"margin-top:16px;\">\n    <div style=\"font-weight:800;margin-bottom:10px;\">월별 성과 상세</div>\n    <div style=\"overflow-x:auto;\"><table class=\"staff-table\"><thead><tr>\n      <th>월</th><th>등급(누적기준)</th><th>행사일수</th><th>평균달성률</th><th>16만원미만</th><th>목표미달</th>\n    </tr></thead><tbody>`;\n  monthlyRows.slice().reverse().forEach(r=>{\n    const cumGm = App.groupMeta(App.getStaffCumulativeAgg(s.name, r.ym).group);\n    html += `<tr><td>${App.util.monthLabel(r.ym)}</td><td><span class=\"badge ${cumGm.cls}\">${cumGm.label}</span></td>\n      <td>${r.a.days}일</td><td>${r.a.avgRate}%</
