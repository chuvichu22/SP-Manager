<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>행사자 성장관리 시스템</title>

<!-- Firebase SDK 추가 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- SheetJS(xlsx) 라이브러리: 엑셀(.xlsx/.xls) 파일을 ArrayBuffer로 읽어 파싱하기 위해 사용합니다. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =========================================================================
   행사자 성장관리 시스템 - 전역 스타일
   디자인 톤: Apple 스타일 (밝은 그레이 배경 + 화이트 카드 + 블루 포인트)
   ========================================================================= */
:root{
  --bg:#f5f5f7;
  --bg-elevated:#ffffff;
  --bg-soft:#eceef1;
  --text:#1d1d1f;
  --text-secondary:#6e6e73;
  --border:rgba(0,0,0,0.08);
  --shadow:0 2px 10px rgba(0,0,0,0.06);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.10);
  --accent:#0071e3;
  --accent-soft:#e8f2fe;
  --good:#34c759;      /* 우수그룹 */
  --good-soft:#e7f8ec;
  --growth:#ff9f0a;     /* 성장그룹 */
  --growth-soft:#fff3e0;
  --improve:#ff3b30;    /* 개선그룹 */
  --improve-soft:#ffeceb;
  --radius:16px;
  --radius-sm:10px;
  --nav-w:230px;
}
[data-theme="dark"]{
  --bg:#000000;
  --bg-elevated:#1c1c1e;
  --bg-soft:#2c2c2e;
  --text:#f5f5f7;
  --text-secondary:#98989d;
  --border:rgba(255,255,255,0.1);
  --shadow:0 2px 10px rgba(0,0,0,0.4);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.5);
  --accent:#0a84ff;
  --accent-soft:#0a3a63;
  --good-soft:#0e2f18;
  --growth-soft:#3a2a06;
  --improve-soft:#3a1210;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","SF Pro Display","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .3s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:8px;}

/* ---------- 레이아웃 ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--nav-w);
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  padding:20px 14px;
  position:fixed;top:0;bottom:0;left:0;
  overflow-y:auto;
  z-index:100;
  transition:transform .25s ease;
}
.sidebar .brand{
  font-size:19px;font-weight:800;padding:8px 10px 18px;letter-spacing:-.3px;
  display:flex;align-items:center;gap:8px;
}
.sidebar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:var(--radius-sm);
  color:var(--text-secondary);font-size:14.5px;font-weight:600;
  cursor:pointer;margin-bottom:2px;user-select:none;
  transition:background .15s ease,color .15s ease;
}
.nav-item .ico{font-size:16px;width:20px;text-align:center;}
.nav-item:hover{background:var(--bg-soft);color:var(--text);}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-sep{height:1px;background:var(--border);margin:12px 4px;}
.nav-footer{margin-top:auto;padding:12px 10px;}
.theme-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-soft);
  font-size:13px;font-weight:600;color:var(--text-secondary);
}
.switch{position:relative;width:42px;height:24px;background:#c7c7cc;border-radius:20px;cursor:pointer;transition:.2s;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{left:20px;}

.main{margin-left:var(--nav-w);flex:1;padding:26px 32px 80px;max-width:1400px;width:100%;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.4px;}
.topbar .sub{color:var(--text-secondary);font-size:13.5px;margin-top:4px;}
.hamburger{display:none;}

/* ---------- 공통 카드/버튼 ---------- */
.card{
  background:var(--bg-elevated);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:20px;animation:fadeUp .35s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  border:none;border-radius:980px;padding:9px 18px;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:transform .1s ease,opacity .15s ease,background .15s ease;
  background:var(--bg-soft);color:var(--text);white-space:nowrap;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent);color:#fff;}
.btn.primary:hover{opacity:.9;}
.btn.danger{background:var(--improve);color:#fff;}
.btn.ghost{background:transparent;color:var(--accent);}
.btn.sm{padding:6px 12px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:980px;font-size:11.5px;font-weight:700;}
.badge.good{background:var(--good-soft);color:var(--good);}
.badge.growth{background:var(--growth-soft);color:var(--growth);}
.badge.improve{background:var(--improve-soft);color:var(--improve);}
.badge.neutral{background:var(--bg-soft);color:var(--text-secondary);}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:13.5px;outline:none;transition:border .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.field-label{font-size:12.5px;font-weight:700;color:var(--text-secondary);display:block;margin:0 0 6px;}
.field{margin-bottom:14px;}
textarea{resize:vertical;min-height:70px;}

/* ---------- 대시보드 ---------- */
.stat-card{position:relative;overflow:hidden;}
.stat-card .label{font-size:12.5px;color:var(--text-secondary);font-weight:700;margin-bottom:8px;}
.stat-card .value{font-size:30px;font-weight:800;letter-spacing:-.5px;}
.stat-card .value small{font-size:15px;font-weight:700;color:var(--text-secondary);}
.stat-card .icon{position:absolute;right:14px;top:14px;font-size:22px;opacity:.5;}
.progress-bar{height:8px;border-radius:8px;background:var(--bg-soft);overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;border-radius:8px;background:var(--accent);transition:width .5s ease;}

.section-title{font-size:16px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .cnt{font-size:12px;font-weight:700;color:var(--text-secondary);background:var(--bg-soft);padding:2px 9px;border-radius:980px;}

/* 커스텀 차트 (canvas 없이 div로 구현) */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar-chart .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);transition:height .5s ease;position:relative;}
.bar-chart .bar .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;}
.bar-chart .lbl{font-size:11px;color:var(--text-secondary);font-weight:600;}

.donut-wrap{display:flex;align-items:center;gap:18px;}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--good) 0 var(--p1),var(--growth) var(--p1) var(--p2),var(--improve) var(--p2) 100%);
  position:relative;
}
.donut::after{content:attr(data-total);position:absolute;inset:16px;background:var(--bg-elevated);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px;}
.legend-dot{width:10px;height:10px;border-radius:3px;}

/* ---------- 리스트 / 테이블 ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar input, .toolbar select{width:auto;min-width:150px;}
.toolbar .grow{flex:1;min-width:200px;}

.staff-table{width:100%;border-collapse:collapse;}
.staff-table th{text-align:left;font-size:12px;color:var(--text-secondary);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);}
.staff-table td{padding:12px;border-bottom:1px solid var(--border);font-size:13.5px;}
.staff-table tr.row{cursor:pointer;transition:background .12s ease;}
.staff-table tr.row:hover{background:var(--bg-soft);}
.staff-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:8px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary);}
.empty-state .emoji{font-size:40px;margin-bottom:10px;}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;padding-bottom:0;}
.tab-btn{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--text-secondary);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--accent);border-color:var(--accent);}

/* ---------- 리스트 아이템 (목표/활동/고객/메모) ---------- */
.item-row{
  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--radius-sm);
  background:var(--bg-soft);margin-bottom:8px;
}
.item-row .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;}
.item-row .check.done{background:var(--good);border-color:var(--good);color:#fff;font-size:13px;}
.item-row .content{flex:1;min-width:0;}
.item-row .title{font-weight:700;font-size:13.8px;}
.item-row .title.strike{text-decoration:line-through;color:var(--text-secondary);}
.item-row .meta{font-size:12px;color:var(--text-secondary);margin-top:3px;}
.item-row .actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--border);}

/* ---------- 타임라인 ---------- */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:22px;}
.tl-item::before{content:'';position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg-elevated);box-shadow:0 0 0 2px var(--accent);}
.tl-item .date{font-size:11.5px;color:var(--text-secondary);font-weight:700;}
.tl-item .txt{font-size:14px;font-weight:700;margin-top:3px;}
.tl-item .sub{font-size:12.5px;color:var(--text-secondary);margin-top:2px;}

/* ---------- 모달 ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
  animation:fadeIn .18s ease both;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--bg-elevated);border-radius:20px;padding:24px;max-width:520px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:modalIn .22s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal h2{margin:0 0 18px;font-size:18px;font-weight:800;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

/* ---------- 체크리스트 ---------- */
.checklist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:640px){.checklist-grid{grid-template-columns:1fr;}}
.chk-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-soft);border-radius:var(--radius-sm);cursor:pointer;user-select:none;}
.chk-item input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.chk-item span{font-size:13.5px;font-weight:600;}
.report-box{
  white-space:pre-wrap;background:var(--bg-soft);border-radius:var(--radius-sm);padding:16px;
  font-size:14px;line-height:1.75;margin-top:14px;min-height:100px;
}

/* ---------- AI 코칭 카드 ---------- */
.coach-block{margin-bottom:14px;}
.coach-block h4{margin:0 0 6px;font-size:13px;color:var(--accent);font-weight:800;}
.coach-block p{margin:0;font-size:13.5px;line-height:1.6;}

/* ---------- 토스트 ---------- */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:980px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:2000;box-shadow:var(--shadow-lg);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- 반응형: 모바일 ---------- */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);width:250px;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;padding:20px 16px 90px;}
  .hamburger{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
    background:var(--bg-elevated);border:1px solid var(--border);cursor:pointer;font-size:18px;}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none;}
  .sidebar-backdrop.show{display:block;}
}
.hide{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="UI.closeSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span>샘표 전남 유인행사</div>
    <div class="nav-item" data-route="dashboard"><span class="ico">📊</span>대시보드</div>
    <div class="nav-item" data-route="staff"><span class="ico">👥</span>행사자 관리</div>
    <div class="nav-item" data-route="reports"><span class="ico">📋</span>활동일보 업로드</div>
    <div class="nav-item" data-route="data"><span class="ico">🗂️</span>자료 관리</div>
    <div class="nav-sep"></div>
    <div class="nav-footer">
      <div class="theme-toggle" onclick="UI.toggleTheme()">
        <span id="themeLabel">다크 모드</span>
        <div class="switch" id="themeSwitch"></div>
      </div>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="hamburger" onclick="UI.openSidebar()">☰</div>
        <div>
          <h1 id="pageTitle">대시보드</h1>
          <div class="sub" id="pageSub">전남지점 행사자 현황을 한눈에 확인하세요</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div id="ymSelector"></div>
        <div id="topbarActions"></div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   행사자 성장관리 시스템 - 애플리케이션 스크립트 (Firebase 동기화 포함)
   ========================================================================= */
const App = {};

/* ------------------------- 0. Firebase 설정 ------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBH8GZEKOL01WJonIdaoaKx2LsKcAamwos",
  authDomain: "promoter-app-986d0.firebaseapp.com",
  projectId: "promoter-app-986d0",
  storageBucket: "promoter-app-986d0.firebasestorage.app",
  messagingSenderId: "645838277395",
  appId: "1:645838277395:web:9c32530c619d3b9923e8e6",
  measurementId: "G-2ZTXR58CNX"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ------------------------- 1. 데이터베이스 계층 ------------------------- */
App.DB_KEY = 'promoterGrowthDB_v1';
App.THEME_KEY = 'promoterGrowthTheme_v1';

App.defaultDB = function(){
  return {
    staff: [],
    records: [], 
    activityReports: [], 
    nameAliasMap: {}, 
    meta:{ lastBackup:null, schemaVersion:3, lastActivityUpload:null }
  };
};

App.load = async function(onComplete){
  let loaded = null;
  try{
    const docRef = db.collection('promoterApp').doc('mainDatabase');
    const doc = await docRef.get();

    if (doc.exists) {
      const raw = doc.data().dataString;
      if(raw) loaded = JSON.parse(raw);
    } else {
      const rawLocal = localStorage.getItem(App.DB_KEY);
      if(rawLocal) loaded = JSON.parse(rawLocal);
    }
  }catch(e){
    console.error('데이터를 읽는 중 오류가 발생하여 초기화합니다.', e);
    loaded = null;
  }

  const isValid = loaded && typeof loaded==='object' && !Array.isArray(loaded)
    && Array.isArray(loaded.staff) && loaded.meta && loaded.meta.schemaVersion===3;

  App.db = isValid ? loaded : App.defaultDB();

  if(!Array.isArray(App.db.staff)) App.db.staff = [];
  if(!Array.isArray(App.db.records)) App.db.records = [];
  if(!Array.isArray(App.db.activityReports)) App.db.activityReports = [];
  if(!App.db.nameAliasMap || typeof App.db.nameAliasMap!=='object' || Array.isArray(App.db.nameAliasMap)) App.db.nameAliasMap = {};
  if(!App.db.meta || typeof App.db.meta!=='object') App.db.meta = { lastBackup:null, schemaVersion:3, lastActivityUpload:null };
  if(App.db.meta.lastActivityUpload===undefined) App.db.meta.lastActivityUpload = null;
  App.db.meta.schemaVersion = 3;

  // [수정] 26년이 2로 들어간 기존 엑셀 데이터 강제 보정 처방
  App.db.records.forEach(r => {
      let y = parseInt(r.year, 10);
      if (y < 2000) {
          if (y === 2 || y === 26) y = 2026;
          else if (y >= 20 && y <= 99) y = 2000 + y;
          else y = 2026;
          r.year = y;
          r.ym = `${y}-${String(r.month).padStart(2, '0')}`;
      }
  });

  try{
    App._rebuildRecordIndex();
  }catch(e){
    console.error('실적 데이터 인덱스 생성 중 오류가 발생하여 실적 데이터를 초기화합니다.', e);
    App.db.records = [];
    App._byYM = {};
    App._allYMs = [];
  }

  try{ App.save(); }catch(e){ console.error('초기 저장 실패', e); }
  if(onComplete) onComplete();
};

App.STATE_KEY = 'promoterGrowthState_v1';
App.loadState = function(){
  try{
    App.state = JSON.parse(localStorage.getItem(App.STATE_KEY)) || {};
  }catch(e){ App.state = {}; }
  if(!App.state.selectedYM) App.state.selectedYM = null;
};
App.saveState = function(){
  localStorage.setItem(App.STATE_KEY, JSON.stringify(App.state));
};

App._rebuildRecordIndex = function(){

};

/* ------------------------- 2. 유틸리티 ------------------------- */
App.util = {
  todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); },
  monthKey(d){ d = d? new Date(d): new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); },
  monthLabel(mk){ const [y,m]=mk.split('-'); return `${y}년 ${parseInt(m)}월`; },
  fmtDate(s){ if(!s) return '-'; return s; },
  esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  clamp(n,a,b){ return Math.max(a,Math.min(b,n)); },
  seededRandom(seedStr){
    let h = 0;
    for(let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) >>> 0; }
    return function(){ h = (h*1103515245 + 12345) >>> 0; return (h % 1000)/1000; };
  },
  pick(arr, rnd){ return arr[Math.floor(rnd()*arr.length) % arr.length]; },
  toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(App._toastTimer);
    App._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  },
  monthsOfYear(){ return ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']; },
  currentMonthNum(){ return new Date().getMonth()+1; },
  avg(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; },

  excelSerialToDate(serial){
    const utcDays = Math.floor(serial - 25569);
    const utcMs = utcDays * 86400 * 1000;
    return new Date(utcMs);
  },
  formatDateObj(d){
    if(!(d instanceof Date) || isNaN(d.getTime())) return null;
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  },
  normalizeExcelDate(value, monthHint){
    if(value===undefined || value===null || value==='') return null;
    if(value instanceof Date) return App.util.formatDateObj(value);
    if(typeof value === 'number'){
      if(value>=1 && value<=31 && monthHint){
        const y = new Date().getFullYear();
        return App.util.formatDateObj(new Date(y, monthHint-1, Math.round(value)));
      }
      return App.util.formatDateObj(App.util.excelSerialToDate(value));
    }
    const str = String(value).trim();
    if(!str) return null;
    const dayOnly = str.match(/^(\d{1,2})\s*일?$/);
    if(dayOnly && monthHint){
      const y = new Date().getFullYear();
      return App.util.formatDateObj(new Date(y, monthHint-1, parseInt(dayOnly[1],10)));
    }
    let normalized = str.replace(/년|월/g,'-').replace(/일$/,'').replace(/[.\/]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
    let d = new Date(normalized);
    if(!isNaN(d.getTime())) return App.util.formatDateObj(d);
    d = new Date(str);
    if(!isNaN(d.getTime())) return App.util.formatDateObj(d);
    return null;
  },
  parseNumberLoose(v){
    if(v===undefined || v===null || v==='') return 0;
    if(typeof v === 'number') return v;
    const cleaned = String(v).replace(/[,원%\s]/g,'');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  },
  parsePercentLoose(v){
    if(v===undefined || v===null || v==='') return null;
    if(typeof v === 'number') return v<=1 ? Math.round(v*100) : Math.round(v);
    const hadPercentSign = String(v).indexOf('%')>=0;
    const cleaned = String(v).replace(/[%\s]/g,'');
    const n = parseFloat(cleaned);
    if(isNaN(n)) return null;
    return (n<=1 && !hadPercentSign) ? Math.round(n*100) : Math.round(n);
  },
  parseAchievementRate(v){
    if(v===undefined || v===null || v==='') return null;
    if(typeof v === 'number') return v*100;
    const hadPercentSign = String(v).indexOf('%')>=0;
    const cleaned = String(v).replace(/[%\s,]/g,'');
    const n = parseFloat(cleaned);
    if(isNaN(n)) return null;
    return hadPercentSign ? n : n*100;
  }
};

App.canonFields = [
  {key:'staffName', label:'행사자명', aliases:['행사자명','사원명','이름','행사자','성명','담당자']},
  {key:'date',      label:'날짜',    aliases:['날짜','일자','방문일','등록일','행사일']},
  {key:'store',     label:'매장명',  aliases:['매장명','매장','점포명','점포','지점']},
  {key:'sales',     label:'매출',    aliases:['매출','총매출','판매금액','매출액','실적']},
  {key:'target',    label:'목표',    aliases:['목표','목표금액','목표매출']},
  {key:'achievementRate', label:'달성률', aliases:['달성률','달성율','달성퍼센트','달성%']}
];
App.util.normalizeHeaderStr = function(s){
  return String(s||'').replace(/[\s()\[\]%_·\-]/g,'').toLowerCase();
};
App.util.guessCanonForHeader = function(header){
  const nh = App.util.normalizeHeaderStr(header);
  if(!nh) return null;
  for(const f of App.canonFields){
    for(const alias of f.aliases){
      const na = App.util.normalizeHeaderStr(alias);
      if(nh===na || nh.includes(na) || na.includes(nh)) return f.key;
    }
  }
  return null;
};

/* ------------------------- 3. 실적 집계 & 그룹(우수/성장/개선) 자동 분류 ------------------------- */
App._aggCache = {};
App._cumAggCache = {};

App.invalidateAggCache = function(){
  App._aggCache = {};
  App._cumAggCache = {};
};

App._classifyGroup = function(a){
  if(a.days < 10) return '제외';
  if(a.avgRate>=125 && a.under16Pct<=35) return '우수';
  if(a.avgRate>=95 && a.under16Pct<=60) return '성장';
  return '개선';
};

App._aggregateRecords = function(records){
  // [수정] 전체 통계 시 활동중인 행사자만 반영하도록 명단 확보
  const activeStaff = new Set(App.db.staff.filter(s => s.status !== '활동중단').map(s => s.name));
  const byStaff = {};
  records.forEach(r=>{
    if(!byStaff[r.staffName]){
      byStaff[r.staffName] = { days:0, totalTarget:0, totalSales:0, rateSum:0, under16Count:0, missCount:0, items:{} };
    }
    const a = byStaff[r.staffName];
    a.days++;
    a.totalTarget += Number(r.target)||0;
    a.totalSales += Number(r.totalSales)||0;
    a.rateSum += Number(r.achievementRate)||0;
    if(Number(r.totalSales) < 160000) a.under16Count++;
    if(Number(r.totalSales) < Number(r.target)) a.missCount++;

    // [수정] 품목 집계 추가
    if(r.items) {
        for(let k in r.items) {
            a.items[k] = (a.items[k] || 0) + r.items[k];
        }
    }
  });

  const names = Object.keys(byStaff);
  names.forEach(name=>{
    const a = byStaff[name];
    a.avgRate = a.days ? Math.round(a.rateSum/a.days) : 0;
    a.under16Pct = a.days ? Math.round(a.under16Count/a.days*100) : 0;
    a.missPct = a.days ? Math.round(a.missCount/a.days*100) : 0;
    a.group = App._classifyGroup(a);
  });

  // [수정] 대시보드의 '전체 행사자' 숫자를 셀 때 활동중단자는 빼고 셈
  const activeNames = names.filter(n => activeStaff.has(n));
  const graded = activeNames.filter(n=>byStaff[n].group!=='제외');
  const overall = {
    totalStaff: activeNames.length,
    good: activeNames.filter(n=>byStaff[n].group==='우수').length,
    growth: activeNames.filter(n=>byStaff[n].group==='성장').length,
    improve: activeNames.filter(n=>byStaff[n].group==='개선').length,
    excluded: activeNames.filter(n=>byStaff[n].group==='제외').length,
    avgRate: graded.length ? Math.round(App.util.avg(graded.map(n=>byStaff[n].avgRate))) : 0,
    totalTarget: activeNames.reduce((s,n)=>s+byStaff[n].totalTarget,0),
    totalSales: activeNames.reduce((s,n)=>s+byStaff[n].totalSales,0)
  };
  return { byStaff, overall };
};

App.getMonthlyAgg = function(ym){
  if(!ym) return { byStaff:{}, overall:{ totalStaff:0, good:0, growth:0, improve:0, excluded:0, avgRate:0, totalTarget:0, totalSales:0 } };
  if(App._aggCache[ym]) return App._aggCache[ym];
  const result = App._aggregateRecords(App._byYM[ym] || []);
  App._aggCache[ym] = result;
  return result;
};

App.getCumulativeAgg = function(ym){
  if(!ym) return { byStaff:{}, overall:{ totalStaff:0, good:0, growth:0, improve:0, excluded:0, avgRate:0, totalTarget:0, totalSales:0 } };
  if(App._cumAggCache[ym]) return App._cumAggCache[ym];
  const records = App.db.records.filter(r=>r.ym<=ym);
  const result = App._aggregateRecords(records);
  App._cumAggCache[ym] = result;
  return result;
};

App.getAggForYM = App.getMonthlyAgg;

App.getStaffAgg = function(staffName, ym){
  const agg = App.getMonthlyAgg(ym);
  return agg.byStaff[staffName] || { days:0, totalTarget:0, totalSales:0, avgRate:0, under16Count:0, under16Pct:0, missCount:0, missPct:0, group:'제외' };
};

App.getStaffCumulativeAgg = function(staffName, ym){
  const agg = App.getCumulativeAgg(ym);
  return agg.byStaff[staffName] || { days:0, totalTarget:0, totalSales:0, avgRate:0, under16Count:0, under16Pct:0, missCount:0, missPct:0, group:'제외' };
};

App.groupMeta = function(g){
  if(g==='우수') return {cls:'good', label:'우수그룹'};
  if(g==='성장') return {cls:'growth', label:'성장그룹'};
  if(g==='개선') return {cls:'improve', label:'개선그룹'};
  return {cls:'neutral', label:'집계제외(10일 미만)'};
};
