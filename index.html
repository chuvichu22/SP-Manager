<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>행사자 성장관리 시스템</title>
<!-- SheetJS(xlsx) 라이브러리: 엑셀(.xlsx/.xls) 파일을 ArrayBuffer로 읽어 파싱하기 위해 사용합니다. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =========================================================================
   행사자 성장관리 시스템 - 전역 스타일
   디자인 톤: Apple 스타일 (밝은 그레이 배경 + 화이트 카드 + 블루 포인트)
   ========================================================================= */
:root{
  --bg:#f5f5f7;
  --bg-elevated:#ffffff;
  --bg-soft:#eceef1;
  --text:#1d1d1f;
  --text-secondary:#6e6e73;
  --border:rgba(0,0,0,0.08);
  --shadow:0 2px 10px rgba(0,0,0,0.06);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.10);
  --accent:#0071e3;
  --accent-soft:#e8f2fe;
  --good:#34c759;      /* 우수그룹 */
  --good-soft:#e7f8ec;
  --growth:#ff9f0a;     /* 성장그룹 */
  --growth-soft:#fff3e0;
  --improve:#ff3b30;    /* 개선그룹 */
  --improve-soft:#ffeceb;
  --radius:16px;
  --radius-sm:10px;
  --nav-w:230px;
}
[data-theme="dark"]{
  --bg:#000000;
  --bg-elevated:#1c1c1e;
  --bg-soft:#2c2c2e;
  --text:#f5f5f7;
  --text-secondary:#98989d;
  --border:rgba(255,255,255,0.1);
  --shadow:0 2px 10px rgba(0,0,0,0.4);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.5);
  --accent:#0a84ff;
  --accent-soft:#0a3a63;
  --good-soft:#0e2f18;
  --growth-soft:#3a2a06;
  --improve-soft:#3a1210;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","SF Pro Display","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .3s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:8px;}

/* ---------- 레이아웃 ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--nav-w);
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  padding:20px 14px;
  position:fixed;top:0;bottom:0;left:0;
  overflow-y:auto;
  z-index:100;
  transition:transform .25s ease;
}
.sidebar .brand{
  font-size:19px;font-weight:800;padding:8px 10px 18px;letter-spacing:-.3px;
  display:flex;align-items:center;gap:8px;
}
.sidebar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:var(--radius-sm);
  color:var(--text-secondary);font-size:14.5px;font-weight:600;
  cursor:pointer;margin-bottom:2px;user-select:none;
  transition:background .15s ease,color .15s ease;
}
.nav-item .ico{font-size:16px;width:20px;text-align:center;}
.nav-item:hover{background:var(--bg-soft);color:var(--text);}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-sep{height:1px;background:var(--border);margin:12px 4px;}
.nav-footer{margin-top:auto;padding:12px 10px;}
.theme-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-soft);
  font-size:13px;font-weight:600;color:var(--text-secondary);
}
.switch{position:relative;width:42px;height:24px;background:#c7c7cc;border-radius:20px;cursor:pointer;transition:.2s;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{left:20px;}

.main{margin-left:var(--nav-w);flex:1;padding:26px 32px 80px;max-width:1400px;width:100%;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.4px;}
.topbar .sub{color:var(--text-secondary);font-size:13.5px;margin-top:4px;}
.hamburger{display:none;}

/* ---------- 공통 카드/버튼 ---------- */
.card{
  background:var(--bg-elevated);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:20px;animation:fadeUp .35s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  border:none;border-radius:980px;padding:9px 18px;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:transform .1s ease,opacity .15s ease,background .15s ease;
  background:var(--bg-soft);color:var(--text);white-space:nowrap;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent);color:#fff;}
.btn.primary:hover{opacity:.9;}
.btn.danger{background:var(--improve);color:#fff;}
.btn.ghost{background:transparent;color:var(--accent);}
.btn.sm{padding:6px 12px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:980px;font-size:11.5px;font-weight:700;}
.badge.good{background:var(--good-soft);color:var(--good);}
.badge.growth{background:var(--growth-soft);color:var(--growth);}
.badge.improve{background:var(--improve-soft);color:var(--improve);}
.badge.neutral{background:var(--bg-soft);color:var(--text-secondary);}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:13.5px;outline:none;transition:border .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.field-label{font-size:12.5px;font-weight:700;color:var(--text-secondary);display:block;margin:0 0 6px;}
.field{margin-bottom:14px;}
textarea{resize:vertical;min-height:70px;}

/* ---------- 대시보드 ---------- */
.stat-card{position:relative;overflow:hidden;}
.stat-card .label{font-size:12.5px;color:var(--text-secondary);font-weight:700;margin-bottom:8px;}
.stat-card .value{font-size:30px;font-weight:800;letter-spacing:-.5px;}
.stat-card .value small{font-size:15px;font-weight:700;color:var(--text-secondary);}
.stat-card .icon{position:absolute;right:14px;top:14px;font-size:22px;opacity:.5;}
.progress-bar{height:8px;border-radius:8px;background:var(--bg-soft);overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;border-radius:8px;background:var(--accent);transition:width .5s ease;}

.section-title{font-size:16px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .cnt{font-size:12px;font-weight:700;color:var(--text-secondary);background:var(--bg-soft);padding:2px 9px;border-radius:980px;}

/* 커스텀 차트 (canvas 없이 div로 구현) */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar-chart .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);transition:height .5s ease;position:relative;}
.bar-chart .bar .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;}
.bar-chart .lbl{font-size:11px;color:var(--text-secondary);font-weight:600;}

.donut-wrap{display:flex;align-items:center;gap:18px;}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--good) 0 var(--p1),var(--growth) var(--p1) var(--p2),var(--improve) var(--p2) 100%);
  position:relative;
}
.donut::after{content:attr(data-total);position:absolute;inset:16px;background:var(--bg-elevated);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px;}
.legend-dot{width:10px;height:10px;border-radius:3px;}

/* ---------- 리스트 / 테이블 ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar input, .toolbar select{width:auto;min-width:150px;}
.toolbar .grow{flex:1;min-width:200px;}

.staff-table{width:100%;border-collapse:collapse;}
.staff-table th{text-align:left;font-size:12px;color:var(--text-secondary);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);}
.staff-table td{padding:12px;border-bottom:1px solid var(--border);font-size:13.5px;}
.staff-table tr.row{cursor:pointer;transition:background .12s ease;}
.staff-table tr.row:hover{background:var(--bg-soft);}
.staff-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:8px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary);}
.empty-state .emoji{font-size:40px;margin-bottom:10px;}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;padding-bottom:0;}
.tab-btn{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--text-secondary);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--accent);border-color:var(--accent);}

/* ---------- 리스트 아이템 (목표/활동/고객/메모) ---------- */
.item-row{
  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--radius-sm);
  background:var(--bg-soft);margin-bottom:8px;
}
.item-row .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;}
.item-row .check.done{background:var(--good);border-color:var(--good);color:#fff;font-size:13px;}
.item-row .content{flex:1;min-width:0;}
.item-row .title{font-weight:700;font-size:13.8px;}
.item-row .title.strike{text-decoration:line-through;color:var(--text-secondary);}
.item-row .meta{font-size:12px;color:var(--text-secondary);margin-top:3px;}
.item-row .actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--border);}

/* ---------- 타임라인 ---------- */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:22px;}
.tl-item::before{content:'';position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg-elevated);box-shadow:0 0 0 2px var(--accent);}
.tl-item .date{font-size:11.5px;color:var(--text-secondary);font-weight:700;}
.tl-item .txt{font-size:14px;font-weight:700;margin-top:3px;}
.tl-item .sub{font-size:12.5px;color:var(--text-secondary);margin-top:2px;}

/* ---------- 모달 ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
  animation:fadeIn .18s ease both;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--bg-elevated);border-radius:20px;padding:24px;max-width:520px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:modalIn .22s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal h2{margin:0 0 18px;font-size:18px;font-weight:800;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

/* ---------- 체크리스트 ---------- */
.checklist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:640px){.checklist-grid{grid-template-columns:1fr;}}
.chk-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-soft);border-radius:var(--radius-sm);cursor:pointer;user-select:none;}
.chk-item input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.chk-item span{font-size:13.5px;font-weight:600;}
.report-box{
  white-space:pre-wrap;background:var(--bg-soft);border-radius:var(--radius-sm);padding:16px;
  font-size:14px;line-height:1.75;margin-top:14px;min-height:100px;
}

/* ---------- AI 코칭 카드 ---------- */
.coach-block{margin-bottom:14px;}
.coach-block h4{margin:0 0 6px;font-size:13px;color:var(--accent);font-weight:800;}
.coach-block p{margin:0;font-size:13.5px;line-height:1.6;}

/* ---------- 토스트 ---------- */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:980px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:2000;box-shadow:var(--shadow-lg);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- 반응형: 모바일 ---------- */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);width:250px;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;padding:20px 16px 90px;}
  .hamburger{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
    background:var(--bg-elevated);border:1px solid var(--border);cursor:pointer;font-size:18px;}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none;}
  .sidebar-backdrop.show{display:block;}
}
.hide{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="UI.closeSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span>샘표 전남 유인행사</div>
    <div class="nav-item" data-route="dashboard"><span class="ico">📊</span>대시보드</div>
    <div class="nav-item" data-route="staff"><span class="ico">👥</span>행사자 관리</div>
    <div class="nav-item" data-route="reports"><span class="ico">📋</span>활동일보 업로드</div>
    <div class="nav-item" data-route="data"><span class="ico">🗂️</span>자료 관리</div>
    <div class="nav-sep"></div>
    <div class="nav-footer">
      <div class="theme-toggle" onclick="UI.toggleTheme()">
        <span id="themeLabel">다크 모드</span>
        <div class="switch" id="themeSwitch"></div>
      </div>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="hamburger" onclick="UI.openSidebar()">☰</div>
        <div>
          <h1 id="pageTitle">대시보드</h1>
          <div class="sub" id="pageSub">전남지점 행사자 현황을 한눈에 확인하세요</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div id="ymSelector"></div>
        <div id="topbarActions"></div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   행사자 성장관리 시스템 - 애플리케이션 스크립트
   구조: DB(localStorage) -> Router -> View 렌더러 -> CRUD 핸들러
   추후 기능 추가가 쉽도록 App 네임스페이스 하나로 모듈화했습니다.
   ========================================================================= */
const App = {};

/* ------------------------- 1. 데이터베이스 계층 ------------------------- */
App.DB_KEY = 'promoterGrowthDB_v1';
App.THEME_KEY = 'promoterGrowthTheme_v1';

App.defaultDB = function(){
  return {
    staff: [],
    records: [], // 샘표 전남지역 유인행사 실적 레코드 (엑셀 Import 결과, 행 단위 원본 데이터)
    activityReports: [], // 매니저 작성 활동일보 (엑셀 Import 결과, 행사자와 matchedStaffId로 연결)
    nameAliasMap: {}, // 활동일보 "사원명" 원본 텍스트 -> 행사자 staffId 매핑 (한번 수동연결하면 이후 자동 적용)
    meta:{ lastBackup:null, schemaVersion:3, lastActivityUpload:null }
  };
};

// ★ 스키마 버전을 3으로 올렸습니다. 예전 버전(체크리스트/일보자동작성/품목통계 등 이전 구조)에서
//   저장된 localStorage 데이터는 새 구조와 맞지 않아 로딩 중 조용히 깨질 수 있으므로,
//   버전이 다르면 무조건 깨끗한 기본 구조로 다시 시작합니다 (행사자를 다시 등록해야 할 수 있습니다).
App.load = function(){
  let loaded = null;
  try{
    const raw = localStorage.getItem(App.DB_KEY);
    if(raw) loaded = JSON.parse(raw);
  }catch(e){
    console.error('저장된 데이터를 읽는 중 오류가 발생하여 초기화합니다.', e);
    loaded = null;
  }

  const isValid = loaded && typeof loaded==='object' && !Array.isArray(loaded)
    && Array.isArray(loaded.staff) && loaded.meta && loaded.meta.schemaVersion===3;

  App.db = isValid ? loaded : App.defaultDB();

  // 방어적 보정: 혹시 일부 필드만 비정상이어도 앱이 멈추지 않도록 보강
  if(!Array.isArray(App.db.staff)) App.db.staff = [];
  if(!Array.isArray(App.db.records)) App.db.records = [];
  if(!Array.isArray(App.db.activityReports)) App.db.activityReports = [];
  if(!App.db.nameAliasMap || typeof App.db.nameAliasMap!=='object' || Array.isArray(App.db.nameAliasMap)) App.db.nameAliasMap = {};
  if(!App.db.meta || typeof App.db.meta!=='object') App.db.meta = { lastBackup:null, schemaVersion:3, lastActivityUpload:null };
  if(App.db.meta.lastActivityUpload===undefined) App.db.meta.lastActivityUpload = null;
  App.db.meta.schemaVersion = 3;

  try{
    App._rebuildRecordIndex();
  }catch(e){
    console.error('실적 데이터 인덱스 생성 중 오류가 발생하여 실적 데이터를 초기화합니다.', e);
    App.db.records = [];
    App._byYM = {};
    App._allYMs = [];
  }

  // 정상화된 구조를 즉시 다시 저장해서, 다음 로딩부터는 항상 유효한 데이터만 남도록 함
  try{ App.save(); }catch(e){ console.error('초기 저장 실패', e); }
};

/* ------------------------- 2. 유틸리티 ------------------------- */
App.util = {
  todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); },
  monthKey(d){ d = d? new Date(d): new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); },
  monthLabel(mk){ const [y,m]=mk.split('-'); return `${y}년 ${parseInt(m)}월`; },
  fmtDate(s){ if(!s) return '-'; return s; },
  esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  clamp(n,a,b){ return Math.max(a,Math.min(b,n)); },
  seededRandom(seedStr){
    // 문자열 시드를 이용한 결정적 랜덤 (같은 날짜/입력이면 같은 결과)
    let h = 0;
    for(let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) >>> 0; }
    return function(){ h = (h*1103515245 + 12345) >>> 0; return (h % 1000)/1000; };
  },
  pick(arr, rnd){ return arr[Math.floor(rnd()*arr.length) % arr.length]; },
  toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(App._toastTimer);
    App._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  },
  monthsOfYear(){ return ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']; },
  currentMonthNum(){ return new Date().getMonth()+1; },
  avg(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; },

  /* ---- 엑셀 Import 전용: 날짜/숫자 파싱 유틸 ----
     실제 매장 엑셀은 셀 형식이 제각각(엑셀 날짜 시리얼 번호, "2026.7.15", "7/15", 일자만 있는 "15" 등)이라
     최대한 관대하게(lenient) 파싱하고, 그래도 실패하면 null을 반환해 호출 측에서 해당 행을 건너뛰게 합니다. */
  excelSerialToDate(serial){
    // 엑셀(1900 날짜 시스템) 시리얼 번호 -> JS Date 변환
    const utcDays = Math.floor(serial - 25569);
    const utcMs = utcDays * 86400 * 1000;
    return new Date(utcMs);
  },
  formatDateObj(d){
    if(!(d instanceof Date) || isNaN(d.getTime())) return null;
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  },
  normalizeExcelDate(value, monthHint){
    // monthHint: 값이 "일(day)"만 담고 있을 때 사용할 시트 기준 월(1~12)
    if(value===undefined || value===null || value==='') return null;
    if(value instanceof Date) return App.util.formatDateObj(value);
    if(typeof value === 'number'){
      if(value>=1 && value<=31 && monthHint){
        const y = new Date().getFullYear();
        return App.util.formatDateObj(new Date(y, monthHint-1, Math.round(value)));
      }
      return App.util.formatDateObj(App.util.excelSerialToDate(value));
    }
    const str = String(value).trim();
    if(!str) return null;
    // "15", "15일" 처럼 일자만 있는 경우
    const dayOnly = str.match(/^(\d{1,2})\s*일?$/);
    if(dayOnly && monthHint){
      const y = new Date().getFullYear();
      return App.util.formatDateObj(new Date(y, monthHint-1, parseInt(dayOnly[1],10)));
    }
    // "2026년 7월 15일", "2026.7.15", "2026/7/15", "2026-7-15" 등 구분자 정규화
    let normalized = str.replace(/년|월/g,'-').replace(/일$/,'').replace(/[.\/]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
    let d = new Date(normalized);
    if(!isNaN(d.getTime())) return App.util.formatDateObj(d);
    d = new Date(str);
    if(!isNaN(d.getTime())) return App.util.formatDateObj(d);
    return null;
  },
  parseNumberLoose(v){
    // "1,250,000", "1250000원", " 1250000 " 등을 모두 숫자로 인식
    if(v===undefined || v===null || v==='') return 0;
    if(typeof v === 'number') return v;
    const cleaned = String(v).replace(/[,원%\s]/g,'');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  },
  parsePercentLoose(v){
    // "92", "92%", "0.92" 모두 92(%)로 인식. 값이 없으면 null
    if(v===undefined || v===null || v==='') return null;
    if(typeof v === 'number') return v<=1 ? Math.round(v*100) : Math.round(v);
    const hadPercentSign = String(v).indexOf('%')>=0;
    const cleaned = String(v).replace(/[%\s]/g,'');
    const n = parseFloat(cleaned);
    if(isNaN(n)) return null;
    return (n<=1 && !hadPercentSign) ? Math.round(n*100) : Math.round(n);
  },
  // ★ 검증된 계산 로직 전용: 엑셀 "달성률" 컬럼은 항상 소수(비율)로 저장되어 있습니다.
  //   (예: 0.616688 → 61.6688%, 1.260495 → 126.0495%, 7.226703 → 722.6703%)
  //   parsePercentLoose와 달리 값의 크기와 상관없이 "항상 ×100" 합니다 (100% 초과 달성률도 정확히 인식).
  //   또한 나중에 평균을 낸 후 한 번만 반올림하도록, 여기서는 반올림하지 않고 원값을 그대로 반환합니다.
  parseAchievementRate(v){
    if(v===undefined || v===null || v==='') return null;
    if(typeof v === 'number') return v*100;
    const hadPercentSign = String(v).indexOf('%')>=0;
    const cleaned = String(v).replace(/[%\s,]/g,'');
    const n = parseFloat(cleaned);
    if(isNaN(n)) return null;
    return hadPercentSign ? n : n*100;
  }
};

/* ------------------------- 2-1. 엑셀 컬럼 자동인식(퍼지 매칭) 설정 -------------------------
   엑셀 헤더명이 매번 바뀔 수 있으므로, 열 번호가 아니라 "헤더 텍스트"를 기준으로
   아래 표준 필드(canonical field)에 매칭시킵니다. 자동 인식에 실패하면 사용자가
   직접 매핑할 수 있는 모달을 띄우고, 그 결과를 App.db.columnMapping에 기억해둡니다. */
App.canonFields = [
  {key:'staffName', label:'행사자명', aliases:['행사자명','사원명','이름','행사자','성명','담당자']},
  {key:'date',      label:'날짜',    aliases:['날짜','일자','방문일','등록일','행사일']},
  {key:'store',     label:'매장명',  aliases:['매장명','매장','점포명','점포','지점']},
  {key:'sales',     label:'매출',    aliases:['매출','총매출','판매금액','매출액','실적']},
  {key:'target',    label:'목표',    aliases:['목표','목표금액','목표매출']},
  {key:'achievementRate', label:'달성률', aliases:['달성률','달성율','달성퍼센트','달성%']}
];
App.util.normalizeHeaderStr = function(s){
  return String(s||'').replace(/[\s()\[\]%_·\-]/g,'').toLowerCase();
};
App.util.guessCanonForHeader = function(header){
  const nh = App.util.normalizeHeaderStr(header);
  if(!nh) return null;
  for(const f of App.canonFields){
    for(const alias of f.aliases){
      const na = App.util.normalizeHeaderStr(alias);
      if(nh===na || nh.includes(na) || na.includes(nh)) return f.key;
    }
  }
  return null;
};

/* ------------------------- 3. 실적 집계 & 그룹(우수/성장/개선) 자동 분류 -------------------------
   ★★★ 검증 완료된 계산 로직입니다. 실제 엑셀 데이터로 5명을 직접 대조 검증했습니다. ★★★
   이후 기능을 추가하거나 UI를 바꾸더라도 아래 계산 방식은 절대 변경하지 마세요.

   - 평균달성률: 엑셀 "달성률" 컬럼(이미 계산된 최종값)의 평균입니다.
     총판매금액 ÷ 목표로 재계산하지 않습니다 (import 단계에서도 재계산 금지).
   - 16만원 미만: 총판매금액 < 160000
   - 목표미달: 총판매금액 < 목표 (달성률이 아니라 금액을 직접 비교)
   - 그룹 분류 (누적 행사일수 10일 미만은 "제외"):
       우수: 평균달성률 125% 이상 AND 16만원 미만 비율 35% 이하
       성장: 평균달성률  95% 이상 AND 16만원 미만 비율 60% 이하
       개선: 평균달성률  95% 미만 OR  16만원 미만 비율 60% 초과

   ★ 목적: "행사자 매출 관리" - 시간이 지나며 등급이 어떻게 변해왔는지 추적하는 것입니다.
   그래서 대시보드/행사자목록/배지 등 핵심 지표는 "선택한 YEAR-MONTH까지의 누적(YTD)" 기준으로 계산합니다.
   반면 "월별 성과" 표처럼 그 달 하나만의 실적을 봐야 하는 곳은 "단일 월 집계"(App.getMonthlyAgg)를 사용합니다.
   두 집계 모두 App._aggCache / App._cumAggCache에 캐시하여 대량 레코드에서도 빠르게 동작합니다. */
App._aggCache = {};
App._cumAggCache = {};

App.invalidateAggCache = function(){
  App._aggCache = {};
  App._cumAggCache = {};
};

App._classifyGroup = function(a){
  if(a.days < 10) return '제외';
  if(a.avgRate>=125 && a.under16Pct<=35) return '우수';
  if(a.avgRate>=95 && a.under16Pct<=60) return '성장';
  return '개선';
};

// 레코드 배열로부터 행사자별 집계(byStaff)와 전체 집계(overall)를 계산하는 공용 내부 함수
App._aggregateRecords = function(records){
  const byStaff = {};
  records.forEach(r=>{
    if(!byStaff[r.staffName]){
      byStaff[r.staffName] = { days:0, totalTarget:0, totalSales:0, rateSum:0, under16Count:0, missCount:0 };
    }
    const a = byStaff[r.staffName];
    a.days++;
    a.totalTarget += Number(r.target)||0;
    a.totalSales += Number(r.totalSales)||0;
    a.rateSum += Number(r.achievementRate)||0; // 엑셀 달성률 컬럼값 그대로 사용 (재계산 금지)
    if(Number(r.totalSales) < 160000) a.under16Count++;
    if(Number(r.totalSales) < Number(r.target)) a.missCount++; // 목표미달 = 금액 직접 비교
  });

  const names = Object.keys(byStaff);
  names.forEach(name=>{
    const a = byStaff[name];
    a.avgRate = a.days ? Math.round(a.rateSum/a.days) : 0;
    a.under16Pct = a.days ? Math.round(a.under16Count/a.days*100) : 0;
    a.missPct = a.days ? Math.round(a.missCount/a.days*100) : 0;
    a.group = App._classifyGroup(a);
  });

  const graded = names.filter(n=>byStaff[n].group!=='제외');
  const overall = {
    totalStaff: names.length,
    good: names.filter(n=>byStaff[n].group==='우수').length,
    growth: names.filter(n=>byStaff[n].group==='성장').length,
    improve: names.filter(n=>byStaff[n].group==='개선').length,
    excluded: names.filter(n=>byStaff[n].group==='제외').length,
    avgRate: graded.length ? Math.round(App.util.avg(graded.map(n=>byStaff[n].avgRate))) : 0,
    totalTarget: names.reduce((s,n)=>s+byStaff[n].totalTarget,0),
    totalSales: names.reduce((s,n)=>s+byStaff[n].totalSales,0)
  };
  return { byStaff, overall };
};

// 선택한 월 "하나만"의 집계 (월별 성과 표에서 사용)
App.getMonthlyAgg = function(ym){
  if(!ym) return { byStaff:{}, overall:{ totalStaff:0, good:0, growth:0, improve:0, excluded:0, avgRate:0, totalTarget:0, totalSales:0 } };
  if(App._aggCache[ym]) return App._aggCache[ym];
  const result = App._aggregateRecords(App._byYM[ym] || []);
  App._aggCache[ym] = result;
  return result;
};

// 선택한 월까지의 "누적(YTD)" 집계 (대시보드/행사자목록/누적현황 등 핵심 지표에서 사용)
App.getCumulativeAgg = function(ym){
  if(!ym) return { byStaff:{}, overall:{ totalStaff:0, good:0, growth:0, improve:0, excluded:0, avgRate:0, totalTarget:0, totalSales:0 } };
  if(App._cumAggCache[ym]) return App._cumAggCache[ym];
  const records = App.db.records.filter(r=>r.ym<=ym); // 시작 시점부터 선택한 월까지 전부 합산
  const result = App._aggregateRecords(records);
  App._cumAggCache[ym] = result;
  return result;
};

// 이전 이름 호환용: 기존 코드에서 참조하던 이름을 "단일 월" 집계로 유지
App.getAggForYM = App.getMonthlyAgg;

// 특정 행사자 이름의 특정 월 "단일 월" 집계 (없으면 기본값)
App.getStaffAgg = function(staffName, ym){
  const agg = App.getMonthlyAgg(ym);
  return agg.byStaff[staffName] || { days:0, totalTarget:0, totalSales:0, avgRate:0, under16Count:0, under16Pct:0, missCount:0, missPct:0, group:'제외' };
};

// 특정 행사자 이름의 특정 월까지 "누적" 집계 (없으면 기본값)
App.getStaffCumulativeAgg = function(staffName, ym){
  const agg = App.getCumulativeAgg(ym);
  return agg.byStaff[staffName] || { days:0, totalTarget:0, totalSales:0, avgRate:0, under16Count:0, under16Pct:0, missCount:0, missPct:0, group:'제외' };
};

App.groupMeta = function(g){
  if(g==='우수') return {cls:'good', label:'우수그룹'};
  if(g==='성장') return {cls:'growth', label:'성장그룹'};
  if(g==='개선') return {cls:'improve', label:'개선그룹'};
  return {cls:'neutral', label:'집계제외(10일 미만)'};
};

const UI = {};

UI.init = function(){
  try{
    App.load();
    App.loadState();

    console.error('앱 초기화 중 오류가 발생했습니다:', e);
    const view = document.getElementById('view');
    if(view){
      view.innerHTML = `<div class="card" style="border:1px solid var(--improve);">

        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">${App.util.esc(e.message||String(e))}</div>
        <button class="btn danger" onclick="localStorage.clear(); location.reload();">저장된 데이터 초기화 후 새로고침</button>
      </div>`;
    }
  }
};

// 상단 고정 YEAR-MONTH 선택 드롭다운을 그림 (records에 존재하는 월만 선택지로 노출)
UI.renderYmSelector = function(){
  const el = document.getElementById('ymSelector');
  if(!el) return;
  if(App._allYMs.length===0){
    el.innerHTML = `<span style="font-size:12.5px;color:var(--text-secondary);">업로드된 실적 데이터 없음</span>`;
    return;
  }
  if(!App.state.selectedYM || !App._allYMs.includes(App.state.selectedYM)){
    App.state.selectedYM = App._allYMs[App._allYMs.length-1]; // 최신월 기본 선택
    App.saveState();
  }
  const options = [...App._allYMs].reverse().map(ym=>
    `<option value="${ym}" ${ym===App.state.selectedYM?'selected':''}>${ym}</option>`
  ).join('');
  el.innerHTML = `<select id="ymSelectInput" style="font-weight:700;">${options}</select>`;
  document.getElementById('ymSelectInput').onchange = function(){
    App.state.selectedYM = this.value;
    App.saveState();
    UI.render();
  };
};

UI.toggleTheme = function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(App.THEME_KEY, next);
  UI.syncThemeSwitch();
};
UI.syncThemeSwitch = function(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeSwitch').classList.toggle('on', isDark);
  document.getElementById('themeLabel').textContent = isDark? '라이트 모드':'다크 모드';

UI.setTitle = function(title, sub){

};

UI.setTopActions = function(html){

UI.render = function(){
  const r = App.route;
  UI.setActiveNav(r.name==='staffDetail' ? 'staff' : r.name);
  UI.setTopActions('');
  UI.renderYmSelector();
  if(r.name==='dashboard') Views.dashboard();
  else if(r.name==='staff' && !r.staffId) Views.staffList();
  else if((r.name==='staff'||r.name==='staffDetail') && r.staffId) Views.staffDetail(r.staffId, r.tab);

/* ------------------------- 7. 간단 차트 렌더러 (외부 라이브러리 없이 div로 구현) ------------------------- */
App.chart = {};
App.chart.bar = function(labels, values, opts){
  opts = opts||{};
  const max = Math.max(1, ...values, opts.max||0);
  let html = '<div class="bar-chart">';
  labels.forEach((lbl,i)=>{
    const v = values[i]||0;
    const h = Math.max(3, Math.round((v/max)*120));
    html += `<div class="bar-col">
        <div class="bar" style="height:${h}px;background:${opts.color||'var(--accent)'}"><span class="val">${v}${opts.suffix||''}</span></div>
        <div class="lbl">${App.util.esc(lbl)}</div>
      </div>`;
  });
  html += '</div>';
  return html;
};

Views.staffDetail = function(staffId, tab){
  const s = App.db.staff.find(x=>x.id===staffId);
  if(!s){ Views.staffList(); return; }
  s.goals = s.goals||[]; s.customers = s.customers||[]; s.memos = s.memos||[];
  s.visitLogs = s.visitLogs||[]; // 관리자 활동이력 (방문일/매장명/체크리스트/메모)

  const ym = App.state.selectedYM;
  const agg = App.getStaffCumulativeAgg(s.name, ym);
  const gm = App.groupMeta(agg.group);
  UI.setTitle(s.name, `${s.store||'-'} · ${s.type||'-'} · 입사일 ${s.hireDate||'-'}`);
  UI.setTopActions(`<span class="badge ${gm.cls}" style="margin-right:8px;">${ym?`~${ym} 누적 `:''}${gm.label}</span>

  const tabs = [
    ['cumulative','누적 현황'], ['monthly','월별 성과'], ['activityreport','📋 활동일보'], ['visitlog','활동 이력'], ['activitystats','활동 통계'],
    ['goal','개인 목표'], ['customer','충성고객'], ['memo','관리자 메모'],
    ['report','성장 리포트'], ['ai','AI 코칭']
  ];
  let html = `<div class="tabs">`;
  tabs.forEach(([key,label])=>{
    html += `<div class="tab-btn ${tab===key?'active':''}" onclick="App.navigate('staffDetail','${s.id}','${key}')">${label}</div>`;
  });
  html += `</div><div id="tabBody"></div>`;
  document.getElementById('view').innerHTML = html;

  const body = document.getElementById('tabBody');
  if(tab==='goal') body.innerHTML = Views._tabGoal(s);
  else if(tab==='cumulative') body.innerHTML = Views._tabCumulative(s);
  else if(tab==='monthly') body.innerHTML = Views._tabMonthly(s);
  else if(tab==='activityreport') body.innerHTML = Views._tabActivityReport(s);
  else if(tab==='visitlog') body.innerHTML = Views._tabVisitLog(s);
  else if(tab==='activitystats') body.innerHTML = Views._tabActivityStats(s);
  else if(tab==='customer') body.innerHTML = Views._tabCustomer(s);
  else if(tab==='memo') body.innerHTML = Views._tabMemo(s);
  else if(tab==='report') body.innerHTML = Views._tabReport(s);
  else if(tab==='ai') body.innerHTML = Views._tabAI(s);
  else body.innerHTML = Views._tabCumulative(s);
};

    </div>

    html += `<div class="empty-state"><div class="emoji">🎯</div>등록된 목표가 없습니다.</div>`;

    </tr></thead><tbody>`;

Actions.confirm = function(message, onYes){
  UI.openModal(`

Actions.copyText = function(elId){
  const text = document.getElementById(elId).textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>App.util.toast('복사되었습니다')).catch(()=>App.util.toast('복사에 실패했습니다'));
  }else{
    const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    App.util.toast('복사되었습니다');
  }
};

Actions.saveStaff = function(staffId){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ App.util.toast('행사자명을 입력해주세요'); return; }
  const store = document.getElementById('f_store').value.trim();
  const hireDate = document.getElementById('f_hire').value;
  const type = document.getElementById('f_type').value;
  if(staffId){
    const s = App.db.staff.find(x=>x.id===staffId);
    Object.assign(s, {name, store, hireDate, type});
  }else{
    App.db.staff.push({
      id: App.uid('staff'), name, store, hireDate, type,
      createdAt: App.util.todayStr(),
      goals:[], customers:[], memos:[], visitLogs:[]
    });
  }
  App.save(); UI.closeModal(); App.util.toast('저장되었습니다'); UI.render();
};

Actions.deleteStaff = function(staffId){
  const s = App.db.staff.find(x=>x.id===staffId);
  Actions.confirm(`'${s?s.name:''}' 행사자를 삭제하시겠습니까? 관련된 모든 기록이 함께 삭제됩니다.`, ()=>{
    App.db.staff = App.db.staff.filter(x=>x.id!==staffId);
    App.save(); App.util.toast('삭제되었습니다'); App.navigate('staff');
  });
};

Actions.saveCustomer = function(staffId){
  const name = document.getElementById('f_cname').value.trim();
  if(!name){ App.util.toast('고객명을 입력해주세요'); return; }
  const s = App.db.staff.find(x=>x.id===staffId);
  s.customers.push({
    id:App.uid('cust'), name,
    interest:document.getElementById('f_cinterest').value.trim(),
    store:document.getElementById('f_cstore').value.trim(),
    acquiredDate:document.getElementById('f_cacq').value,
    nextVisit:document.getElementById('f_cnext').value,
    memo:document.getElementById('f_cmemo').value.trim(),
    revisited:false
  });
  App.save(); UI.closeModal(); App.navigate('staffDetail', staffId, 'customer');
};
Actions.toggleRevisit = function(staffId, custId){
  const s = App.db.staff.find(x=>x.id===staffId);
  const c = s.customers.find(x=>x.id===custId); c.revisited = !c.revisited;
  App.save(); UI.render();
};
Actions.deleteCustomer = function(staffId, custId){
  const s = App.db.staff.find(x=>x.id===staffId);
  s.customers = s.customers.filter(x=>x.id!==custId); App.save(); UI.render();
};

/* ===== 성장 리포트 자동 생성 ===== */
Actions.buildGrowthReport = function(staffId){
  const s = App.db.staff.find(x=>x.id===staffId);
  if(!s) return '';
  const months = App._allYMs.filter(ym=>App.getStaffAgg(s.name, ym).days>0);
  const firstRate = months.length? App.getStaffAgg(s.name, months[0]).avgRate : null;
  const lastRate = months.length? App.getStaffAgg(s.name, months[months.length-1]).avgRate : null;
  const g = months.length? App.getStaffCumulativeAgg(s.name, months[months.length-1]).group : '제외';
  const goals = s.goals||[]; const goalDone = goals.filter(x=>x.done).length;
  const custCount = (s.customers||[]).length;
  const logs = s.visitLogs||[];
  const eduCount = logs.filter(l=>l.checklist && (l.checklist.serviceEdu || l.checklist.tastingEdu || l.checklist.etcEdu)).length;
  const visitCount = logs.length;

  let lines = [];
  lines.push(`■ ${s.name} 성장 리포트 (${App.util.todayStr()} 기준)`);
  lines.push('');
  lines.push(`- 담당매장: ${s.store||'-'} / 담당구분: ${s.type||'-'} / 입사일: ${s.hireDate||'-'}`);
  lines.push(`- 최근월 그룹: ${g}그룹`);
  lines.push('');
  lines.push('[교육내용]');
  lines.push(eduCount? `누적 방문 중 ${eduCount}건에서 교육 관련 활동(고객응대/시식/기타 교육)이 진행되었습니다.` : '최근 별도로 기록된 교육 활동이 없습니다.');
  lines.push('');
  lines.push('[성과변화 / 달성률 변화]');
  if(firstRate!==null && lastRate!==null){
    const diff = lastRate-firstRate;
    lines.push(`평균달성률이 ${firstRate}%에서 ${lastRate}%로 ${diff>=0? diff+'%p 상승':Math.abs(diff)+'%p 하락'}하였습니다.`);
  }else{
    lines.push('아직 업로드된 실적 데이터가 충분하지 않습니다.');
  }
  lines.push('');
  lines.push('[그룹 변화]');
  lines.push(`최근 실적을 기준으로 현재 ${g}그룹으로 분류되어 있습니다.`);
  lines.push('');
  lines.push('[목표 달성률]');
  lines.push(goals.length? `전체 목표 ${goals.length}건 중 ${goalDone}건을 달성하여 달성률 ${Math.round(goalDone/goals.length*100)}%를 기록하였습니다.` : '등록된 목표가 없습니다.');
  lines.push('');
  lines.push('[충성고객 확보]');
  lines.push(custCount? `누적 ${custCount}명의 충성고객을 확보하였습니다.` : '아직 확보된 충성고객이 없습니다.');
  lines.push('');
  lines.push('[활동이력]');
  lines.push(visitCount? `누적 ${visitCount}건의 방문/활동이 기록되었습니다.` : '기록된 방문/활동이력이 없습니다.');
  return lines.join('\n');
};

/* ===== AI 코칭 자동 분석 (규칙 기반) =====
   실제 LLM API 호출 없이, 누적된 데이터(목표/실적/고객/활동)를 규칙으로 해석하여
   강점/부족점/추천목표/교육추천/관리포인트를 자동 생성합니다. */
Actions.buildAICoaching = function(staffId){
  const s = App.db.staff.find(x=>x.id===staffId);
  const goals = s.goals||[]; const custs = s.customers||[];
  const months = App._allYMs.filter(ym=>App.getStaffAgg(s.name, ym).days>0);
  const lastRate = months.length? App.getStaffAgg(s.name, months[months.length-1]).avgRate : 0;
  const prevRate = months.length>1? App.getStaffAgg(s.name, months[months.length-2]).avgRate : lastRate;
  const goalRate = goals.length? goals.filter(g=>g.done).length/goals.length*100 : 0;
  const commentGoal = goals.find(g=>g.title.includes('댓글'));
  const noteGoal = goals.find(g=>g.title.includes('노트'));
  const g = months.length? App.getStaffCumulativeAgg(s.name, months[months.length-1]).group : '제외';

  let strengthParts = [];
  if(custs.length>=2) strengthParts.push('충성고객 확보 활동이 우수합니다');
  if(lastRate>=prevRate && months.length>1) strengthParts.push('최근 평균달성률이 지속적으로 상승하고 있습니다');
  if(goalRate>=70) strengthParts.push('등록된 목표의 이행률이 높은 편입니다');
  if(strengthParts.length===0) strengthParts.push('현재까지의 데이터로는 두드러진 강점을 특정하기 어려우니, 활동기록을 조금 더 축적해보시길 권장합니다');

  let weaknessParts = [];
  if(commentGoal && !commentGoal.done) weaknessParts.push('목표댓글 작성률이 낮은 편입니다');
  if(noteGoal && !noteGoal.done) weaknessParts.push('행사노트 작성이 다소 미흡합니다');
  if(custs.length===0) weaknessParts.push('충성고객 확보 실적이 아직 없습니다');
  if(lastRate<prevRate && months.length>1) weaknessParts.push('최근 평균달성률이 하락 추세를 보이고 있습니다');
  if(weaknessParts.length===0) weaknessParts.push('특별히 우려되는 부분은 확인되지 않습니다');

  let nextGoal = g==='개선' ? '기본기 강화를 위한 행사노트 작성률 향상을 다음달 목표로 추천합니다.'
    : g==='성장' ? '목표댓글 작성 및 충성고객 추가 확보를 다음달 목표로 추천합니다.'
    : '현재의 우수한 흐름을 유지하며 신규 상품 연관진열 확대를 목표로 추천합니다.';

  let education = g==='개선' ? '고객응대 기본 교육 및 할인계산기 활용 교육을 우선 추천합니다.'
    : g==='성장' ? '레시피 활용 및 연관진열 심화 교육을 추천합니다.'
    : '신규 행사자 멘토링 역할을 부여할 수 있는 교육을 추천합니다.';

  let managePoint = g==='개선' ? '주 단위로 방문하여 현장 밀착 관리와 독려가 필요합니다.'
    : g==='성장' ? '월 2회 정기 방문으로 성장 추세를 지속 관리해 주세요.'
    : '우수 사례를 타 매장에 공유할 수 있도록 관리해 주세요.';

  return {
    strength: strengthParts.join('. ') + '.',
    weakness: weaknessParts.join('. ') + '.',
    nextGoal, education, managePoint
  };
};

/* ===== 자료 관리: CSV 내보내기/불러오기 ===== */
App.csv = {
  escapeCell(v){
    v = (v===undefined||v===null)? '' : String(v);
    if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  },
  toCSV(rows){
    return rows.map(r=>r.map(App.csv.escapeCell).join(',')).join('\r\n');
  },
  parseCSV(text){
    const rows=[]; let row=[]; let cell=''; let inQuotes=false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(inQuotes){
        if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQuotes=false; }
        else cell+=c;
      }else{
        if(c==='"') inQuotes=true;
        else if(c===','){ row.push(cell); cell=''; }
        else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
        else if(c==='\r'){ /* skip */ }
        else cell+=c;
      }
    }
    if(cell.length || row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=> r.length>1 || (r[0]&&r[0].trim()!==''));
  },
  download(filename, content){
    const blob = new Blob(['\ufeff'+content], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
};

// 행사자 목록 불러오기: 파일 확장자에 따라 분기합니다.
//  - .xlsx / .xls  => 반드시 ArrayBuffer로 읽어 SheetJS(XLSX.read)로 파싱합니다.
//                     엑셀 파일은 zip으로 압축된 바이너리 파일이므로 readAsText로 읽으면
//                     PK/workbook.xml 등 압축 데이터가 그대로 텍스트로 깨져 나옵니다. 절대 readAsText 사용 금지.
//  - .csv          => 기존 방식대로 텍스트로 읽어 자체 CSV 파서로 처리합니다.
Actions.importStaffCSV = function(file){
  if(!file) return;
  const fname = file.name.toLowerCase();
  const isExcel = fname.endsWith('.xlsx') || fname.endsWith('.xls');

  if(isExcel){
    if(typeof XLSX === 'undefined'){
      App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        // 헤더(이름/담당매장/담당구분/입사일)를 키로 하는 JSON 배열로 변환
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        const rows = json.map(row=>[
          row['이름'] ?? row['name'] ?? '',
          row['담당매장'] ?? row['store'] ?? '',
          row['담당구분'] ?? row['type'] ?? '',
          row['입사일'] ?? row['hireDate'] ?? ''
        ]);
        Actions._mergeStaffRows(rows);
      }catch(err){ console.error(err); App.util.toast('엑셀 파일을 읽는 중 오류가 발생했습니다'); }
    };
    reader.readAsArrayBuffer(file);
  }else{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const rows = App.csv.parseCSV(e.target.result);
        rows.shift(); // 헤더 제거
        Actions._mergeStaffRows(rows);
      }catch(err){ console.error(err); App.util.toast('CSV 파일을 읽는 중 오류가 발생했습니다'); }
    };
    reader.readAsText(file, 'UTF-8');
  }
};

// 엑셀/CSV 공통: [이름, 담당매장, 담당구분, 입사일] 형태의 행 배열을 받아 행사자 데이터에 병합
Actions._mergeStaffRows = function(rows){
  let added=0, updated=0;
  rows.forEach(r=>{
    const name = r[0], store = r[1], type = r[2], hireDate = r[3];
    if(!name || !String(name).trim()) return;
    const nameTrim = String(name).trim();
    let s = App.db.staff.find(x=>x.name===nameTrim);
    if(s){ s.store=store||s.store; s.type=type||s.type; s.hireDate=hireDate||s.hireDate; updated++; }
    else{
      App.db.staff.push({id:App.uid('staff'), name:nameTrim, store:store||'', type:type||'정규', hireDate:hireDate||'',
        createdAt:App.util.todayStr(), goals:[], customers:[], memos:[], visitLogs:[]});
      added++;
    }
  });
  App.save();
  App.util.toast(`불러오기 완료: 추가 ${added}건, 갱신 ${updated}건`);
  UI.render();
};

/* =========================================================================
   9-A. 실적 엑셀 Import (샘표 전남지역 유인행사 - 고정 컬럼 스펙)
   -------------------------------------------------------------------------
   사용 컬럼(고정, 앞으로 바뀌지 않음):
     행사자이름, 목표, 총판매금액, 달성률, YEAR, MONTH, 품목군1, 품목군2, 품목군3,
     판매수량1, 판매수량2, 판매수량3  (그 외 컬럼은 사용하지 않음)
   - .xlsx 전용. 반드시 ArrayBuffer + SheetJS(XLSX.read)로 파싱합니다. (readAsText 절대 금지)
   - 표 위에 제목행/병합셀이 있어도 헤더 행을 자동으로 탐지합니다.
   - YEAR+MONTH가 같은 기존 데이터가 있으면 이번 업로드 내용으로 그 달 전체를 교체(업데이트)하고,
     다른 달의 기존 데이터는 그대로 유지합니다. (매달 순차 업로드 -> 누적되는 "월 단위 교체" 전략)
   - 문제 있는 행은 건너뛰고 오류 목록으로 모아 완료 후 안내합니다.
   ========================================================================= */

App.recordColumns = [
  {key:'staffName',        headers:['행사자이름','행사자명','이름']},
  {key:'target',           headers:['목표']},
  {key:'totalSales',       headers:['총판매금액','판매금액']},
  {key:'achievementRate',  headers:['달성률']},
  {key:'year',             headers:['YEAR','year','Year']},
  {key:'month',            headers:['MONTH','month','Month']}
];

// 헤더 텍스트 -> 표준 필드 매핑. 정해진 컬럼명과 정확히(공백/대소문자 무시) 일치하는 열만 사용하고,
// 그 외 컬럼은 조용히 무시합니다 (엑셀 양식은 앞으로 바뀌지 않는다는 전제).
App._buildRecordColumnMap = function(headerRow){
  const map = {}; // 열 인덱스 -> 표준 필드 key
  headerRow.forEach((h,idx)=>{
    const nh = App.util.normalizeHeaderStr(h);
    if(!nh) return;
    for(const col of App.recordColumns){
      if(col.headers.some(alias=>App.util.normalizeHeaderStr(alias)===nh)){
        map[idx] = col.key;
        break;
      }
    }
  });
  return map;
};

// 시트 앞부분 최대 10행을 훑어 고정 컬럼명과 가장 많이 일치하는 행을 헤더 행으로 판단합니다.
// (실제 회사 엑셀은 표 위에 제목행/병합셀이 있는 경우가 많아 무조건 1행을 헤더로 볼 수 없음)
Actions._detectRecordHeaderRow = function(rawRows){
  const scanLimit = Math.min(10, rawRows.length);
  let bestIdx = -1, bestScore = 0;
  for(let i=0;i<scanLimit;i++){
    const row = (rawRows[i]||[]).map(c=>String(c||''));
    const score = Object.keys(App._buildRecordColumnMap(row)).length;
    if(score > bestScore){ bestScore = score; bestIdx = i; }
  }
  // 최소 2개 컬럼(예: 행사자이름+YEAR) 이상 일치해야 신뢰할 수 있는 헤더 행으로 인정
  return bestScore>=2 ? bestIdx : -1;
};

Actions.importRecordsExcel = function(file){
  if(!file) return;
  const fname = file.name.toLowerCase();
  if(!(fname.endsWith('.xlsx') || fname.endsWith('.xls'))){
    App.util.toast('엑셀(.xlsx) 파일만 업로드할 수 있습니다');
    return;
  }
  if(typeof XLSX === 'undefined'){
    App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }

  const reader = new FileReader();
  // ⚠ 엑셀은 zip으로 압축된 바이너리 파일입니다. readAsText로 읽으면 PK/workbook.xml 등
  //    압축 데이터가 그대로 깨져 나옵니다. 반드시 ArrayBuffer로 읽어 SheetJS(XLSX.read)로 파싱합니다.
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type:'array', cellDates:true });

      // 시트명에 제한을 두지 않고, 헤더를 자동 탐지할 수 있는 모든 시트에서 데이터를 수집합니다.
      let allRows = [];
      const errors = [];
      const sheetReport = [];

      workbook.SheetNames.forEach(sheetName=>{
        const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header:1, defval:'', raw:true });
        const headerIdx = Actions._detectRecordHeaderRow(rawRows);
        if(headerIdx===-1) return; // 알아볼 수 있는 헤더가 없는 시트는 조용히 건너뜀

        const headerRow = rawRows[headerIdx].map(h=>String(h||''));
        const colMap = App._buildRecordColumnMap(headerRow);
        let sheetCount = 0;

        rawRows.slice(headerIdx+1).forEach((rowArr, rIdx)=>{
          if(!rowArr || rowArr.every(c=>String(c).trim()==='')) return; // 완전히 빈 행은 조용히 건너뜀

          const raw = {};
          Object.keys(colMap).forEach(idx=>{ raw[colMap[idx]] = rowArr[idx]; });

          const staffName = String(raw.staffName||'').trim();
          if(!staffName) return; // 행사자이름 없는 행은 조용히 건너뜀

          const year = parseInt(raw.year, 10);
          const month = parseInt(raw.month, 10);
          if(!year || !month || month<1 || month>12){
            errors.push(`[${sheetName}] ${headerIdx+rIdx+2}행: YEAR/MONTH를 인식할 수 없어 건너뜀 (행사자: ${staffName})`);
            return;
          }

          const target = App.util.parseNumberLoose(raw.target);
          const totalSales = App.util.parseNumberLoose(raw.totalSales);
          // ★ 검증된 계산 로직: 달성률은 엑셀 "달성률" 컬럼값을 그대로 사용합니다.
          //   총판매금액÷목표로 재계산하지 않습니다. 값이 없거나 인식 불가하면 이 행은 건너뜁니다.
          const rate = App.util.parseAchievementRate(raw.achievementRate);
          if(rate===null || rate===undefined){
            errors.push(`[${sheetName}] ${headerIdx+rIdx+2}행: 달성률 값을 인식할 수 없어 건너뜀 (행사자: ${staffName})`);
            return;
          }

          allRows.push({
            id: App.uid('rec'),
            staffName, year, month, ym: `${year}-${String(month).padStart(2,'0')}`,
            target, totalSales, achievementRate: rate
          });
          sheetCount++;
        });

        if(sheetCount>0) sheetReport.push({ sheetName, count:sheetCount });
      });

      if(allRows.length===0){
        App.util.toast('엑셀에서 유효한 데이터를 찾지 못했습니다. 컬럼명(행사자이름/목표/총판매금액/달성률/YEAR/MONTH 등)을 확인해주세요.');
        return;
      }

      Actions._mergeRecordsByMonth(allRows, sheetReport, errors);
    }catch(err){
      console.error(err);
      App.util.toast('엑셀 파일을 처리하는 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
};

// YEAR+MONTH가 같은 기존 데이터가 있으면 이번 업로드 내용으로 그 달 전체를 교체(업데이트)하고,
// 다른 달의 기존 데이터는 그대로 유지합니다 (매달 새 엑셀을 올리는 실제 업무 흐름에 맞춘 전략).
Actions._mergeRecordsByMonth = function(newRows, sheetReport, errors){
  const ymGroups = {};
  newRows.forEach(r=>{ if(!ymGroups[r.ym]) ymGroups[r.ym]=[]; ymGroups[r.ym].push(r); });

  const summary = [];
  let updatedMonths = 0, newMonths = 0;

  Object.keys(ymGroups).sort().forEach(ym=>{
    const isExisting = App.db.records.some(r=>r.ym===ym);
    App.db.records = App.db.records.filter(r=>r.ym!==ym); // 해당 월의 기존 데이터 제거
    App.db.records.push(...ymGroups[ym]);                  // 새 데이터로 교체
    summary.push({ ym, count: ymGroups[ym].length, isUpdate: isExisting });
    if(isExisting) updatedMonths++; else newMonths++;
  });

  // 새로 등장한 행사자이름은 최소 정보로 자동 등록해, 목표/메모/체크리스트 등에서 바로 이어서 쓸 수 있게 함
  const existingNames = new Set(App.db.staff.map(s=>s.name));
  const newNames = new Set();
  newRows.forEach(r=>{ if(!existingNames.has(r.staffName)) newNames.add(r.staffName); });
  newNames.forEach(name=>{
    App.db.staff.push({
      id: App.uid('staff'), name, store:'', type:'정규', hireDate:'', createdAt: App.util.todayStr(),
      goals:[], customers:[], memos:[], visitLogs:[]
    });
  });

  App._rebuildRecordIndex();
  App.invalidateAggCache();
  App.save();

  Actions._showImportSummary(summary, sheetReport, updatedMonths, newMonths, errors);
  UI.render();
};

Actions._showImportSummary = function(summary, sheetReport, updatedMonths, newMonths, errors){
  const lines = summary.map(s=>`${s.ym} : ${s.count}건 ${s.isUpdate?'업데이트':'신규'} Import 완료`).join('\n');
  const total = summary.reduce((a,s)=>a+s.count,0);
  const msg = `${lines}\n\n총 ${total}건 Import 완료\n신규 월: ${newMonths}개월\n업데이트 월: ${updatedMonths}개월`;

  const sheetLines = sheetReport.map(s=>`${s.sheetName} 시트: ${s.count}행 인식`).join('\n');
  const sheetHtml = sheetLines ? `<div style="margin-top:14px;">
      <div style="font-weight:800;margin-bottom:6px;">시트별 인식 결과</div>
      <div class="report-box" style="font-size:12.5px;white-space:pre-wrap;">${App.util.esc(sheetLines)}</div>
    </div>` : '';

  let errHtml = '';
  if(errors.length){
    const shown = errors.slice(0,30);
    errHtml = `<div style="margin-top:14px;">
      <div style="font-weight:800;color:var(--improve);margin-bottom:6px;">건너뛴 행 / 오류 (${errors.length}건)</div>
      <div class="report-box" style="max-height:180px;overflow-y:auto;font-size:12.5px;">
        ${shown.map(e=>App.util.esc(e)).join('<br>')}${errors.length>30? `<br>...외 ${errors.length-30}건` : ''}
      </div>
    </div>`;
  }

  UI.openModal(`
    <h2>엑셀 Import 완료</h2>
    <div class="report-box" style="white-space:pre-wrap;">${App.util.esc(msg)}</div>
    ${sheetHtml}
    ${errHtml}
    <div class="modal-actions"><button class="btn primary" onclick="UI.closeModal()">확인</button></div>`);
};

// 누적된 실적 데이터를 업로드 양식과 동일한 컬럼 구조로 다시 .xlsx로 내보내기
Actions.exportRecordsExcel = function(){
  if(typeof XLSX === 'undefined'){
    App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  if(App.db.records.length===0){
    App.util.toast('내보낼 실적 데이터가 없습니다');
    return;
  }
  const sheetData = App.db.records
    .slice()
    .sort((a,b)=> a.ym.localeCompare(b.ym) || a.staffName.localeCompare(b.staffName))
    .map(r=>({
      '행사자이름': r.staffName, '목표': r.target, '총판매금액': r.totalSales, '달성률': r.achievementRate,
      'YEAR': r.year, 'MONTH': r.month
    }));

  const ws = XLSX.utils.json_to_sheet(sheetData);

  XLSX.writeFile(wb, `실적데이터_${App.util.todayStr()}.xlsx`);
  App.util.toast('엑셀 파일이 다운로드되었습니다');
};


/* =========================================================================
   11. 활동일보 업로드 & 행사자별 자동 연동 (신규 기능)
   -------------------------------------------------------------------------
   - 매니저가 작성한 활동일보 엑셀(.xlsx/.xls)을 업로드하면, 컬럼명 기준으로 인식하여
     "사원명"과 행사자 관리에 등록된 행사자명을 자동 매칭하고, 방문일/거래처/매니저명
     조합으로 중복을 판단해 누적 저장합니다.
   - 기존 실적(records)/행사자(staff) 데이터와는 완전히 분리된 App.db.activityReports에
     저장되며, matchedStaffId로만 연결됩니다 (이름이 나중에 바뀌어도 이력 유지).
   - 이름이 정확히 일치하지 않으면 절대 임의로 매칭하지 않고 "매칭 필요"로 분류하며,
     한 번 수동으로 연결하면 App.db.nameAliasMap에 저장되어 다음 업로드부터 자동 적용됩니다.
   ========================================================================= */

// 활동일보 엑셀 고정 컬럼 (컬럼 순서 무관, 헤더 텍스트 기준으로 인식. 일부 컬럼이 없어도 동작)
App.reportColumns = [
  {key:'dept',              headers:['거래처DEPT','거래처 DEPT','DEPT','부서']},
  {key:'managerName',       headers:['매니저명','매니저']},
  {key:'visitDate',         headers:['방문일','방문일자','일자','날짜']},
  {key:'directStore',       headers:['직거래처','거래처명','거래처']},
  {key:'secondaryStore',    headers:['2차거래처명','2차거래처','2차점명','2차점']},
  {key:'staffName',         headers:['사원명','행사자명','이름']},
  {key:'managementSignal',  headers:['관리신호','신호']},
  {key:'storeInventory',    headers:['매장재고','재고']},
  {key:'tastingEvent',      headers:['시식행사','시식']},
  {key:'managerAction',     headers:['매니저조치사항','조치사항']},
  {key:'salesRequest',      headers:['영업요청사항','영업요청']},
  {key:'safetyPrevention',  headers:['안전예방']},
  {key:'storeEnvironment',  headers:['매장환경']}
];

App._buildReportColumnMap = function(headerRow){
  const map = {};
  headerRow.forEach((h,idx)=>{
    const nh = App.util.normalizeHeaderStr(h);
    if(!nh) return;
    for(const col of App.reportColumns){
      if(col.headers.some(alias=>App.util.normalizeHeaderStr(alias)===nh)){
        map[idx] = col.key;
        break;
      }
    }
  });
  return map;
};

// 표 위에 제목행이 있어도 "사원명/방문일/관리신호" 등과 가장 많이 일치하는 행을 헤더로 판단
Actions._detectReportHeaderRow = function(rawRows){
  const scanLimit = Math.min(10, rawRows.length);
  let bestIdx = -1, bestScore = 0;
  for(let i=0;i<scanLimit;i++){
    const row = (rawRows[i]||[]).map(c=>String(c||''));
    const score = Object.keys(App._buildReportColumnMap(row)).length;
    if(score > bestScore){ bestScore = score; bestIdx = i; }
  }
  return bestScore>=3 ? bestIdx : -1; // 최소 3개 컬럼 이상 일치해야 신뢰
};

// 중복 판단 키: 방문일 + 사원명 + 직거래처 + 2차거래처명 + 매니저명
App._reportKey = function(r){
  return [r.visitDate||'', r.staffName||'', r.directStore||'', r.secondaryStore||'', r.managerName||''].join('|');
};

// 활동일보의 "사원명"으로 행사자를 찾는다: 정확히 일치 -> 저장된 별칭매핑 -> 없으면 null(매칭 필요)
App.findStaffIdForReportName = function(rawName){
  const name = String(rawName||'').trim();
  if(!name) return null;
  const exact = App.db.staff.find(x=>x.name===name);
  if(exact) return exact.id;
  if(App.db.nameAliasMap[name]){
    const aliased = App.db.staff.find(x=>x.id===App.db.nameAliasMap[name]);
    if(aliased) return aliased.id;
  }
  return null;
};

// 업로드 후 "반영하기" 전까지 미리보기 상태로 들고 있는 임시 데이터 (아직 App.db에 저장되지 않음)
Views._reportStaging = null; // { fileName, rows:[...], errors:[...] }
Views._reportListState = { tab:'list', q:'', store:'', manager:'', ym:'', signal:'' };
Views._reportExpandedId = null;

Actions.importActivityReportExcel = function(file){
  if(!file) return;
  const fname = file.name.toLowerCase();
  if(!(fname.endsWith('.xlsx') || fname.endsWith('.xls'))){
    App.util.toast('활동일보는 엑셀(.xlsx, .xls) 파일만 업로드할 수 있습니다');
    return;
  }
  if(typeof XLSX === 'undefined'){
    App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  const reader = new FileReader();
  // ⚠ 엑셀은 바이너리(zip) 파일이므로 반드시 ArrayBuffer로 읽어 SheetJS로 파싱합니다.
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type:'array', cellDates:true });

      const rows = [];
      const errors = [];

      workbook.SheetNames.forEach(sheetName=>{
        const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header:1, defval:'', raw:true });
        const headerIdx = Actions._detectReportHeaderRow(rawRows);
        if(headerIdx===-1) return; // 이 시트에는 활동일보 컬럼이 없음 -> 건너뜀

        const headerRow = rawRows[headerIdx].map(h=>String(h||''));
        const colMap = App._buildReportColumnMap(headerRow);

        rawRows.slice(headerIdx+1).forEach((rowArr, rIdx)=>{
          if(!rowArr || rowArr.every(c=>String(c).trim()==='')) return; // 완전히 빈 행은 조용히 건너뜀

          const raw = {};
          Object.keys(colMap).forEach(idx=>{ raw[colMap[idx]] = rowArr[idx]; });

          const staffName = String(raw.staffName||'').trim();
          if(!staffName){
            errors.push(`[${sheetName}] ${headerIdx+rIdx+2}행: 사원명이 비어있어 건너뜀`);
            return;
          }

          let visitDate = App.util.normalizeExcelDate(raw.visitDate, null);
          if(!visitDate){
            errors.push(`[${sheetName}] ${headerIdx+rIdx+2}행: 방문일을 인식하지 못했습니다 (사원명: ${staffName}). 날짜 없이 기록됩니다.`);
            visitDate = '';
          }

          const matchedStaffId = App.findStaffIdForReportName(staffName);

          rows.push({
            _tempId: App.uid('tmp'),
            dept: String(raw.dept||'').trim(),
            managerName: String(raw.managerName||'').trim(),
            visitDate,
            directStore: String(raw.directStore||'').trim(),
            secondaryStore: String(raw.secondaryStore||'').trim(),
            staffName,
            matchedStaffId,
            isMatched: !!matchedStaffId,
            managementSignal: String(raw.managementSignal===undefined?'':raw.managementSignal).trim(),
            storeInventory: String(raw.storeInventory===undefined?'':raw.storeInventory).trim(),
            tastingEvent: String(raw.tastingEvent===undefined?'':raw.tastingEvent).trim(),
            managerAction: String(raw.managerAction===undefined?'':raw.managerAction).trim(),
            salesRequest: String(raw.salesRequest===undefined?'':raw.salesRequest).trim(),
            safetyPrevention: String(raw.safetyPrevention===undefined?'':raw.safetyPrevention).trim(),
            storeEnvironment: String(raw.storeEnvironment===undefined?'':raw.storeEnvironment).trim()
          });
        });
      });

      if(rows.length===0){
        App.util.toast('엑셀에서 유효한 활동일보 데이터를 찾지 못했습니다. 컬럼명(사원명/방문일 등)을 확인해주세요.');
        return;
      }

      // 기존 데이터와 대조하여 신규/업데이트/중복 상태를 미리 계산 (미리보기용)
      rows.forEach(r=>{
        const key = App._reportKey(r);
        const existing = App.db.activityReports.find(x=>App._reportKey(x)===key);
        if(!existing){ r._status = 'new'; }
        else{
          const fieldsSame = ['managementSignal','storeInventory','tastingEvent','managerAction','salesRequest','safetyPrevention','storeEnvironment']
            .every(f=> (existing[f]||'') === (r[f]||''));
          r._status = fieldsSame ? 'duplicate' : 'update';
        }
      });

      Views._reportStaging = { fileName: file.name, rows, errors };
      App.navigate('reports');
    }catch(err){
      console.error(err);
      App.util.toast('활동일보 엑셀을 처리하는 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
};

// 드래그앤드롭 업로드 지원
Actions.handleReportDrop = function(ev){
  ev.preventDefault();
  const dt = ev.dataTransfer;
  if(dt && dt.files && dt.files.length){
    Actions.importActivityReportExcel(dt.files[0]);
  }
};

  const listHtml = candidates.map(s=>

      한 번 연결하면 다음 업로드부터 자동으로 적용됩니다.
    </p>
    <input type="text" placeholder="행사자명 검색" value="${App.util.esc(q)}"
      oninput="Views._matchPickerQuery=this.value;Actions._renderMatchStaffModal('${App.util.esc(rawName).replace(/'/g,"\\'")}','${mode}')" style="margin-bottom:10px;">
    <div id="matchPickerList" style="max-height:320px;overflow-y:auto;">${listHtml}</div>
    <div class="modal-actions"><button class="btn" onclick="UI.closeModal()">취소</button></div>`);

Actions.confirmMatchStaff = function(rawName, staffId, mode){
  // 별칭매핑 저장 -> 다음 업로드부터 자동 적용
  App.db.nameAliasMap[rawName] = staffId;
  App.save();

  if(mode==='staging' && Views._reportStaging){
    Views._reportStaging.rows.forEach(r=>{
      if(r.staffName===rawName){ r.matchedStaffId = staffId; r.isMatched = true; }
    });
  }else{
    // 이미 저장된 데이터: 해당 사원명의 모든 활동일보를 일괄 연결
    App.db.activityReports.forEach(r=>{
      if(r.staffName===rawName){ r.matchedStaffId = staffId; r.isMatched = true; }
    });
    App.save();
  }
  UI.closeModal();
  App.util.toast('행사자와 연결되었습니다');
  UI.render();
};
