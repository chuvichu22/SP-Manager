n      <div class=\"field\">\n        <label class=\"field-label\">엑셀 파일 선택 (.xlsx)</label>\n        <input type=\"file\" accept=\".xlsx,.xls\" onchange=\"Actions.importRecordsExcel(this.files[0]); this.value='';\">\n      </div>\n    </div>\n    <div class=\"card\">\n      <div style=\"font-weight:800;margin-bottom:8px;\">현재 데이터 엑셀로 내보내기</div>\n      <div style=\"font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.6;\">\n        누적된 실적 데이터를 업로드 양식과 동일한 컬럼 구조의 .xlsx로 다시 내보낼 수 있습니다.\n      </div>\n      <button class=\"btn primary\" style=\"width:100%;\" onclick=\"Actions.exportRecordsExcel()\">📥 실적 엑셀(.xlsx)로 내보내기</button>\n      <div style=\"font-size:12.5px;color:var(--text-secondary);margin-top:10px;\">현재 누적된 실적 레코드: <b>${App.db.records.length.toLocaleString()}건</b> / 업로드된 월: <b>${App._allYMs.length}개월</b></div>\n    </div>\n  </div>\n  <div class=\"section-title\">현재 저장 현황</div>\n  <div class=\"grid cols-3\">\n    <div class=\"card stat-card\"><div class=\"label\">등록된 행사자</div><div class=\"value\">${staffCount}<small> 명</small></div></div>\n    <div class=\"card stat-card\"><div class=\"label\">누적 실적 레코드</div><div class=\"value\">${App.db.records.length.toLocaleString()}<small> 건</small></div></div>\n    <div class=\"card stat-card\"><div class=\"label\">마지막 백업</div><div class=\"value\" style=\"font-size:16px;\">${App.db.meta.lastBackup || '없음'}</div></div>\n  </div>\n  <div class=\"section-title\" style=\"color:var(--improve);\">위험 구역</div>\n  <div class=\"card\">\n    <div style=\"font-weight:700;margin-bottom:10px;\">모든 데이터 초기화</div>\n    <div style=\"font-size:13px;color:var(--text-secondary);margin-bottom:12px;\">저장된 모든 행사자/일보 데이터가 삭제됩니다. 이 작업은 되돌릴 수 없습니다.</div>\n    <button class=\"btn danger\" onclick=\"Actions.resetAllData()\">🗑️ 전체 데이터 초기화</button>\n  </div>`;\n  document.getElementById('view').innerHTML = html;\n};\n\n/* ------------------------- 9. ACTIONS: CRUD 및 폼/모달 ------------------------- */\nconst Actions = {};\n\n/* -- 확인창 공통 -- */\nActions.confirm = function(message, onYes){\n  UI.openModal(`\n    <h2>확인</h2>\n    <p style=\"font-size:14px;line-height:1.6;margin-bottom:6px;\">${App.util.esc(message)}</p>\n    <div class=\"modal-actions\">\n      <button class=\"btn\" onclick=\"UI.closeModal()\">취소</button>\n      <button class=\"btn danger\" id=\"confirmYesBtn\">삭제</button>\n    </div>`);\n  document.getElementById('confirmYesBtn').onclick = ()=>{ onYes(); UI.closeModal(); };\n};\n\nActions.copyText = function(elId){\n  const text = document.getElementById(elId).textContent;\n  if(navigator.clipboard && navigator.clipboard.writeText){\n    navigator.clipboard.writeText(text).then(()=>App.util.toast('복사되었습니다')).catch(()=>App.util.toast('복사에 실패했습니다'));\n  }else{\n    const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();\n    document.execCommand('copy'); document.body.removeChild(ta);\n    App.util.toast('복사되었습니다');\n  }\n};\n\n/* ===== 행사자 등록/수정 ===== */\nActions.openStaffForm = function(staffId){\n  const s = staffId ? App.db.staff.find(x=>x.id===staffId) : null;\n  UI.openModal(`\n    <h2>${s? '행사자 정보 수정':'행사자 추가'}</h2>\n    <div class=\"field\"><label class=\"field-label\">행사자명</label><input id=\"f_name\" type=\"text\" value=\"${s?App.util.esc(s.name):''}\" placeholder=\"예: 김은주\"></div>\n    <div class=\"field\"><label class=\"field-label\">담당매장</label><input id=\"f_store\" type=\"text\" value=\"${s?App.util.esc(s.store||''):''}\" placeholder=\"예: 롯데마트 순천점\"></div>\n    <div class=\"field\"><label class=\"field-label\">입사일</label><input id=\"f_hire\" type=\"date\" value=\"${s?s.hireDate||'':''}\"></div>\n    <div class=\"field\"><label class=\"field-label\">담당구분</label>\n      <select id=\"f_type\">\n        ${['정규','계약','홍보대행'].map(t=>`<option ${s&&s.type===t?'selected':''}>${t}</option>`).join('')}\n      </select>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"btn\" onclick=\"UI.closeModal()\">취소</button>\n      <button class=\"btn primary\" onclick=\"Actions.saveStaff('${s?s.id:''}')\">저장</button>\n    </div>`);\n};\n\nActions.saveStaff = function(staffId){\n  const name = document.getElementById('f_name').value.trim();\n  if(!name){ App.util.toast('행사자명을 입력해주세요'); return; }\n  const store = document.getElementById('f_store').value.trim();\n  const hireDate = document.getElementById('f_hire').value;\n  const type = document.getElementById('f_type').value;\n  if(staffId){\n    const s = App.db.staff.find(x=>x.id===staffId);\n    Object.assign(s, {name, store, hireDate, type});\n  }else{\n    App.db.staff.push({\n      id: App.uid('staff'), name, store, hireDate, type,\n      createdAt: App.util.todayStr(),\n      goals:[], customers:[], memos:[], visitLogs:[]\n    });\n  }\n  App.save(); UI.closeModal(); App.util.toast('저장되었습니다'); UI.render();\n};\n\nActions.deleteStaff = function(staffId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  Actions.confirm(`'${s?s.name:''}' 행사자를 삭제하시겠습니까? 관련된 모든 기록이 함께 삭제됩니다.`, ()=>{\n    App.db.staff = App.db.staff.filter(x=>x.id!==staffId);\n    App.save(); App.util.toast('삭제되었습니다'); App.navigate('staff');\n  });\n};\n\n/* ===== 목표 ===== */\nActions.openGoalForm = function(staffId){\n  UI.openModal(`\n    <h2>목표 추가</h2>\n    <div class=\"field\"><label class=\"field-label\">목표 내용</label>\n      <input id=\"f_goal\" type=\"text\" list=\"goalPresets\" placeholder=\"예: 충성고객 월1명 확보\">\n      <datalist id=\"goalPresets\">\n        <option value=\"충성고객 월1명 확보\"><option value=\"목표댓글 작성\"><option value=\"행사노트 작성\">\n        <option value=\"고객응대\"><option value=\"직접연관진열\"><option value=\"레시피 활용\"><option value=\"매장담당 상담\">\n      </datalist>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn\" onclick=\"UI.closeModal()\">취소</button>\n      <button class=\"btn primary\" onclick=\"Actions.saveGoal('${staffId}')\">추가</button></div>`);\n};\nActions.saveGoal = function(staffId){\n  const title = document.getElementById('f_goal').value.trim();\n  if(!title){ App.util.toast('목표 내용을 입력해주세요'); return; }\n  const s = App.db.staff.find(x=>x.id===staffId);\n  s.goals.push({id:App.uid('goal'), title, done:false, createdAt:App.util.todayStr()});\n  App.save(); UI.closeModal(); App.navigate('staffDetail', staffId, 'goal');\n};\nActions.toggleGoal = function(staffId, goalId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  const g = s.goals.find(x=>x.id===goalId); g.done = !g.done;\n  App.save(); UI.render();\n};\nActions.deleteGoal = function(staffId, goalId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  s.goals = s.goals.filter(x=>x.id!==goalId); App.save(); UI.render();\n};\n\n/* ===== 관리자 활동이력 (방문일/매장명/체크리스트/메모) ===== */\nActions.openVisitLogForm = function(staffId){\n  const checklistHtml = App.visitChecklist.map(it=>`\n    <label class=\"chk-item\">\n      <input type=\"checkbox\" data-key=\"${it.key}\">\n      <span>${it.label}</span>\n    </label>`).join('');\n  UI.openModal(`\n    <h2>방문기록 추가</h2>\n    <div class=\"field\"><label class=\"field-label\">방문일</label><input id=\"f_vdate\" type=\"date\" value=\"${App.util.todayStr()}\"></div>\n    <div class=\"field\"><label class=\"field-label\">매장명</label><input id=\"f_vstore\" type=\"text\" placeholder=\"예: 이마트 광산점\"></div>\n    <div class=\"field\"><label class=\"field-label\">체크리스트</label>\n      <div class=\"checklist-grid\" id=\"visitChecklistGrid\">${checklistHtml}</div>\n    </div>\n    <div class=\"field\"><label class=\"field-label\">메모 (기타메모 포함)</label><textarea id=\"f_vmemo\" placeholder=\"특이사항을 적어주세요\"></textarea></div>\n    <div class=\"modal-actions\"><button class=\"btn\" onclick=\"UI.closeModal()\">취소</button>\n      <button class=\"btn primary\" onclick=\"Actions.saveVisitLog('${staffId}')\">추가</button></div>`);\n};\nActions.saveVisitLog = function(staffId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  const date = document.getElementById('f_vdate').value || App.util.todayStr();\n  const store = document.getElementById('f_vstore').value.trim();\n  const memo = document.getElementById('f_vmemo').value.trim();\n  const checklist = {};\n  document.querySelectorAll('#visitChecklistGrid input[type=checkbox]').forEach(chk=>{\n    checklist[chk.dataset.key] = chk.checked;\n  });\n  if(!s.visitLogs) s.visitLogs = [];\n  s.visitLogs.push({ id: App.uid('visit'), date, store, checklist, memo, createdAt: App.util.todayStr() });\n  App.save(); UI.closeModal(); App.navigate('staffDetail', staffId, 'visitlog');\n};\nActions.deleteVisitLog = function(staffId, logId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  Actions.confirm('이 방문기록을 삭제하시겠습니까?', ()=>{\n    s.visitLogs = (s.visitLogs||[]).filter(x=>x.id!==logId);\n    App.save(); UI.render();\n  });\n};\n\n/* ===== 충성고객 ===== */\nActions.openCustomerForm = function(staffId){\n  UI.openModal(`\n    <h2>충성고객 추가</h2>\n    <div class=\"field\"><label class=\"field-label\">고객명</label><input id=\"f_cname\" type=\"text\" placeholder=\"예: 홍길동 고객님\"></div>\n    <div class=\"field\"><label class=\"field-label\">관심상품</label><input id=\"f_cinterest\" type=\"text\" placeholder=\"예: 백년동안 흑초\"></div>\n    <div class=\"field\"><label class=\"field-label\">구매매장</label><input id=\"f_cstore\" type=\"text\" placeholder=\"예: 하나로마트 광양점\"></div>\n    <div class=\"grid cols-2\">\n      <div class=\"field\"><label class=\"field-label\">확보일</label><input id=\"f_cacq\" type=\"date\" value=\"${App.util.todayStr()}\"></div>\n      <div class=\"field\"><label class=\"field-label\">다음 방문 예정일</label><input id=\"f_cnext\" type=\"date\"></div>\n    </div>\n    <div class=\"field\"><label class=\"field-label\">메모</label><textarea id=\"f_cmemo\" placeholder=\"선호/특이사항 등\"></textarea></div>\n    <div class=\"modal-actions\"><button class=\"btn\" onclick=\"UI.closeModal()\">취소</button>\n      <button class=\"btn primary\" onclick=\"Actions.saveCustomer('${staffId}')\">추가</button></div>`);\n};\nActions.saveCustomer = function(staffId){\n  const name = document.getElementById('f_cname').value.trim();\n  if(!name){ App.util.toast('고객명을 입력해주세요'); return; }\n  const s = App.db.staff.find(x=>x.id===staffId);\n  s.customers.push({\n    id:App.uid('cust'), name,\n    interest:document.getElementById('f_cinterest').value.trim(),\n    store:document.getElementById('f_cstore').value.trim(),\n    acquiredDate:document.getElementById('f_cacq').value,\n    nextVisit:document.getElementById('f_cnext').value,\n    memo:document.getElementById('f_cmemo').value.trim(),\n    revisited:false\n  });\n  App.save(); UI.closeModal(); App.navigate('staffDetail', staffId, 'customer');\n};\nActions.toggleRevisit = function(staffId, custId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  const c = s.customers.find(x=>x.id===custId); c.revisited = !c.revisited;\n  App.save(); UI.render();\n};\nActions.deleteCustomer = function(staffId, custId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  s.customers = s.customers.filter(x=>x.id!==custId); App.save(); UI.render();\n};\n\n/* ===== 성과 데이터는 이제 엑셀 Import(App.db.records)로만 관리됩니다.\n   수동 실적 입력 폼은 새 스펙에서 제거되었습니다 (Views._tabMonthly 참고). ===== */\n\n\n\n/* ===== 관리자 메모 ===== */\nActions.openMemoForm = function(staffId){\n  UI.openModal(`\n    <h2>관리자 메모 작성</h2>\n    <div class=\"field\"><textarea id=\"f_memo\" placeholder=\"비공개로 관리되는 메모입니다\"></textarea></div>\n    <div class=\"modal-actions\"><button class=\"btn\" onclick=\"UI.closeModal()\">취소</button>\n      <button class=\"btn primary\" onclick=\"Actions.saveMemo('${staffId}')\">저장</button></div>`);\n};\nActions.saveMemo = function(staffId){\n  const text = document.getElementById('f_memo').value.trim();\n  if(!text) return;\n  const s = App.db.staff.find(x=>x.id===staffId);\n  s.memos.push({id:App.uid('memo'), text, date:App.util.todayStr()});\n  App.save(); UI.closeModal(); App.navigate('staffDetail', staffId, 'memo');\n};\nActions.deleteMemo = function(staffId, memoId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  s.memos = s.memos.filter(x=>x.id!==memoId); App.save(); UI.render();\n};\n\n/* ===== 성장 리포트 자동 생성 ===== */\nActions.buildGrowthReport = function(staffId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  if(!s) return '';\n  const months = App._allYMs.filter(ym=>App.getStaffAgg(s.name, ym).days>0);\n  const firstRate = months.length? App.getStaffAgg(s.name, months[0]).avgRate : null;\n  const lastRate = months.length? App.getStaffAgg(s.name, months[months.length-1]).avgRate : null;\n  const g = months.length? App.getStaffCumulativeAgg(s.name, months[months.length-1]).group : '제외';\n  const goals = s.goals||[]; const goalDone = goals.filter(x=>x.done).length;\n  const custCount = (s.customers||[]).length;\n  const logs = s.visitLogs||[];\n  const eduCount = logs.filter(l=>l.checklist && (l.checklist.serviceEdu || l.checklist.tastingEdu || l.checklist.etcEdu)).length;\n  const visitCount = logs.length;\n\n  let lines = [];\n  lines.push(`■ ${s.name} 성장 리포트 (${App.util.todayStr()} 기준)`);\n  lines.push('');\n  lines.push(`- 담당매장: ${s.store||'-'} / 담당구분: ${s.type||'-'} / 입사일: ${s.hireDate||'-'}`);\n  lines.push(`- 최근월 그룹: ${g}그룹`);\n  lines.push('');\n  lines.push('[교육내용]');\n  lines.push(eduCount? `누적 방문 중 ${eduCount}건에서 교육 관련 활동(고객응대/시식/기타 교육)이 진행되었습니다.` : '최근 별도로 기록된 교육 활동이 없습니다.');\n  lines.push('');\n  lines.push('[성과변화 / 달성률 변화]');\n  if(firstRate!==null && lastRate!==null){\n    const diff = lastRate-firstRate;\n    lines.push(`평균달성률이 ${firstRate}%에서 ${lastRate}%로 ${diff>=0? diff+'%p 상승':Math.abs(diff)+'%p 하락'}하였습니다.`);\n  }else{\n    lines.push('아직 업로드된 실적 데이터가 충분하지 않습니다.');\n  }\n  lines.push('');\n  lines.push('[그룹 변화]');\n  lines.push(`최근 실적을 기준으로 현재 ${g}그룹으로 분류되어 있습니다.`);\n  lines.push('');\n  lines.push('[목표 달성률]');\n  lines.push(goals.length? `전체 목표 ${goals.length}건 중 ${goalDone}건을 달성하여 달성률 ${Math.round(goalDone/goals.length*100)}%를 기록하였습니다.` : '등록된 목표가 없습니다.');\n  lines.push('');\n  lines.push('[충성고객 확보]');\n  lines.push(custCount? `누적 ${custCount}명의 충성고객을 확보하였습니다.` : '아직 확보된 충성고객이 없습니다.');\n  lines.push('');\n  lines.push('[활동이력]');\n  lines.push(visitCount? `누적 ${visitCount}건의 방문/활동이 기록되었습니다.` : '기록된 방문/활동이력이 없습니다.');\n  return lines.join('\\n');\n};\n\n/* ===== AI 코칭 자동 분석 (규칙 기반) =====\n   실제 LLM API 호출 없이, 누적된 데이터(목표/실적/고객/활동)를 규칙으로 해석하여\n   강점/부족점/추천목표/교육추천/관리포인트를 자동 생성합니다. */\nActions.buildAICoaching = function(staffId){\n  const s = App.db.staff.find(x=>x.id===staffId);\n  const goals = s.goals||[]; const custs = s.customers||[];\n  const months = App._allYMs.filter(ym=>App.getStaffAgg(s.name, ym).days>0);\n  const lastRate = months.length? App.getStaffAgg(s.name, months[months.length-1]).avgRate : 0;\n  const prevRate = months.length>1? App.getStaffAgg(s.name, months[months.length-2]).avgRate : lastRate;\n  const goalRate = goals.length? goals.filter(g=>g.done).length/goals.length*100 : 0;\n  const commentGoal = goals.find(g=>g.title.includes('댓글'));\n  const noteGoal = goals.find(g=>g.title.includes('노트'));\n  const g = months.length? App.getStaffCumulativeAgg(s.name, months[months.length-1]).group : '제외';\n\n  let strengthParts = [];\n  if(custs.length>=2) strengthParts.push('충성고객 확보 활동이 우수합니다');\n  if(lastRate>=prevRate && months.length>1) strengthParts.push('최근 평균달성률이 지속적으로 상승하고 있습니다');\n  if(goalRate>=70) strengthParts.push('등록된 목표의 이행률이 높은 편입니다');\n  if(strengthParts.length===0) strengthParts.push('현재까지의 데이터로는 두드러진 강점을 특정하기 어려우니, 활동기록을 조금 더 축적해보시길 권장합니다');\n\n  let weaknessParts = [];\n  if(commentGoal && !commentGoal.done) weaknessParts.push('목표댓글 작성률이 낮은 편입니다');\n  if(noteGoal && !noteGoal.done) weaknessParts.push('행사노트 작성이 다소 미흡합니다');\n  if(custs.length===0) weaknessParts.push('충성고객 확보 실적이 아직 없습니다');\n  if(lastRate<prevRate && months.length>1) weaknessParts.push('최근 평균달성률이 하락 추세를 보이고 있습니다');\n  if(weaknessParts.length===0) weaknessParts.push('특별히 우려되는 부분은 확인되지 않습니다');\n\n  let nextGoal = g==='개선' ? '기본기 강화를 위한 행사노트 작성률 향상을 다음달 목표로 추천합니다.'\n    : g==='성장' ? '목표댓글 작성 및 충성고객 추가 확보를 다음달 목표로 추천합니다.'\n    : '현재의 우수한 흐름을 유지하며 신규 상품 연관진열 확대를 목표로 추천합니다.';\n\n  let education = g==='개선' ? '고객응대 기본 교육 및 할인계산기 활용 교육을 우선 추천합니다.'\n    : g==='성장' ? '레시피 활용 및 연관진열 심화 교육을 추천합니다.'\n    : '신규 행사자 멘토링 역할을 부여할 수 있는 교육을 추천합니다.';\n\n  let managePoint = g==='개선' ? '주 단위로 방문하여 현장 밀착 관리와 독려가 필요합니다.'\n    : g==='성장' ? '월 2회 정기 방문으로 성장 추세를 지속 관리해 주세요.'\n    : '우수 사례를 타 매장에 공유할 수 있도록 관리해 주세요.';\n\n  return {\n    strength: strengthParts.join('. ') + '.',\n    weakness: weaknessParts.join('. ') + '.',\n    nextGoal, education, managePoint\n  };\n};\n\n/* ===== 자료 관리: CSV 내보내기/불러오기 ===== */\nApp.csv = {\n  escapeCell(v){\n    v = (v===undefined||v===null)? '' : String(v);\n    if(/[\",\\n]/.test(v)) return '\"' + v.replace(/\"/g,'\"\"') + '\"';\n    return v;\n  },\n  toCSV(rows){\n    return rows.map(r=>r.map(App.csv.escapeCell).join(',')).join('\\r\\n');\n  },\n  parseCSV(text){\n    const rows=[]; let row=[]; let cell=''; let inQuotes=false;\n    for(let i=0;i<text.length;i++){\n      const c = text[i];\n      if(inQuotes){\n        if(c==='\"'){ if(text[i+1]==='\"'){ cell+='\"'; i++; } else inQuotes=false; }\n        else cell+=c;\n      }else{\n        if(c==='\"') inQuotes=true;\n        else if(c===','){ row.push(cell); cell=''; }\n        else if(c==='\\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }\n        else if(c==='\\r'){ /* skip */ }\n        else cell+=c;\n      }\n    }\n    if(cell.length || row.length){ row.push(cell); rows.push(row); }\n    return rows.filter(r=> r.length>1 || (r[0]&&r[0].trim()!==''));\n  },\n  download(filename, content){\n    const blob = new Blob(['\\ufeff'+content], {type:'text/csv;charset=utf-8;'});\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a'); a.href=url; a.download=filename;\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }\n};\n\nActions.exportStaffCSV = function(){\n  const ym = App.state.selectedYM;\n  const { byStaff } = App.getCumulativeAgg(ym); // 누적(YTD) 기준\n  const rows = [['이름','담당매장','담당구분','입사일',`누적그룹(~${ym||'-'})`,'누적행사일수','누적평균달성률(%)','16만원미만횟수','16만원미만비율(%)','목표미달횟수','목표미달비율(%)','목표달성률(%)','충성고객수']];\n  App.db.staff.forEach(s=>{\n    const goals = s.goals||[]; const gr = goals.length? Math.round(goals.filter(x=>x.done).length/goals.length*100):0;\n    const a = byStaff[s.name] || {days:0,avgRate:0,under16Count:0,under16Pct:0,missCount:0,missPct:0,group:'제외'};\n    rows.push([s.name, s.store||'', s.type||'', s.hireDate||'', a.group, a.days, a.avgRate, a.under16Count, a.under16Pct, a.missCount, a.missPct, gr, (s.customers||[]).length]);\n  });\n  App.csv.download(`행사자목록_${App.util.todayStr()}.csv`, App.csv.toCSV(rows));\n  App.util.toast('CSV 파일이 다운로드되었습니다');\n};\n\nActions.exportPerformanceCSV = function(){\n  const rows = [['이름','월','행사일수(그달)','평균달성률(그달,%)','16만원미만횟수','16만원미만비율(%)','목표미달횟수','목표미달비율(%)','누적평균달성률(%)','누적그룹']];\n  App.db.staff.forEach(s=>{\n    App._allYMs.forEach(mk=>{\n      const a = App.getStaffAgg(s.name, mk);\n      if(a.days>0){\n        const cum = App.getStaffCumulativeAgg(s.name, mk);\n        rows.push([s.name, mk, a.days, a.avgRate, a.under16Count, a.under16Pct, a.missCount, a.missPct, cum.avgRate, cum.group]);\n      }\n    });\n  });\n  App.csv.download(`월별성과_${App.util.todayStr()}.csv`, App.csv.toCSV(rows));\n  App.util.toast('CSV 파일이 다운로드되었습니다');\n};\n\n// 행사자 목록 불러오기: 파일 확장자에 따라 분기합니다.\n//  - .xlsx / .xls  => 반드시 ArrayBuffer로 읽어 SheetJS(XLSX.read)로 파싱합니다.\n//                     엑셀 파일은 zip으로 압축된 바이너리 파일이므로 readAsText로 읽으면\n//                     PK/workbook.xml 등 압축 데이터가 그대로 텍스트로 깨져 나옵니다. 절대 readAsText 사용 금지.\n//  - .csv          => 기존 방식대로 텍스트로 읽어 자체 CSV 파서로 처리합니다.\nActions.importStaffCSV = function(file){\n  if(!file) return;\n  const fname = file.name.toLowerCase();\n  const isExcel = fname.endsWith('.xlsx') || fname.endsWith('.xls');\n\n  if(isExcel){\n    if(typeof XLSX === 'undefined'){\n      App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');\n      return;\n    }\n    const reader = new FileReader();\n    reader.onload = (e)=>{\n      try{\n        const data = new Uint8Array(e.target.result);\n        const workbook = XLSX.read(data, {type:'array'});\n        const sheet = workbook.Sheets[workbook.SheetNames[0]];\n        // 헤더(이름/담당매장/담당구분/입사일)를 키로 하는 JSON 배열로 변환\n        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});\n        const rows = json.map(row=>[\n          row['이름'] ?? row['name'] ?? '',\n          row['담당매장'] ?? row['store'] ?? '',\n          row['담당구분'] ?? row['type'] ?? '',\n          row['입사일'] ?? row['hireDate'] ?? ''\n        ]);\n        Actions._mergeStaffRows(rows);\n      }catch(err){ console.error(err); App.util.toast('엑셀 파일을 읽는 중 오류가 발생했습니다'); }\n    };\n    reader.readAsArrayBuffer(file);\n  }else{\n    const reader = new FileReader();\n    reader.onload = (e)=>{\n      try{\n        const rows = App.csv.parseCSV(e.target.result);\n        rows.shift(); // 헤더 제거\n        Actions._mergeStaffRows(rows);\n      }catch(err){ console.error(err); App.util.toast('CSV 파일을 읽는 중 오류가 발생했습니다'); }\n    };\n    reader.readAsText(file, 'UTF-8');\n  }\n};\n\n// 엑셀/CSV 공통: [이름, 담당매장, 담당구분, 입사일] 형태의 행 배열을 받아 행사자 데이터에 병합\nActions._mergeStaffRows = function(rows){\n  let added=0, updated=0;\n  rows.forEach(r=>{\n    const name = r[0], store = r[1], type = r[2], hireDate = r[3];\n    if(!name || !String(name).trim()) return;\n    const nameTrim = String(name).trim();\n    let s = App.db.staff.find(x=>x.name===nameTrim);\n    if(s){ s.store=store||s.store; s.type=type||s.type; s.hireDate=hireDate||s.hireDate; updated++; }\n    else{\n      App.db.staff.push({id:App.uid('staff'), name:nameTrim, store:store||'', type:type||'정규', hireDate:hireDate||'',\n        createdAt:App.util.todayStr(), goals:[], customers:[], memos:[], visitLogs:[]});\n      added++;\n    }\n  });\n  App.save();\n  App.util.toast(`불러오기 완료: 추가 ${added}건, 갱신 ${updated}건`);\n  UI.render();\n};\n\nActions.exportFullBackup = function(){\n  const json = JSON.stringify(App.db, null, 2);\n  const blob = new Blob([json], {type:'application/json'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a'); a.href=url; a.download = `promoter_backup_${App.util.todayStr()}.json`;\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n  App.db.meta.lastBackup = App.util.todayStr();\n  App.save();\n  App.util.toast('백업 파일이 다운로드되었습니다');\n};\n\nActions.importFullBackup = function(file){\n  if(!file) return;\n  Actions.confirm('전체 백업을 복원하면 현재 데이터가 모두 대체됩니다. 계속할까요?', ()=>{\n    const reader = new FileReader();\n    reader.onload = (e)=>{\n      try{\n        const data = JSON.parse(e.target.result);\n        if(!data.staff) throw new Error('형식이 올바르지 않습니다');\n        App.db = data; App.save(); App.util.toast('복원이 완료되었습니다'); UI.render();\n      }catch(err){ console.error(err); App.util.toast('백업 파일을 읽는 중 오류가 발생했습니다'); }\n    };\n    reader.readAsText(file, 'UTF-8');\n  });\n};\n\nActions.resetAllData = function(){\n  Actions.confirm('정말로 모든 데이터를 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.', ()=>{\n    App.db = App.defaultDB(); App.save(); App.util.toast('초기화되었습니다'); App.navigate('dashboard');\n  });\n};\n\n/* =========================================================================\n   9-A. 실적 엑셀 Import (샘표 전남지역 유인행사 - 고정 컬럼 스펙)\n   -------------------------------------------------------------------------\n   사용 컬럼(고정, 앞으로 바뀌지 않음):\n     행사자이름, 목표, 총판매금액, 달성률, YEAR, MONTH, 품목군1, 품목군2, 품목군3,\n     판매수량1, 판매수량2, 판매수량3  (그 외 컬럼은 사용하지 않음)\n   - .xlsx 전용. 반드시 ArrayBuffer + SheetJS(XLSX.read)로 파싱합니다. (readAsText 절대 금지)\n   - 표 위에 제목행/병합셀이 있어도 헤더 행을 자동으로 탐지합니다.\n   - YEAR+MONTH가 같은 기존 데이터가 있으면 이번 업로드 내용으로 그 달 전체를 교체(업데이트)하고,\n     다른 달의 기존 데이터는 그대로 유지합니다. (매달 순차 업로드 -> 누적되는 \"월 단위 교체\" 전략)\n   - 문제 있는 행은 건너뛰고 오류 목록으로 모아 완료 후 안내합니다.\n   ========================================================================= */\n\nApp.recordColumns = [\n  {key:'staffName',        headers:['행사자이름','행사자명','이름']},\n  {key:'target',           headers:['목표']},\n  {key:'totalSales',       headers:['총판매금액','판매금액']},\n  {key:'achievementRate',  headers:['달성률']},\n  {key:'year',             headers:['YEAR','year','Year']},\n  {key:'month',            headers:['MONTH','month','Month']}\n];\n\n// 헤더 텍스트 -> 표준 필드 매핑. 정해진 컬럼명과 정확히(공백/대소문자 무시) 일치하는 열만 사용하고,\n// 그 외 컬럼은 조용히 무시합니다 (엑셀 양식은 앞으로 바뀌지 않는다는 전제).\nApp._buildRecordColumnMap = function(headerRow){\n  const map = {}; // 열 인덱스 -> 표준 필드 key\n  headerRow.forEach((h,idx)=>{\n    const nh = App.util.normalizeHeaderStr(h);\n    if(!nh) return;\n    for(const col of App.recordColumns){\n      if(col.headers.some(alias=>App.util.normalizeHeaderStr(alias)===nh)){\n        map[idx] = col.key;\n        break;\n      }\n    }\n  });\n  return map;\n};\n\n// 시트 앞부분 최대 10행을 훑어 고정 컬럼명과 가장 많이 일치하는 행을 헤더 행으로 판단합니다.\n// (실제 회사 엑셀은 표 위에 제목행/병합셀이 있는 경우가 많아 무조건 1행을 헤더로 볼 수 없음)\nActions._detectRecordHeaderRow = function(rawRows){\n  const scanLimit = Math.min(10, rawRows.length);\n  let bestIdx = -1, bestScore = 0;\n  for(let i=0;i<scanLimit;i++){\n    const row = (rawRows[i]||[]).map(c=>String(c||''));\n    const score = Object.keys(App._buildRecordColumnMap(row)).length;\n    if(score > bestScore){ bestScore = score; bestIdx = i; }\n  }\n  // 최소 2개 컬럼(예: 행사자이름+YEAR) 이상 일치해야 신뢰할 수 있는 헤더 행으로 인정\n  return bestScore>=2 ? bestIdx : -1;\n};\n\n// rawRows(배열의 배열) 하나에서 실적 데이터를 추출하는 공용 로직. 엑셀 시트든 구글시트 CSV든\n// 동일한 형태(header:1 스타일 배열)로만 넘겨주면 똑같이 동작합니다.\nActions._extractRecordRows = function(rawRows, sourceLabel){\n  const errors = [];\n  const headerIdx = Actions._detectRecordHeaderRow(rawRows);\n  if(headerIdx===-1){\n    return { rows:[], errors:[`[${sourceLabel}] 인식 가능한 헤더(행사자이름/YEAR/MONTH 등)를 찾지 못했습니다.`] };\n  }\n  const headerRow = rawRows[headerIdx].map(h=>String(h||''));\n  const colMap = App._buildRecordColumnMap(headerRow);\n  const rows = [];\n\n  rawRows.slice(headerIdx+1).forEach((rowArr, rIdx)=>{\n    if(!rowArr || rowArr.every(c=>String(c).trim()==='')) return; // 완전히 빈 행은 조용히 건너뜀\n\n    const raw = {};\n    Object.keys(colMap).forEach(idx=>{ raw[colMap[idx]] = rowArr[idx]; });\n\n    const staffName = String(raw.staffName||'').trim();\n    if(!staffName) return; // 행사자이름 없는 행은 조용히 건너뜀\n\n    const year = parseInt(raw.year, 10);\n    const month = parseInt(raw.month, 10);\n    if(!year || !month || month<1 || month>12){\n      errors.push(`[${sourceLabel}] ${headerIdx+rIdx+2}행: YEAR/MONTH를 인식할 수 없어 건너뜀 (행사자: ${staffName})`);\n      return;\n    }\n\n    const target = App.util.parseNumberLoose(raw.target);\n    const totalSales = App.util.parseNumberLoose(raw.totalSales);\n    // ★ 검증된 계산 로직: 달성률은 원본 \"달성률\" 컬럼값을 그대로 사용합니다.\n    //   총판매금액÷목표로 재계산하지 않습니다. 값이 없거나 인식 불가하면 이 행은 건너뜁니다.\n    const rate = App.util.parseAchievementRate(raw.achievementRate);\n    if(rate===null || rate===undefined){\n      errors.push(`[${sourceLabel}] ${headerIdx+rIdx+2}행: 달성률 값을 인식할 수 없어 건너뜀 (행사자: ${staffName})`);\n      return;\n    }\n\n    rows.push({\n      id: App.uid('rec'),\n      staffName, year, month, ym: `${year}-${String(month).padStart(2,'0')}`,\n      target, totalSales, achievementRate: rate\n    });\n  });\n\n  return { rows, errors };\n};\n\nActions.importRecordsExcel = function(file){\n  if(!file) return;\n  const fname = file.name.toLowerCase();\n  if(!(fname.endsWith('.xlsx') || fname.endsWith('.xls'))){\n    App.util.toast('엑셀(.xlsx) 파일만 업로드할 수 있습니다');\n    return;\n  }\n  if(typeof XLSX === 'undefined'){\n    App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');\n    return;\n  }\n\n  const reader = new FileReader();\n  // ⚠ 엑셀은 zip으로 압축된 바이너리 파일입니다. readAsText로 읽으면 PK/workbook.xml 등\n  //    압축 데이터가 그대로 깨져 나옵니다. 반드시 ArrayBuffer로 읽어 SheetJS(XLSX.read)로 파싱합니다.\n  reader.onload = function(e){\n    try{\n      const data = new Uint8Array(e.target.result);\n      const workbook = XLSX.read(data, { type:'array', cellDates:true });\n\n      // 시트명에 제한을 두지 않고, 헤더를 자동 탐지할 수 있는 모든 시트에서 데이터를 수집합니다.\n      let allRows = [];\n      const errors = [];\n      const sheetReport = [];\n\n      workbook.SheetNames.forEach(sheetName=>{\n        const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header:1, defval:'', raw:true });\n        const { rows, errors: rowErrors } = Actions._extractRecordRows(rawRows, sheetName);\n        errors.push(...rowErrors);\n        if(rows.length>0){\n          allRows = allRows.concat(rows);\n          sheetReport.push({ sheetName, count: rows.length });\n        }\n      });\n\n      if(allRows.length===0){\n        App.util.toast('엑셀에서 유효한 데이터를 찾지 못했습니다. 컬럼명(행사자이름/목표/총판매금액/달성률/YEAR/MONTH 등)을 확인해주세요.');\n        return;\n      }\n\n      Actions._mergeRecordsByMonth(allRows, sheetReport, errors);\n    }catch(err){\n      console.error(err);\n      App.util.toast('엑셀 파일을 처리하는 중 오류가 발생했습니다: ' + err.message);\n    }\n  };\n  reader.readAsArrayBuffer(file);\n};\n\n// YEAR+MONTH가 같은 기존 데이터가 있으면 이번 업로드 내용으로 그 달 전체를 교체(업데이트)하고,\n// 다른 달의 기존 데이터는 그대로 유지합니다 (매달 새 엑셀을 올리는 실제 업무 흐름에 맞춘 전략).\nActions._mergeRecordsByMonth = function(newRows, sheetReport, errors, silent){\n  const ymGroups = {};\n  newRows.forEach(r=>{ if(!ymGroups[r.ym]) ymGroups[r.ym]=[]; ymGroups[r.ym].push(r); });\n\n  const summary = [];\n  let updatedMonths = 0, newMonths = 0;\n\n  Object.keys(ymGroups).sort().forEach(ym=>{\n    const isExisting = App.db.records.some(r=>r.ym===ym);\n    App.db.records = App.db.records.filter(r=>r.ym!==ym); // 해당 월의 기존 데이터 제거\n    App.db.records.push(...ymGroups[ym]);                  // 새 데이터로 교체\n    summary.push({ ym, count: ymGroups[ym].length, isUpdate: isExisting });\n    if(isExisting) updatedMonths++; else newMonths++;\n  });\n\n  // 새로 등장한 행사자이름은 최소 정보로 자동 등록해, 목표/메모/체크리스트 등에서 바로 이어서 쓸 수 있게 함\n  const existingNames = new Set(App.db.staff.map(s=>s.name));\n  const newNames = new Set();\n  newRows.forEach(r=>{ if(!existingNames.has(r.staffName)) newNames.add(r.staffName); });\n  newNames.forEach(name=>{\n    App.db.staff.push({\n      id: App.uid('staff'), name, store:'', type:'정규', hireDate:'', createdAt: App.util.todayStr(),\n      goals:[], customers:[], memos:[], visitLogs:[]\n    });\n  });\n\n  App._rebuildRecordIndex();\n  App.invalidateAggCache();\n  App.save();\n\n  if(!silent) Actions._showImportSummary(summary, sheetReport, updatedMonths, newMonths, errors);\n  UI.render();\n};\n\nActions._showImportSummary = function(summary, sheetReport, updatedMonths, newMonths, errors){\n  const lines = summary.map(s=>`${s.ym} : ${s.count}건 ${s.isUpdate?'업데이트':'신규'} Import 완료`).join('\\n');\n  const total = summary.reduce((a,s)=>a+s.count,0);\n  const msg = `${lines}\\n\\n총 ${total}건 Import 완료\\n신규 월: ${newMonths}개월\\n업데이트 월: ${updatedMonths}개월`;\n\n  const sheetLines = sheetReport.map(s=>`${s.sheetName} 시트: ${s.count}행 인식`).join('\\n');\n  const sheetHtml = sheetLines ? `<div style=\"margin-top:14px;\">\n      <div style=\"font-weight:800;margin-bottom:6px;\">시트별 인식 결과</div>\n      <div class=\"report-box\" style=\"font-size:12.5px;white-space:pre-wrap;\">${App.util.esc(sheetLines)}</div>\n    </div>` : '';\n\n  let errHtml = '';\n  if(errors.length){\n    const shown = errors.slice(0,30);\n    errHtml = `<div style=\"margin-top:14px;\">\n      <div style=\"font-weight:800;color:var(--improve);margin-bottom:6px;\">건너뛴 행 / 오류 (${errors.length}건)</div>\n      <div class=\"report-box\" style=\"max-height:180px;overflow-y:auto;font-size:12.5px;\">\n        ${shown.map(e=>App.util.esc(e)).join('<br>')}${errors.length>30? `<br>...외 ${errors.length-30}건` : ''}\n      </div>\n    </div>`;\n  }\n\n  UI.openModal(`\n    <h2>엑셀 Import 완료</h2>\n    <div class=\"report-box\" style=\"white-space:pre-wrap;\">${App.util.esc(msg)}</div>\n    ${sheetHtml}\n    ${errHtml}\n    <div class=\"modal-actions\"><button class=\"btn primary\" onclick=\"UI.closeModal()\">확인</button></div>`);\n};\n\n// 누적된 실적 데이터를 업로드 양식과 동일한 컬럼 구조로 다시 .xlsx로 내보내기\nActions.exportRecordsExcel = function(){\n  if(typeof XLSX === 'undefined'){\n    App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');\n    return;\n  }\n  if(App.db.records.length===0){\n    App.util.toast('내보낼 실적 데이터가 없습니다');\n    return;\n  }\n  const sheetData = App.db.records\n    .slice()\n    .sort((a,b)=> a.ym.localeCompare(b.ym) || a.staffName.localeCompare(b.staffName))\n    .map(r=>({\n      '행사자이름': r.staffName, '목표': r.target, '총판매금액': r.totalSales, '달성률': r.achievementRate,\n      'YEAR': r.year, 'MONTH': r.month\n    }));\n  const wb = XLSX.utils.book_new();\n  const ws = XLSX.utils.json_to_sheet(sheetData);\n  XLSX.utils.book_append_sheet(wb, ws, '실적데이터');\n  XLSX.writeFile(wb, `실적데이터_${App.util.todayStr()}.xlsx`);\n  App.util.toast('엑셀 파일이 다운로드되었습니다');\n};\n\n\n/* =========================================================================\n   11. 활동일보 업로드 & 행사자별 자동 연동 (신규 기능)\n   -------------------------------------------------------------------------\n   - 매니저가 작성한 활동일보 엑셀(.xlsx/.xls)을 업로드하면, 컬럼명 기준으로 인식하여\n     \"사원명\"과 행사자 관리에 등록된 행사자명을 자동 매칭하고, 방문일/거래처/매니저명\n     조합으로 중복을 판단해 누적 저장합니다.\n   - 기존 실적(records)/행사자(staff) 데이터와는 완전히 분리된 App.db.activityReports에\n     저장되며, matchedStaffId로만 연결됩니다 (이름이 나중에 바뀌어도 이력 유지).\n   - 이름이 정확히 일치하지 않으면 절대 임의로 매칭하지 않고 \"매칭 필요\"로 분류하며,\n     한 번 수동으로 연결하면 App.db.nameAliasMap에 저장되어 다음 업로드부터 자동 적용됩니다.\n   ========================================================================= */\n\n// 활동일보 엑셀 고정 컬럼 (컬럼 순서 무관, 헤더 텍스트 기준으로 인식. 일부 컬럼이 없어도 동작)\nApp.reportColumns = [\n  {key:'dept',              headers:['거래처DEPT','거래처 DEPT','DEPT','부서']},\n  {key:'managerName',       headers:['매니저명','매니저']},\n  {key:'visitDate',         headers:['방문일','방문일자','일자','날짜']},\n  {key:'directStore',       headers:['직거래처','거래처명','거래처']},\n  {key:'secondaryStore',    headers:['2차거래처명','2차거래처','2차점명','2차점']},\n  {key:'staffName',         headers:['사원명','행사자명','이름']},\n  {key:'managementSignal',  headers:['관리신호','신호']},\n  {key:'storeInventory',    headers:['매장재고','재고']},\n  {key:'tastingEvent',      headers:['시식행사','시식']},\n  {key:'managerAction',     headers:['매니저조치사항','조치사항']},\n  {key:'salesRequest',      headers:['영업요청사항','영업요청']},\n  {key:'safetyPrevention',  headers:['안전예방']},\n  {key:'storeEnvironment',  headers:['매장환경']}\n];\n\nApp._buildReportColumnMap = function(headerRow){\n  const map = {};\n  headerRow.forEach((h,idx)=>{\n    const nh = App.util.normalizeHeaderStr(h);\n    if(!nh) return;\n    for(const col of App.reportColumns){\n      if(col.headers.some(alias=>App.util.normalizeHeaderStr(alias)===nh)){\n        map[idx] = col.key;\n        break;\n      }\n    }\n  });\n  return map;\n};\n\n// 표 위에 제목행이 있어도 \"사원명/방문일/관리신호\" 등과 가장 많이 일치하는 행을 헤더로 판단\nActions._detectReportHeaderRow = function(rawRows){\n  const scanLimit = Math.min(10, rawRows.length);\n  let bestIdx = -1, bestScore = 0;\n  for(let i=0;i<scanLimit;i++){\n    const row = (rawRows[i]||[]).map(c=>String(c||''));\n    const score = Object.keys(App._buildReportColumnMap(row)).length;\n    if(score > bestScore){ bestScore = score; bestIdx = i; }\n  }\n  return bestScore>=3 ? bestIdx : -1; // 최소 3개 컬럼 이상 일치해야 신뢰\n};\n\n// 중복 판단 키: 방문일 + 사원명 + 직거래처 + 2차거래처명 + 매니저명\nApp._reportKey = function(r){\n  return [r.visitDate||'', r.staffName||'', r.directStore||'', r.secondaryStore||'', r.managerName||''].join('|');\n};\n\n// 이름 끝에 붙는 숫자/영문(구분코드, 예: \"강명옥5\", \"김은주C\")을 제거해 비교용 기본 이름을 만듦.\n// 동명이인이 없다는 전제 하에, 접미사가 달라도 같은 사람으로 인식하기 위해 사용합니다.\nApp.util.normalizeStaffName = function(name){\n  return String(name||'').trim().replace(/[0-9A-Za-z]+$/, '').trim();\n};\n\n// 활동일보/목표시트 등의 \"이름\" 텍스트로 행사자를 찾는다:\n// 1) 정확히 일치  2) 저장된 별칭매핑  3) 접미사(숫자/영문) 무시 기본이름 일치(후보가 1명일 때만) → 없으면 null(매칭 필요)\nApp.findStaffIdForReportName = function(rawName){\n  const name = String(rawName||'').trim();\n  if(!name) return null;\n\n  const exact = App.db.staff.find(x=>x.name===name);\n  if(exact) return exact.id;\n\n  if(App.db.nameAliasMap[name]){\n    const aliased = App.db.staff.find(x=>x.id===App.db.nameAliasMap[name]);\n    if(aliased) return aliased.id;\n  }\n\n  // 접미사(숫자/영문 코드) 무시 매칭: \"강명옥\" -> \"강명옥5\" 처럼 기본 이름이 같은 행사자를 찾음\n  const base = App.util.normalizeStaffName(name);\n  if(base){\n    const candidates = App.db.staff.filter(x=>App.util.normalizeStaffName(x.name)===base);\n    if(candidates.length===1) return candidates[0].id; // 후보가 정확히 1명일 때만 자동 매칭 (모호하면 매칭 필요로 남김)\n  }\n\n  return null;\n};\n\n// 업로드 후 \"반영하기\" 전까지 미리보기 상태로 들고 있는 임시 데이터 (아직 App.db에 저장되지 않음)\nViews._reportStaging = null; // { fileName, rows:[...], errors:[...] }\nViews._reportListState = { tab:'list', q:'', store:'', manager:'', ym:'', signal:'' };\nViews._reportExpandedId = null;\n\n// rawRows(배열의 배열) 하나에서 활동일보 데이터를 추출하는 공용 로직. 엑셀 시트든 구글시트 CSV든 동일하게 동작합니다.\nActions._extractReportRows = function(rawRows, sourceLabel){\n  const errors = [];\n  const headerIdx = Actions._detectReportHeaderRow(rawRows);\n  if(headerIdx===-1){\n    return { rows:[], errors:[`[${sourceLabel}] 인식 가능한 헤더(사원명/방문일 등)를 찾지 못했습니다.`] };\n  }\n  const headerRow = rawRows[headerIdx].map(h=>String(h||''));\n  const colMap = App._buildReportColumnMap(headerRow);\n  const rows = [];\n\n  rawRows.slice(headerIdx+1).forEach((rowArr, rIdx)=>{\n    if(!rowArr || rowArr.every(c=>String(c).trim()==='')) return; // 완전히 빈 행은 조용히 건너뜀\n\n    const raw = {};\n    Object.keys(colMap).forEach(idx=>{ raw[colMap[idx]] = rowArr[idx]; });\n\n    const staffName = String(raw.staffName||'').trim();\n    if(!staffName){\n      errors.push(`[${sourceLabel}] ${headerIdx+rIdx+2}행: 사원명이 비어있어 건너뜀`);\n      return;\n    }\n\n    let visitDate = App.util.normalizeExcelDate(raw.visitDate, null);\n    if(!visitDate){\n      errors.push(`[${sourceLabel}] ${headerIdx+rIdx+2}행: 방문일을 인식하지 못했습니다 (사원명: ${staffName}). 날짜 없이 기록됩니다.`);\n      visitDate = '';\n    }\n\n    const matchedStaffId = App.findStaffIdForReportName(staffName);\n\n    rows.push({\n      _tempId: App.uid('tmp'),\n      dept: String(raw.dept||'').trim(),\n      managerName: String(raw.managerName||'').trim(),\n      visitDate,\n      directStore: String(raw.directStore||'').trim(),\n      secondaryStore: String(raw.secondaryStore||'').trim(),\n      staffName,\n      matchedStaffId,\n      isMatched: !!matchedStaffId,\n      managementSignal: String(raw.managementSignal===undefined?'':raw.managementSignal).trim(),\n      storeInventory: String(raw.storeInventory===undefined?'':raw.storeInventory).trim(),\n      tastingEvent: String(raw.tastingEvent===undefined?'':raw.tastingEvent).trim(),\n      managerAction: String(raw.managerAction===undefined?'':raw.managerAction).trim(),\n      salesRequest: String(raw.salesRequest===undefined?'':raw.salesRequest).trim(),\n      safetyPrevention: String(raw.safetyPrevention===undefined?'':raw.safetyPrevention).trim(),\n      storeEnvironment: String(raw.storeEnvironment===undefined?'':raw.storeEnvironment).trim()\n    });\n  });\n\n  return { rows, errors };\n};\n\nActions.importActivityReportExcel = function(file){\n  if(!file) return;\n  const fname = file.name.toLowerCase();\n  if(!(fname.endsWith('.xlsx') || fname.endsWith('.xls'))){\n    App.util.toast('활동일보는 엑셀(.xlsx, .xls) 파일만 업로드할 수 있습니다');\n    return;\n  }\n  if(typeof XLSX === 'undefined'){\n    App.util.toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');\n    return;\n  }\n  const reader = new FileReader();\n  // ⚠ 엑셀은 바이너리(zip) 파일이므로 반드시 ArrayBuffer로 읽어 SheetJS로 파싱합니다.\n  reader.onload = function(e){\n    try{\n      const data = new Uint8Array(e.target.result);\n      const workbook = XLSX.read(data, { type:'array', cellDates:true });\n\n      let rows = [];\n      const errors = [];\n\n      workbook.SheetNames.forEach(sheetName=>{\n        const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header:1, defval:'', raw:true });\n        const { rows: sheetRows, errors: rowErrors } = Actions._extractReportRows(rawRows, sheetName);\n        errors.push(...rowErrors);\n        rows = rows.concat(sheetRows);\n      });\n\n      if(rows.length===0){\n        App.util.toast('엑셀에서 유효한 활동일보 데이터를 찾지 못했습니다. 컬럼명(사원명/방문일 등)을 확인해주세요.');\n        return;\n      }\n\n      // 기존 데이터와 대조하여 신규/업데이트/중복 상태를 미리 계산 (미리보기용)\n      rows.forEach(r=>{\n        const key = App._reportKey(r);\n        const existing = App.db.activityReports.find(x=>App._reportKey(x)===key);\n        if(!existing){ r._status = 'new'; }\n        else{\n          const fieldsSame = ['managementSignal','storeInventory','tastingEvent','managerAction','salesRequest','safetyPrevention','storeEnvironment']\n            .every(f=> (existing[f]||'') === (r[f]||''));\n          r._status = fieldsSame ? 'duplicate' : 'update';\n        }\n      });\n\n      Views._reportStaging = { fileName: file.name, rows, errors };\n      App.navigate('reports');\n    }catch(err){\n      console.error(err);\n      App.util.toast('활동일보 엑셀을 처리하는 중 오류가 발생했습니다: ' + err.message);\n    }\n  };\n  reader.readAsArrayBuffer(file);\n};\n\n// 드래그앤드롭 업로드 지원\nActions.handleReportDrop = function(ev){\n  ev.preventDefault();\n  const dt = ev.dataTransfer;\n  if(dt && dt.files && dt.files.length){\n    Actions.importActivityReportExcel(dt.files[0]);\n  }\n};\n\n/* =========================================================================\n   12. 구글시트(publish-to-web CSV) 동기화 - 신규 기능\n   -------------------------------------------------------------------------\n   구글시트를 \"파일 > 웹에 게시 > CSV\"로 게시하면 로그인 없이 읽을 수 있는\n   공개 CSV 링크가 생깁니다. 이 링크 2개(유인행사 실적 / 활동일보)를 자료관리에서\n   등록해두면, 폰이든 PC든 이 앱에 접속할 때마다 같은 구글시트 데이터를 불러와\n   자동으로 반영합니다 (엑셀 파일을 매번 업로드하지 않아도 됨).\n   - 읽기 전용입니다 (앱에서 구글시트로 다시 쓰지는 않습니다).\n   - 기존 엑셀 업로드 기능과 동일한 컬럼 인식/그룹계산 로직을 그대로 재사용합니다.\n   ========================================================================= */\n\n// CSV 텍스트를 가져와 배열의 배열(rawRows) 형태로 반환\nApp.util.fetchCsvRows = async function(url){\n  const res = await fetch(url, { cache:'no-store' });\n  if(!res.ok) throw new Error('HTTP ' + res.status);\n  const text = await res.text();\n  return App.csv.parseCSV(text);\n};\n\n// 두 구글시트를 한 번에 동기화. silent=true면 결과 팝업 없이 조용히 처리(자동 동기화용).\n// 목표 구글폼 응답시트에서 [성함, 목표내용, 이유] 컬럼을 인식해서 개인목표로 변환\n// (열 순서가 아니라 헤더 텍스트로 인식: \"성함\"/\"이름\" 계열, \"목표\"가 들어간 열, \"이유\"가 들어간 열)\nActions._extractGoalRows = function(rawRows, sourceLabel){\n  const errors = [];\n  if(!rawRows || rawRows.length<2) return { rows:[], errors:[`[${sourceLabel}] 데이터가 없습니다.`] };\n\n  const headerRow = (rawRows[0]||[]).map(h=>String(h||''));\n  let nameIdx=-1, goalIdx=-1, reasonIdx=-1;\n  headerRow.forEach((h,idx)=>{\n    const nh = App.util.normalizeHeaderStr(h);\n    if(nameIdx===-1 && /성함|이름|성명/.test(h)) nameIdx = idx;\n    if(goalIdx===-1 && h.includes('목표')) goalIdx = idx;\n    if(reasonIdx===-1 && h.includes('이유')) reasonIdx = idx;\n  });\n  if(nameIdx===-1 || goalIdx===-1){\n    return { rows:[], errors:[`[${sourceLabel}] \"성함\"/\"목표\" 컬럼을 찾지 못했습니다.`] };\n  }\n\n  const rows = [];\n  rawRows.slice(1).forEach((rowArr, rIdx)=>{\n    if(!rowArr || rowArr.every(c=>String(c).trim()==='')) return;\n    const staffNameRaw = String(rowArr[nameIdx]||'').trim();\n    const title = String(rowArr[goalIdx]||'').trim();\n    const reason = reasonIdx>=0 ? String(rowArr[reasonIdx]||'').trim() : '';\n    if(!staffNameRaw || !title) return; // 이름/목표 둘 다 있어야 유효한 행\n\n    const matchedStaffId = App.findStaffIdForReportName(staffNameRaw);\n    rows.push({ staffNameRaw, title, reason, matchedStaffId });\n  });\n\n  return { rows, errors };\n};\n\n// 목표시트에서 읽어온 행들을 각 행사자의 개인목표에 반영 (같은 제목의 목표가 이미 있으면 건너뜀 = 재동기화 시 중복방지)\nActions._applyGoalRows = function(rows){\n  let added=0, unmatched=0;\n  const unmatchedNames = new Set();\n  rows.forEach(r=>{\n    if(!r.matchedStaffId){ unmatched++; unmatchedNames.add(r.staffNameRaw); return; }\n    const s = App.db.staff.find(x=>x.id===r.matchedStaffId);\n    if(!s) return;\n    if(!s.goals) s.goals = [];\n    const already = s.goals.some(g=>g.title===r.title);\n    if(already) return;\n    s.goals.push({\n      id: App.uid('goal'), title: r.title, reason: r.reason||'', done:false,\n      createdAt: App.util.todayStr(), source:'설문'\n    });\n    added++;\n  });\n  return { added, unmatched, unmatchedNames:[...unmatchedNames] };\n};\n\nActions.syncGoogleSheets = async function(silent){\n  const urls = (App.db.meta && App.db.meta.sheetUrls) || {};\n  if(!urls.records && !urls.reports && !urls.goals){\n    if(!silent) App.util.toast('구글시트 주소가 설정되어 있지 않습니다. 자료 관리에서 먼저 등록해주세요.');\n    return;\n  }\n\n  const result = { recordCount:0, recordErrors:[], reportSummary:null, goalSummary:null, failed:[] };\n\n  if(urls.records){\n    try{\n      const rawRows = await App.util.fetchCsvRows(urls.records);\n      const { rows, errors } = Actions._extractRecordRows(rawRows, '유인행사 시트');\n      result.recordErrors = errors;\n      if(rows.length>0){\n        Actions._mergeRecordsByMonth(rows, [{ sheetName:'유인행사 시트', count: rows.length }], errors, true /*silent*/);\n        result.recordCount = rows.length;\n      }\n    }catch(err){\n      console.error('유인행사 시트 동기화 실패', err);\n      result.failed.push('유인행사 실적 시트: ' + err.message);\n    }\n  }\n\n  if(urls.reports){\n    try{\n      const rawRows = await App.util.fetchCsvRows(urls.reports);\n      const { rows, errors } = Actions._extractReportRows(rawRows, '활동일보 시트');\n      if(rows.length>0){\n        Views._reportStaging = { fileName:'구글시트 동기화', rows, errors };\n        result.reportSummary = Actions.commitActivityReports(true /*silent*/);\n      }\n    }catch(err){\n      console.error('활동일보 시트 동기화 실패', err);\n      result.failed.push('활동일보 시트: ' + err.message);\n    }\n  }\n\n  if(urls.goals){\n    try{\n      const rawRows = await App.util.fetchCsvRows(urls.goals);\n      const { rows } = Actions._extractGoalRows(rawRows, '목표 시트');\n      if(rows.length>0){\n        result.goalSummary = Actions._applyGoalRows(rows);\n      }\n    }catch(err){\n      console.error('목표 시트 동기화 실패', err);\n      result.failed.push('목표 시트: ' + err.message);\n    }\n  }\n\n  App.db.meta.lastSheetSync = App.util.todayStr();\n  App.save();\n  UI.render();\n\n  if(!silent){\n    let msg = '';\n    if(result.recordCount) msg += `✅ 유인행사 실적 ${result.recordCount}건 반영\\n`;\n    if(result.reportSummary) msg += `✅ 활동일보 ${result.reportSummary.total}건 확인 (신규 ${result.reportSummary.added} · 업데이트 ${result.reportSummary.updated} · 중복제외 ${result.reportSummary.skipped})\\n`;\n    if(result.goalSummary) msg += `✅ 개인목표 신규 ${result.goalSummary.added}건 추가${result.goalSummary.unmatched? ` (매칭 안된 이름 ${result.goalSummary.unmatched}건: ${result.goalSummary.unmatchedNames.join(', ')})`:''}\\n`;\n    if(result.failed.length) msg += `\\n⚠️ 실패:\\n` + result.failed.join('\\n');\n    if(!msg) msg = '동기화할 데이터가 없습니다.';\n    UI.openModal(`<h2>구글시트 동기화 완료</h2><div class=\"report-box\" style=\"white-space:pre-wrap;\">${App.util.esc(msg)}</div>\n      <div class=\"modal-actions\"><button class=\"btn primary\" onclick=\"UI.closeModal()\">확인</button></div>`);\n  }\n};\n\nActions.saveSheetUrls = function(){\n  const recUrl = document.getElementById('f_sheetUrlRecords').value.trim();\n  const repUrl = document.getElementById('f_sheetUrlReports').value.trim();\n  const goalUrl = document.getElementById('f_sheetUrlGoals').value.trim();\n  if(!App.db.meta.sheetUrls) App.db.meta.sheetUrls = {};\n  App.db.meta.sheetUrls.records = recUrl;\n  App.db.meta.sheetUrls.reports = repUrl;\n  App.db.meta.sheetUrls.goals = goalUrl;\n  App.save();\n  App.util.toast('구글시트 주소가 저장되었습니다');\n  UI.render();\n};\n\n// 미리보기 화면에서 \"행사자 연결\" (미반영 상태의 임시 매칭)\nActions.openMatchStaffModal = function(rawName, mode){\n  // mode: 'staging' (업로드 전 미리보기) | 'committed' (이미 저장된 데이터의 매칭 필요 항목)\n  Views._matchPickerQuery = '';\n  Actions._renderMatchStaffModal(rawName, mode);\n};\nActions._renderMatchStaffModal = function(rawName, mode){\n  const q = Views._matchPickerQuery||'';\n  const candidates = App.db.staff.filter(s=>!q || s.name.includes(q)).slice(0,50);\n  const listHtml = candidates.map(s=>\n    `<div class=\"item-row\" style=\"cursor:pointer;\" onclick=\"Actions.confirmMatchStaff('${App.util.esc(rawName).replace(/'/g,\"\\\\'\")}','${s.id}','${mode}')\">\n      <div class=\"staff-avatar\">${App.util.esc(s.name[0]||'?')}</div>\n      <div class=\"content\"><div class=\"title\">${App.util.esc(s.name)}</div><div class=\"meta\">${App.util.esc(s.store||'-')}</div></div>\n    </div>`\n  ).join('') || `<div class=\"empty-state\" style=\"padding:20px;\"><div class=\"emoji\">🔍</div>일치하는 행사자가 없습니다.</div>`;\n\n  UI.openModal(`\n    <h2>행사자 연결</h2>\n    <p style=\"font-size:13px;color:var(--text-secondary);margin-bottom:10px;\">\n      활동일보 사원명 \"<b>${App.util.esc(rawName)}</b>\"을(를) 어떤 행사자와 연결할까요?<br>\n      한 번 연결하면 다음 업로드부터 자동으로 적용됩니다.\n    </p>\n    <input type=\"text\" placeholder=\"행사자명 검색\" value=\"${App.util.esc(q)}\"\n      oninput=\"Views._matchPickerQuery=this.value;Actions._renderMatchStaffModal('${App.util.esc(rawName).replace(/'/g,\"\\\\'\")}','${mode}')\" style=\"margin-bottom:10px;\">\n    <div id=\"matchPickerList\" style=\"max-height:320px;overflow-y:auto;\">${listHtml}</div>\n    <div class=\"modal-actions\"><button class=\"btn\" onclick=\"UI.closeModal()\">취소</button></div>`);\n};\n\nActions.confirmMatchStaff = function(rawName, staffId, mode){\n  // 별칭매핑 저장 -> 다음 업로드부터 자동 적용\n  App.db.nameAliasMap[rawName] = staffId;\n  App.save();\n\n  if(mode==='staging' && Views._reportStaging){\n    Views._reportStaging.rows.forEach(r=>{\n      if(r.staffName===rawName){ r.matchedStaffId = staffId; r.isMatched = true; }\n    });\n  }else{\n    // 이미 저장된 데이터: 해당 사원명의 모든 활동일보를 일괄 연결\n    App.db.activityReports.forEach(r=>{\n      if(r.staffName===rawName){ r.matchedStaffId = staffId; r.isMatched = true; }\n    });\n    App.save();\n  }\n  UI.closeModal();\n  App.util.toast('행사자와 연결되었습니다');\n  UI.render();\n};\n\n// 미리보기 -> 실제 저장 반영\nActions.commitActivityReports = function(silent){\n  const staging = Views._reportStaging;\n  if(!staging) return null;\n\n  let added=0, updated=0, skipped=0, unmatched=0;\n  staging.rows.forEach(r=>{\n    const key = App._reportKey(r);\n    const existing = App.db.activityReports.find(x=>App._reportKey(x)===key);\n    if(!r.matchedStaffId) unmatched++;\n\n    if(existing){\n      const fieldsSame = ['managementSignal','storeInventory','tastingEvent','managerAction','salesRequest','safetyPrevention','storeEnvironment']\n        .every(f=> (existing[f]||'') === (r[f]||''));\n      if(fieldsSame){ skipped++; }\n      else{\n        Object.assign(existing, {\n          managementSignal:r.managementSignal, storeInventory:r.storeInventory, tastingEvent:r.tastingEvent,\n          managerAction:r.managerAction, salesRequest:r.salesRequest, safetyPrevention:r.safetyPrevention,\n          storeEnvironment:r.storeEnvironment, matchedStaffId:r.matchedStaffId, isMatched:r.isMatched,\n          dept:r.dept, managerName:r.managerName\n        });\n        updated++;\n      }\n    }else{\n      App.db.activityReports.push({\n        id: App.uid('report'),\n        dept:r.dept, managerName:r.managerName, visitDate:r.visitDate,\n        directStore:r.directStore, secondaryStore:r.secondaryStore, staffName:r.staffName,\n        matchedStaffId:r.matchedStaffId, managementSignal:r.managementSignal, storeInventory:r.storeInventory,\n        tastingEvent:r.tastingEvent, managerAction:r.managerAction, salesRequest:r.salesRequest,\n        safetyPrevention:r.safetyPrevention, storeEnvironment:r.storeEnvironment,\n        uploadedAt: App.util.todayStr(), sourceFile: staging.fileName, isMatched: r.isMatched\n      });\n      added++;\n    }\n  });\n\n  App.db.meta.lastActivityUpload = { fileName: staging.fileName, date: App.util.todayStr() };\n  App.save();\n\n  const total = staging.rows.length;\n  Views._reportStaging = null;\n  const summary = { total, added, updated, skipped, unmatched };\n\n  if(!silent){\n    UI.openModal(`\n      <h2>활동일보 업로드 완료</h2>\n      <div class=\"report-box\" style=\"white-space:pre-wrap;\">✅ 전체 ${total}건\n✅ 신규 등록 ${added}건\n🔄 기존 데이터 업데이트 ${updated}건\n⏭️ 중복 제외 ${skipped}건\n⚠️ 행사자 매칭 필요 ${unmatched}건</div>\n      <div class=\"modal-actions\">\n        ${unmatched? `<button class=\"btn\" onclick=\"UI.closeModal();Views._reportListState.tab='unmatched';UI.render();\">매칭 필요 데이터 확인</button>`:''}\n        <button class=\"btn primary\" onclick=\"UI.closeModal();UI.render();\">확인</button>\n      </div>`);\n  }\n  return summary;\n};\n\nActions.cancelReportStaging = function(){\n  Actions.confirm('업로드를 취소하시겠습니까? 미리보기 중인 데이터는 저장되지 않습니다.', ()=>{\n    Views._reportStaging = null;\n    UI.render();\n  });\n};\n\n/* ---- 활동일보 페이지 ---- */\nViews.activityReports = function(){\n  UI.setTitle('활동일보 업로드', '매니저 활동일보 엑셀을 업로드하면 행사자별로 자동 연동됩니다');\n\n  const lastUp = App.db.meta.lastActivityUpload;\n  let html = `<div class=\"card\">\n    <div style=\"font-weight:800;margin-bottom:8px;\">📋 활동일보 엑셀 업로드</div>\n    <div id=\"reportDropZone\" style=\"border:2px dashed var(--border);border-radius:var(--radius-sm);padding:22px;text-align:center;margin-bottom:12px;\"\n      ondragover=\"event.preventDefault();\" ondrop=\"Actions.handleReportDrop(event)\">\n      <div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:10px;\">여기로 파일을 드래그하거나 아래에서 선택하세요 (.xlsx, .xls)</div>\n      <input type=\"file\" accept=\".xlsx,.xls\" onchange=\"Actions.importActivityReportExcel(this.files[0]); this.value='';\">\n    </div>\n    <div style=\"font-size:12.5px;color:var(--text-secondary);\">\n      마지막 업로드: ${lastUp? `${App.util.esc(lastUp.fileName)} · ${lastUp.date}` : '없음'}\n    </div>\n  </div>`;\n\n  if(Views._reportStaging){\n    html += Views._reportPreviewHtml();\n    document.getElementById('view').innerHTML = html;\n    return;\n  }\n\n  const st = Views._reportListState;\n  const totalCount = App.db.activityReports.length;\n  const unmatchedNames = [...new Set(App.db.activityReports.filter(r=>!r.isMatched).map(r=>r.staffName))];\n\n  html += `<div class=\"tabs\">\n    <div class=\"tab-btn ${st.tab==='list'?'active':''}\" onclick=\"Views._reportListState.tab='list';UI.render()\">전체 목록 <span class=\"cnt\">${totalCount}</span></div>\n    <div class=\"tab-btn ${st.tab==='unmatched'?'active':''}\" onclick=\"Views._reportListState.tab='unmatched';UI.render()\">매칭 필요 <span class=\"cnt\">${unmatchedNames.length}</span></div>\n  </div>`;\n\n  html += st.tab==='unmatched' ? Views._reportUnmatchedHtml() : Views._reportListHtml();\n\n  document.getElementById('view').innerHTML = html;\n};\n\nViews._reportPreviewHtml = function(){\n  const staging = Views._reportStaging;\n  const rows = staging.rows;\n  const total = rows.length;\n  const unmatchedNames = [...new Set(rows.filter(r=>!r.matchedStaffId).map(r=>r.staffName))];\n  const unmatchedCount = rows.filter(r=>!r.matchedStaffId).length;\n  const matchedCount = total - unmatchedCount;\n\n  let html = `<div class=\"card\">\n    <div style=\"font-weight:800;margin-bottom:10px;\">업로드 데이터 미리보기 — \"${App.util.esc(staging.fileName)}\"</div>\n    <div class=\"report-box\" style=\"white-space:pre-wrap;\">전체 활동일보 ${total}건\n\n✅ 행사자 자동 매칭 가능: ${matchedCount}건\n⚠️ 행사자 확인 필요: ${unmatchedCount}건</div>\n  </div>`;\n\n  if(unmatchedNames.length){\n    html += `<div class=\"section-title\">⚠️ 매칭되지 않은 행사자 <span class=\"cnt\">${unmatchedNames.length}</span></div>\n    <div class=\"card\" style=\"padding:8px 12px;\">`;\n    unmatchedNames.forEach(name=>{\n      const sample = rows.find(r=>r.staffName===name);\n      const cnt = rows.filter(r=>r.staffName===name).length;\n      html += `<div class=\"item-row\">\n        <div class=\"content\"><div class=\"title\">${App.util.esc(name)} <span class=\"badge neutral\">매칭 필요</span></div>\n          <div class=\"meta\">${cnt}건 · 방문일 ${sample.visitDate||'-'} · ${App.util.esc(sample.directStore||'-')} ${App.util.esc(sample.secondaryStore||'')}</div></div>\n        <button class=\"btn sm\" onclick=\"Actions.openMatchStaffModal('${App.util.esc(name).replace(/'/g,\"\\\\'\")}','staging')\">행사자 연결</button>\n      </div>`;\n    });\n    html += '</div>';\n  }\n\n  html += `<div class=\"section-title\">미리보기 데이터</div>\n  <div class=\"card\"><div style=\"overflow-x:auto;\"><table class=\"staff-table\"><thead><tr>\n    <th>방문일</th><th>사원명</th><th>매장명</th><th>관리신호</th><th>매니저조치사항</th>\n  </tr></thead><tbody>`;\n  rows.slice(0,50).forEach(r=>{\n    html += `<tr><td>${r.visitDate||'-'}</td><td>${App.util.esc(r.staffName)}${!r.matchedStaffId?' <span class=\"badge neutral\">확인필요</span>':''}</td>\n      <td>${App.util.esc(r.directStore||'-')} ${App.util.esc(r.secondaryStore||'')}</td>\n      <td>${App.util.esc(r.managementSignal||'-')}</td>\n      <td>${App.util.esc((r.managerAction||'').slice(0,30))}</td></tr>`;\n  });\n  if(rows.length>50){\n    html += `<tr><td colspan=\"5\" style=\"text-align:center;color:var(--text-secondary);\">외 ${rows.length-50}건...</td></tr>`;\n  }\n  html += '</tbody></table></div></div>';\n\n  if(staging.errors.length){\n    html += `<div class=\"section-title\" style=\"color:var(--improve);\">건너뛴 행 / 오류 <span class=\"cnt\">${staging.errors.length}</span></div>\n    <div class=\"card\"><div class=\"report-box\" style=\"max-height:160px;overflow-y:auto;font-size:12.5px;\">${staging.errors.map(e=>App.util.esc(e)).join('<br>')}</div></div>`;\n  }\n\n  html += `<div class=\"card\" style=\"display:flex;gap:10px;justify-content:flex-end;\">\n    <button class=\"btn\" onclick=\"Actions.cancelReportStaging()\">취소</button>\n    <button class=\"btn primary\" onclick=\"Actions.commitActivityReports()\">업로드하고 행사자 관리에 반영</button>\n  </div>`;\n  return html;\n};\n\nViews._reportListHtml = function(){\n  const st = Views._reportListState;\n  let list = App.db.activityReports.slice();\n\n  if(st.q.trim()) list = list.filter(r=>r.staffName.includes(st.q.trim()));\n\n  list.sort((a,b)=> (b.visitDate||'').localeCompare(a.visitDate||''));\n\n  let html = `<div class=\"card\">\n    <div class=\"toolbar\">\n      <input class=\"grow\" type=\"text\" placeholder=\"행사자명으로 검색\" value=\"${App.util.esc(st.q)}\" oninput=\"Views._reportListState.q=this.value;UI.render()\">\n    </div>`;\n\n  if(list.length===0){\n    html += `<div class=\"empty-state\"><div class=\"emoji\">📋</div>조건에 맞는 활동일보가 없습니다.</div>`;\n  }else{\n    html += `<div style=\"overflow-x:auto;\"><table class=\"staff-table\"><thead><tr>\n      <th>방문일</th><th>사원명</th><th>매장</th><th>관리신호</th><th></th>\n    </tr></thead><tbody>`;\n    list.forEach(r=>{\n      const expanded = Views._reportExpandedId===r.id;\n      html += `<tr class=\"row\" onclick=\"Views._reportExpandedId=Views._reportExpandedId==='${r.id}'?null:'${r.id}';UI.render()\">\n        <td>${r.visitDate||'-'}</td>\n        <td>${App.util.esc(r.staffName)}${!r.isMatched?' <span class=\"badge neutral\">매칭필요</span>':''}</td>\n        <td>${App.util.esc(r.directStore||'-')} ${App.util.esc(r.secondaryStore||'')}</td>\n        <td>${App.util.esc(r.managementSignal||'-')}</td>\n        <td>${expanded?'▲':'▼'}</td>\n      </tr>`;\n      if(expanded){\n        html += `<tr><td colspan=\"5\" style=\"background:var(--bg-soft);\">\n          <div style=\"padding:12px;font-size:13px;line-height:1.8;\">\n            <b>매니저명:</b> ${App.util.esc(r.managerName||'-')}<br>\n            <b>매장재고:</b> ${App.util.esc(r.storeInventory||'-')}<br>\n            <b>시식행사:</b> ${App.util.esc(r.tastingEvent||'-')}<br>\n            <b>매니저조치사항:</b> ${App.util.esc(r.managerAction||'-')}<br>\n            <b>영업요청사항:</b> ${App.util.esc(r.salesRequest||'-')}<br>\n            <b>안전예방:</b> ${App.util.esc(r.safetyPrevention||'-')}<br>\n            <b>매장환경:</b> ${App.util.esc(r.storeEnvironment||'-')}<br>\n            <b>거래처DEPT:</b> ${App.util.esc(r.dept||'-')}\n          </div></td></tr>`;\n      }\n    });\n    html += '</tbody></table></div>';\n  }\n  html += '</div>';\n  return html;\n};\n\nViews._reportUnmatchedHtml = function(){\n  const unmatched = App.db.activityReports.filter(r=>!r.isMatched);\n  const names = [...new Set(unmatched.map(r=>r.
